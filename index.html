<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLSC ỐNG LÒ HƠI — NHIỆT ĐIỆN NGHI SƠN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- xlsx.full.min.js khong tai san o day nua - chi nap dong khi bam Nhap/Xuat Excel (xem ensureXLSX) -->
<style>
:root{
  --bg:#0d1b26; --panel:#132635; --panel2:#1a3245; --border:#274156; --border-soft:#1e3547;
  --text:#e9eef2; --muted:#8fa3b3; --dim:#54697a; --input-bg:#0d1b26;
  --accent:#4f8fe0; --accent-soft:#16324f;
  --danger:#e5484d; --danger-soft:#3a1f1d;
  --warn:#f0c419; --warn-soft:#3a3012;
  --good:#4fb88a; --good-soft:#163429;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --display:'Big Shoulders Display',sans-serif;
}
/* Giao dien sang (tuy chon nguoi dung, xem setTheme()) - dung mau thuong hieu EVN GENCO1 dam hon vi nen sang co do tuong phan khac nen toi */
html[data-theme="light"]{
  --bg:#f2f5f9; --panel:#ffffff; --panel2:#eef2f7; --border:#d7e0ea; --border-soft:#e3e9f0;
  --text:#16232e; --muted:#3d5266; --dim:#6b7f91; --input-bg:#e7edf4;
  --accent:#174f9a; --accent-soft:#dce8fb;
  --danger:#ec1c24; --danger-soft:#fbe0e1;
  --warn:#a67c00; --warn-soft:#fdf3d0;
  --good:#1f9d67; --good-soft:#dff5ea;
}
html[data-theme="light"] .field label{font-weight:700;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}
::selection{background:var(--accent);color:#ffffff;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand-row{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.logo-mark{width:38px;height:38px;flex-shrink:0;object-fit:contain;}
.login-brand .logo-mark{width:56px;height:56px;}
.brand-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
.brand-title{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;letter-spacing:.01em;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-size:13px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--text);border-color:var(--border);}
.nav-tag{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(135deg,var(--panel2),var(--bg));border:1px solid var(--border);color:var(--dim);flex-shrink:0;}
.nav-tag svg{width:17px;height:17px;}
.nav-item.active .nav-tag{color:var(--accent);border-color:var(--accent-soft);}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border-soft);margin-top:10px;}
.user-pill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.user-pill .u-role{font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:block;font-family:var(--mono);}
.logout-btn{background:none;border:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:4px 0 0;}
.tg-pill{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.dot.warn-dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.dot.off{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.bottom-nav{display:none;}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.page-title{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#ffffff;border:none;padding:10px 15px;border-radius:6px;font-size:12.5px;font-weight:600;}
.btn:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.btn-ghost:hover{background:var(--panel2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #4a2422;padding:6px 10px;border-radius:5px;font-size:11.5px;}
.file-btn{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.file-btn:hover{border-color:#3a4450;}
input[type=file]{display:none;}
.nk-photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.nk-photo-item{width:120px;}
.nk-photo-item input{background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 6px;font-size:11px;width:100%;box-sizing:border-box;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.lightbox-overlay img{max-width:100%;max-height:100%;border-radius:6px;}
.module-grid-mobile{display:none;}
@media(max-width:720px){
  .module-grid-mobile{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  .module-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 12px;text-align:left;font-size:12.5px;color:var(--text);}
  .module-tile:active{border-color:var(--accent);}
  .module-tile-tag{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent-soft),var(--panel2));border:1px solid var(--accent-soft);color:var(--accent);}
.module-tile-tag svg{width:21px;height:21px;}
}
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px;}
.stat-card.clickable{cursor:pointer;transition:border-color .15s;text-align:left;width:100%;font-family:inherit;}
.stat-card.clickable:hover{border-color:var(--accent-soft);}
.stat-card.clickable.expanded{border-color:var(--accent);}
.stat-card .lbl-row{display:flex;justify-content:space-between;align-items:center;}
.stat-card .caret{font-size:10px;color:var(--dim);}
.stat-card .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-card .val{font-family:var(--display);font-size:28px;font-weight:800;margin-top:5px;}
.stat-card.danger .val{color:var(--danger);}
.stat-card.warn .val{color:var(--warn);}
.stat-card.good .val{color:var(--good);}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:24px 0 10px;}
.record{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:9px;}
.record:hover{border-color:#3a4450;}
.tag-chip{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--dim);background:var(--input-bg);border:1px solid var(--border);border-radius:4px;padding:3px 7px;margin-right:8px;}
.record-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.record-loc{font-weight:600;font-size:13.5px;}
.record-meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.record-meta span{margin-right:12px;}
.status{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.status.good{background:var(--good-soft);color:var(--good);}
.status.warn{background:var(--warn-soft);color:var(--warn);}
.status.danger{background:var(--danger-soft);color:var(--danger);}
.record-note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--border-soft);padding-top:7px;}
.record-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);}
.mini-btn:hover{color:var(--text);border-color:#3a4450;}
.mini-btn.tg{color:#4aa3d6;}
.empty{color:var(--dim);font-size:13px;padding:26px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
.form-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:8px 9px;color:var(--text);font-size:13px;}
.field input:disabled{color:var(--muted);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:50px;}
.form-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap;}
.readonly-box{background:var(--input-bg);border:1px solid var(--border-soft);border-radius:6px;padding:8px 9px;font-family:var(--mono);font-size:13px;color:var(--accent);}
/* Bảng nhập/sửa Kiểm tra dạng ma trận (1 dòng = 1 Vị trí, cột = từng Lớp ống) */
.mtx-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-top:12px;}
table.mtx{border-collapse:collapse;font-size:12px;}
table.mtx th{background:var(--panel2);color:var(--muted);text-align:center;padding:7px 6px;font-weight:600;font-size:10.5px;border-bottom:1px solid var(--border);border-left:1px solid var(--border-soft);white-space:nowrap;position:sticky;top:0;}
table.mtx th:first-child,table.mtx td:first-child{position:sticky;left:0;background:var(--panel2);z-index:1;border-left:none;}
table.mtx td{padding:3px;border-bottom:1px solid var(--border-soft);border-left:1px solid var(--border-soft);text-align:center;vertical-align:middle;}
table.mtx td.mtx-vitri{font-size:12px;font-weight:600;padding:6px 10px;white-space:nowrap;}
table.mtx td.mtx-na{background:var(--panel2);color:var(--dim);font-size:14px;}
table.mtx td.mtx-conflict{background:var(--danger-soft);}
.mtx-input{width:56px;text-align:center;background:var(--input-bg);border:1px solid var(--border);border-radius:5px;padding:5px 3px;color:var(--text);font-size:12.5px;}
.mtx-input:focus{outline:none;border-color:var(--accent);}
td.mtx-good{background:var(--good-soft);}
td.mtx-warn{background:var(--warn-soft);}
td.mtx-danger{background:var(--danger-soft);}
.mtx-pct{font-size:9px;color:var(--muted);margin-top:1px;line-height:1.2;}
.diagram-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.diagram-row-label{min-width:110px;max-width:160px;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0;}
.diagram-row-cells{display:flex;flex-wrap:wrap;gap:4px;}
.diagram-cell{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border-soft);user-select:none;}
.diagram-cell:hover{outline:2px solid var(--accent);}
.diagram-cell.good{background:var(--good-soft);color:var(--good);}
.diagram-cell.warn{background:var(--warn-soft);color:var(--warn);}
.diagram-cell.danger{background:var(--danger-soft);color:var(--danger);}
.diagram-cell.na{background:var(--panel2);color:var(--dim);border-style:dashed;}
.mtx-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
.mtx-toolbar .field{min-width:110px;}
.mtx-rowdel{font-size:13px;color:var(--danger);cursor:pointer;padding:2px 6px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.dm{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
table.dm th{background:var(--panel2);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.dm td{padding:8px 10px;border-bottom:1px solid var(--border-soft);}
table.dm tr:last-child td{border-bottom:none;}
.cause-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
.cause-list{display:flex;flex-direction:column;gap:6px;}
.cause-item{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:11px 13px;color:var(--muted);font-size:13px;}
.cause-item.active{background:var(--panel2);color:var(--text);border-color:var(--accent-soft);}
.cause-item b{display:block;color:inherit;font-size:13.5px;margin-bottom:2px;}
.cause-detail{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;position:sticky;top:20px;}
.cause-detail h3{font-family:var(--display);font-size:21px;margin:0 0 4px;}
.cause-detail .cause-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.cause-detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:14px 0 7px;}
.cause-detail ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#c9cfd4;}
.settings-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;max-width:560px;margin-bottom:18px;}
.settings-note{background:var(--panel2);border:1px solid var(--border-soft);border-radius:7px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border-soft);margin-top:6px;}
.switch{width:38px;height:21px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#e7eaec;transition:left .15s;}
.switch.on::after{left:19px;}
.loading{padding:60px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.08em;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 25% 15%,#16324a 0%,var(--bg) 62%);}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px 26px;}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-title{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;}
.tabbtns{display:flex;gap:6px;margin-bottom:16px;background:var(--panel2);border-radius:7px;padding:3px;}
.tabbtn{flex:1;padding:8px;text-align:center;border-radius:5px;font-size:12.5px;color:var(--muted);background:none;border:none;}
.tabbtn.active{background:var(--accent);color:#ffffff;font-weight:600;}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;}
.weld-row{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--border-soft);border-radius:6px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;background:var(--input-bg);}
.weld-id{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:150px;}
.weld-chk{display:flex;align-items:center;gap:4px;color:var(--muted);}
.weld-badge{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:10px;text-transform:uppercase;}
.weld-badge.bp{background:var(--warn-soft);color:var(--warn);}
.weld-badge.official{background:var(--good-soft);color:var(--good);}
.repair-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:14px 16px;}
.repair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.progress-mini{font-family:var(--mono);font-size:11px;color:var(--muted);}
.section-sub{margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border-soft);}
@media(max-width:880px){
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .cause-grid{grid-template-columns:1fr;}
  .cause-detail{position:static;}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:720px){
  .sidebar{display:none;}
  .main{padding:16px 14px 90px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9px;padding:4px 5px;flex-shrink:0;}
  .bn-item.active{color:var(--accent);}
  .bn-tag{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:linear-gradient(135deg,var(--panel2),var(--bg));border:1px solid var(--border);}
.bn-tag svg{width:15px;height:15px;}
  .bn-item.active .bn-tag{border-color:var(--accent-soft);color:var(--accent);}
  .page-title{font-size:22px;}
  .grid-cards{grid-template-columns:1fr 1fr;}
}
.mic-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--muted);cursor:pointer;flex:none;}
.mic-btn svg{width:15px;height:15px;}
.mic-btn.listening{background:#e2564f;border-color:#e2564f;color:#fff;animation:micPulse 1s infinite;}
.voice-no .mic-btn,.voice-no .voice-fab{display:none!important;}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(226,86,79,.5);}70%{box-shadow:0 0 0 10px rgba(226,86,79,0);}100%{box-shadow:0 0 0 0 rgba(226,86,79,0);}}
.voice-fab{position:fixed;right:18px;bottom:88px;z-index:500;display:none;flex-direction:column;align-items:flex-end;gap:6px;}
.voice-fab.show{display:flex;}
.voice-fab-btn{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;}
.voice-fab-btn svg{width:24px;height:24px;}
.voice-fab-btn.listening{background:#e2564f;animation:micPulse 1.1s infinite;}
.voice-fab-hint{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:11.5px;padding:5px 9px;border-radius:7px;max-width:220px;text-align:right;}
@media (min-width:901px){ .voice-fab{bottom:24px;} }
.wizard-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:flex;align-items:flex-end;justify-content:center;}
.wizard-card{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;box-shadow:0 -8px 30px rgba(0,0,0,.4);}
.wizard-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px;}
.wizard-prompt{font-size:18px;font-weight:600;color:var(--text);line-height:1.4;}
.wizard-status{font-size:12.5px;color:var(--accent);margin-top:8px;min-height:16px;}
.wizard-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

// Lớp lưu trữ tương thích 2 môi trường: window.storage khi chạy trong Claude.ai,
// localStorage khi chạy độc lập (VD: host trên GitHub Pages) — window.storage không tồn tại ở đó.
const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);
async function storageGet(key, shared){
  if(HAS_CLAUDE_STORAGE){ try{ return await window.storage.get(key, shared); }catch(e){ return null; } }
  try{ const raw = localStorage.getItem((shared?'shared__':'priv__')+key); return raw!==null ? {key, value:raw, shared} : null; }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(HAS_CLAUDE_STORAGE){ try{ return await window.storage.set(key, value, shared); }catch(e){ return null; } }
  try{ localStorage.setItem((shared?'shared__':'priv__')+key, value); return {key, value, shared}; }catch(e){ return null; }
}
/* ---------- Nap dong (lazy-load) thu vien xlsx.js — chi tai khi that su dung Nhap/Xuat Excel ---------- */
let _xlsxLoadPromise = null;
function ensureXLSX(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _xlsxLoadPromise=null; reject(new Error('xlsx-load-fail')); };
    document.head.appendChild(s);
  });
  return _xlsxLoadPromise;
}
async function withXLSXReady(){
  try{ await ensureXLSX(); return true; }
  catch(e){ alert('Không tải được thư viện xử lý Excel (cần có mạng ở lần dùng đầu tiên). Vui lòng kiểm tra kết nối mạng rồi thử lại.'); return false; }
}

/* ---------- Bam mat khau an toan (SHA-256 qua Web Crypto API) ---------- */
async function sha256Hex(str){
  const buf = new TextEncoder().encode(String(str));
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return 'sha256:' + Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let _idSeq = 0;
function genId(prefix){
  // Ghep gio he thong + BO DEM NOI BO (tang dan tuyet doi, khong bao gio trung TRONG CUNG 1 phien lam viec
  // du goi hang tram/nghin lan lien tiep trong vong lap, vd nhap Excel hang loat) + chuoi ngau nhien 6 ky tu
  // (de gan nhu khong trung GIUA cac may/phien khac nhau dang thao tac cung luc).
  _idSeq++;
  return prefix+'-'+Date.now().toString(36)+'-'+_idSeq.toString(36)+Math.random().toString(36).slice(2,8);
}
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function simpleHash(str){ let h=0; str=String(str); for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return 'h'+Math.abs(h).toString(36); }

/* ---------- GIỌNG NÓI (Web Speech API) — đọc để điền liệu + tra cứu bằng giọng nói ---------- */
/* Ghi chú: dùng cho môi trường công trường nhiều bụi, tay có thể lấm bẩn/đeo găng, khó gõ phím.
   Nhận diện giọng nói chạy trên máy chủ của trình duyệt (cần mạng, giống như đồng bộ Google Sheet nên không phát sinh yêu cầu mới).
   Độ chính xác với thuật ngữ kỹ thuật/mã số có thể không tuyệt đối — luôn cho xem lại và sửa tay trước khi lưu. */
function voiceSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
let voiceRec = null, voiceListening = false;
function newVoiceRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'vi-VN'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
  return rec;
}
function isVoiceEditable(el){
  if(!el || !el.tagName) return false;
  if(el.tagName==='TEXTAREA') return !el.disabled && !el.readOnly;
  if(el.tagName==='INPUT') return !el.disabled && !el.readOnly && ['text','search','tel',''].includes(el.type);
  return false;
}
function showVoiceFab(){ const f=document.getElementById('voice-fab'); if(f) f.classList.add('show'); }
function hideVoiceFab(){ if(voiceListening) return; const f=document.getElementById('voice-fab'); if(f) f.classList.remove('show'); }
function voiceFabHint(text){
  const h=document.getElementById('voice-fab-hint'); if(!h) return;
  if(text){ h.textContent=text; h.style.display='block'; } else { h.style.display='none'; }
}
function insertTextAtCursor(el, text){
  if(!text) return;
  const existing = el.value || '';
  const start = el.selectionStart!=null?el.selectionStart:existing.length;
  const end = el.selectionEnd!=null?el.selectionEnd:existing.length;
  const needSep = start>0 && !/\s$/.test(existing.slice(0,start));
  const sep = needSep ? ' ' : '';
  el.value = existing.slice(0,start)+sep+text+' '+existing.slice(end);
  const pos = start+sep.length+text.length+1;
  try{ el.setSelectionRange(pos,pos); }catch(e){}
  el.focus();
}
window.toggleDictation = function(){
  if(voiceListening){ stopDictation(); return; }
  const target = document.activeElement;
  if(!isVoiceEditable(target)){ return; }
  if(!voiceSupported()){ alert('Trình duyệt này không hỗ trợ nhận diện giọng nói. Vui lòng nhập bằng bàn phím.'); return; }
  try{
    voiceRec = newVoiceRecognizer();
    voiceRec.onresult = e=>{
      let txt = '';
      for(let i=e.resultIndex;i<e.results.length;i++){ txt += e.results[i][0].transcript; }
      insertTextAtCursor(target, txt.trim());
    };
    voiceRec.onerror = e=>{
      voiceListening=false; updateFabListeningState();
      if(e.error!=='no-speech' && e.error!=='aborted') alert('Không nhận diện được giọng nói ('+e.error+'). Vui lòng thử lại hoặc nhập bằng bàn phím.');
    };
    voiceRec.onend = ()=>{ voiceListening=false; updateFabListeningState(); hideVoiceFab(); };
    voiceRec.start();
    voiceListening=true; updateFabListeningState();
  }catch(err){ voiceListening=false; updateFabListeningState(); }
};
function stopDictation(){ if(voiceRec){ try{ voiceRec.stop(); }catch(e){} } voiceListening=false; updateFabListeningState(); }
function updateFabListeningState(){
  const btn=document.getElementById('voice-fab-btn');
  if(btn) btn.classList.toggle('listening', voiceListening);
  voiceFabHint(voiceListening ? 'Đang nghe… bấm lại để dừng' : '');
}
document.addEventListener('focusin', e=>{
  if(isVoiceEditable(e.target)) showVoiceFab();
  else if(!e.target || !e.target.closest || !e.target.closest('#voice-fab')) hideVoiceFab();
});
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{ if(!isVoiceEditable(document.activeElement)) hideVoiceFab(); }, 80);
});
// Tra cứu bằng giọng nói: đọc ra, dò khớp gần đúng với danh sách lựa chọn có sẵn (bỏ qua dấu/hoa-thường)
function normalizeVN(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
}
function fuzzyPickOption(transcript, options){
  const t = normalizeVN(transcript);
  if(!t || !options.length) return null;
  let best=null, bestScore=-1;
  options.forEach(o=>{
    const l = normalizeVN(o.label);
    let score = 0;
    if(l===t) score=1000;
    else if(l.includes(t) || t.includes(l)) score=500-Math.abs(l.length-t.length);
    else {
      const tWords=t.split(' '), lWords=l.split(' ');
      score = tWords.filter(w=>w.length>1 && lWords.includes(w)).length*10;
    }
    if(score>bestScore){ bestScore=score; best=o; }
  });
  return bestScore>0 ? best : null;
}
window.startVoiceSearch = function(btnEl, onTranscript){
  if(!voiceSupported()){ alert('Trình duyệt này không hỗ trợ nhận diện giọng nói. Vui lòng gõ tay.'); return; }
  if(voiceListening) stopDictation();
  try{
    const rec = newVoiceRecognizer();
    btnEl.classList.add('listening');
    rec.onresult = e=>{ onTranscript((e.results[0][0].transcript||'').trim()); };
    rec.onend = ()=>{ btnEl.classList.remove('listening'); };
    rec.onerror = e=>{ btnEl.classList.remove('listening'); if(e.error!=='no-speech' && e.error!=='aborted') alert('Không nhận diện được giọng nói ('+e.error+'). Vui lòng thử lại hoặc gõ tay.'); };
    rec.start();
  }catch(err){ btnEl.classList.remove('listening'); }
};

/* ---------- HỘI THOẠI GIỌNG NÓI (voice wizard: app hỏi bằng giọng nói, người dùng trả lời bằng giọng nói) ---------- */
let _ttsKeepAlive = null;
function startTtsKeepAlive(){
  stopTtsKeepAlive();
  // Chrome co loi da biet: hang doi speechSynthesis tu tam dung sau ~15s khong hoat dong roi khong bao gio tiep tuc —
  // goi resume() dinh ky trong luc wizard dang mo de tranh bi "cam lang" giua chung
  if('speechSynthesis' in window){
    _ttsKeepAlive = setInterval(()=>{ try{ window.speechSynthesis.resume(); }catch(e){} }, 4000);
  }
}
function stopTtsKeepAlive(){ if(_ttsKeepAlive){ clearInterval(_ttsKeepAlive); _ttsKeepAlive=null; } }
function speak(text, onend){
  if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
  try{
    // chi huy hang doi neu that su dang co gi do dang doc/cho doc — goi cancel() thua co the kich hoat
    // loi "ket dinh" hang doi TTS tren mot so ban Chrome, khien cac lan doc sau khong bao gio chay nua
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; u.rate = 1;
    const voices = window.speechSynthesis.getVoices();
    const vi = voices.find(v=>v.lang && v.lang.toLowerCase().indexOf('vi')===0);
    if(vi) u.voice = vi;
    let done = false;
    const finish = ()=>{ if(done) return; done=true; if(onend) onend(); };
    u.onend = finish; u.onerror = finish; u.onstart = ()=>{};
    window.speechSynthesis.speak(u);
    // phong khi su kien onend khong bao gio ban (loi trinh duyet/webview, hang doi bi "ket") — dat timeout du phong
    setTimeout(finish, Math.max(3000, text.length*160));
  }catch(e){ if(onend) onend(); }
}
function ttsSupported(){ return ('speechSynthesis' in window); }
// Chuyen so doc bang tieng Viet ("hai muoi ba phay nam") thanh so thap phan — uu tien lay truc tiep chu so neu STT da tra ve dang so
const VN_ONES = {'khong':0,'mot':1,'hai':2,'ba':3,'bon':4,'tu':4,'nam':5,'lam':5,'nham':5,'sau':6,'bay':7,'tam':8,'chin':9};
function parseVNIntWords(text){
  let w = normalizeVN(text).split(' ').filter(t=>t && t!=='linh' && t!=='le');
  if(!w.length) return null;
  let hundred = 0;
  const tIdx = w.indexOf('tram');
  if(tIdx===1 && VN_ONES.hasOwnProperty(w[0])){ hundred = VN_ONES[w[0]]*100; w = w.slice(2); }
  else if(tIdx!==-1) return null;
  if(w.length===0) return hundred || null;
  let tens=0, unit=0, matched=false;
  if(w[0]==='muoi' || w[0]==='chuc'){
    tens=10; matched=true;
    const u = w[1]; if(u && VN_ONES.hasOwnProperty(u)) unit = VN_ONES[u];
  } else if(w.length>=2 && (w[1]==='muoi'||w[1]==='chuc') && VN_ONES.hasOwnProperty(w[0])){
    tens = VN_ONES[w[0]]*10; matched=true;
    const u = w[2]; if(u && VN_ONES.hasOwnProperty(u)) unit = VN_ONES[u];
  } else if(w.length===1 && VN_ONES.hasOwnProperty(w[0])){
    unit = VN_ONES[w[0]]; matched=true;
  }
  if(!matched && !hundred) return null;
  return hundred+tens+unit;
}
function parseVNNumber(text){
  if(!text) return null;
  let t = normalizeVN(text);
  const digitMatch = t.match(/-?\d+([.,]\d+)?/);
  if(digitMatch) return parseFloat(digitMatch[0].replace(',','.'));
  t = t.replace(/\bphet\b|\bphay\b|\bcham\b/g, ' PHAY ');
  const parts = t.split('PHAY').map(p=>p.trim()).filter(p=>p!=='');
  if(!parts.length) return null;
  const intPart = parseVNIntWords(parts[0]);
  if(intPart===null) return null;
  if(parts.length>1){
    const decPart = parseVNIntWords(parts[1]);
    if(decPart!==null) return parseFloat(intPart+'.'+decPart);
  }
  return intPart;
}
// Nhan lenh thoai co dinh: dung/sai/tiep/dung lai... — tra ve 'yes'|'no'|'stop'|'redo'|null
function matchVoiceCommand(text){
  const t = normalizeVN(text);
  if(!t) return null;
  const yes = ['dung','dung roi','ok','oke','vang','uh','tiep','tiep tuc','phai'];
  const no = ['sai','khong dung','khong phai','sua lai','lai'];
  const stop = ['xong','dung lai','thoi','ket thuc','huy','ngung'];
  if(stop.some(k=>t===k||t.includes(k))) return 'stop';
  if(no.some(k=>t===k||t.includes(k))) return 'no';
  if(yes.some(k=>t===k||t.includes(k))) return 'yes';
  return null;
}

function closeWizard(silent){
  if(voiceRec){ try{ voiceRec.stop(); }catch(e){} }
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  voiceListening=false;
  stopTtsKeepAlive();
  state.wizard = null;
  if(!silent) render();
}
window.closeWizard = closeWizard;
function wizardPromptText(step){
  const w = state.wizard;
  return typeof step.prompt==='function' ? step.prompt(w.data) : step.prompt;
}
function runWizardStep(){
  const w = state.wizard; if(!w) return;
  clearTextAutoAdvance();
  if(w.index>=w.steps.length){ finalizeWizard(); return; }
  const step = w.steps[w.index];
  if(step.kind==='resolve'){
    const idxAtStart = w.index;
    w.status='speaking'; w.transcript='Đang xử lý…'; render();
    const timeoutMs = 15000;
    let settled = false;
    const timer = setTimeout(()=>{
      if(settled) return; settled=true;
      if(!state.wizard || state.wizard.index!==idxAtStart) return;
      state.wizard.status='waiting-input'; state.wizard.transcript='Xử lý quá lâu (có thể do mạng chậm/mất kết nối Google Sheet).'; render();
    }, timeoutMs);
    Promise.resolve().then(()=>step.compute(w.data)).then(result=>{
      if(settled) return; settled=true; clearTimeout(timer);
      if(!state.wizard || state.wizard.index!==idxAtStart) return;
      state.wizard.status='speaking'; state.wizard.transcript=''; render();
      speak(result.message, ()=>{
        if(!state.wizard || state.wizard.index!==idxAtStart) return;
        if(result.fatal){ closeWizard(); if(result.alertMsg||result.message) alert(result.alertMsg||result.message); return; }
        if(result.ok) advanceWizard();
        else { state.wizard.index = Math.max(0, state.wizard.index + (result.backSteps||0)); runWizardStep(); }
      });
    }).catch(err=>{
      if(settled) return; settled=true; clearTimeout(timer);
      console.error('Lỗi bước xử lý trong hội thoại giọng nói:', err);
      if(!state.wizard || state.wizard.index!==idxAtStart) return;
      const msg = 'Đã xảy ra lỗi: '+(err && err.message ? err.message : String(err));
      state.wizard.status='waiting-input'; state.wizard.transcript=msg; render();
      alert(msg+'\n\nDữ liệu bước này có thể chưa được lưu. Anh có thể bấm mic để thử lại bước hiện tại, hoặc bấm Đóng để chuyển sang nhập tay.');
    });
    return;
  }
  w.status='speaking'; w.transcript=''; w.pendingConfirm=null; render();
  const promptText = wizardPromptText(step);
  const idxAtStart = w.index;
  speak(promptText, ()=>{ if(state.wizard && state.wizard.index===idxAtStart) beginListenForStep(); });
}
function beginListenForStep(){
  const w = state.wizard; if(!w) return;
  const idxAtStart = w.index;
  if(!voiceSupported()){ w.status='waiting-input'; render(); return; }
  w.status='listening'; render();
  try{
    const rec = newVoiceRecognizer();
    voiceRec = rec;
    rec.onresult = e=>{
      if(!state.wizard || state.wizard.index!==idxAtStart) return;
      const txt = (e.results[0][0].transcript||'').trim();
      handleWizardTranscript(txt);
    };
    rec.onerror = ()=>{ if(state.wizard && state.wizard.index===idxAtStart){ state.wizard.status='waiting-input'; render(); } };
    rec.onend = ()=>{ if(state.wizard && state.wizard.index===idxAtStart && state.wizard.status==='listening'){ state.wizard.status='waiting-input'; render(); } };
    rec.start();
  }catch(err){ w.status='waiting-input'; render(); }
}
function handleWizardTranscript(txt){
  const w = state.wizard; if(!w) return;
  w.transcript = txt;
  const step = w.steps[w.index];
  if(w.pendingConfirm){
    const cmd = matchVoiceCommand(txt);
    if(cmd==='yes'){ applyPendingConfirm(true); return; }
    if(cmd==='no'){ applyPendingConfirm(false); return; }
    speak('Anh nói đúng hay sai?', ()=>beginListenForStep());
    return;
  }
  const cmd0 = matchVoiceCommand(txt);
  if(cmd0==='stop'){ closeWizard(); return; }
  processStepAnswer(step, txt);
}
function processStepAnswer(step, txt){
  const w = state.wizard; if(!w) return;
  const norm = normalizeVN(txt);
  if(step.kind==='choice'){
    if(step.optional && (!txt || /^(bo qua|khong co|k co)$/.test(norm))){
      w.data[step.key]=''; w.data[step.key+'_label']=''; advanceWizard(); return;
    }
    const opts = step.getOptions(w.data);
    const best = fuzzyPickOption(txt, opts);
    if(!best){ speak('Không nhận ra, anh nói lại '+step.label.toLowerCase()+' được không?', ()=>beginListenForStep()); return; }
    w.data[step.key]=best.value; w.data[step.key+'_label']=best.label;
    if(step.onPick){ step.onPick(best.value, w.data); return; }
    if(step.confirm){ askConfirm(best.label, ()=>advanceWizard(), ()=>runWizardStep()); }
    else { advanceWizard(); }
  } else if(step.kind==='number'){
    const val = parseVNNumber(txt);
    if(val===null){ speak('Không nghe rõ số, anh đọc lại '+step.label.toLowerCase()+' được không?', ()=>beginListenForStep()); return; }
    w.data[step.key]=val;
    const readback = String(val).replace('.', ' phẩy ')+(step.unit?(' '+step.unit):'');
    askConfirm(readback, ()=>advanceWizard(), ()=>runWizardStep());
  } else {
    if(step.optional && (!txt || /^(bo qua|khong co)$/.test(norm))){ w.data[step.key]=''; advanceWizard(); return; }
    w.data[step.key] = ((w.data[step.key]||'') + (w.data[step.key]?' ':'') + txt).trim();
    w.status='review'; render();
    scheduleTextAutoAdvance();
  }
}
// Sau khi ghi nhan 1 cau tra loi dang van ban tu do (VD tung muc Nhat ky thi cong), thay vi co doan
// nghe tiep de tu doan lenh thoai (de nham lan: cau noi tiep theo chi can chua tu "phai"/"vang"/"tiep"...
// la bi hieu nham thanh lenh dieu khien, mat noi dung that su) — gio chi cho im lang roi tu qua muc ke.
// Neu nguoi dung muon noi them, bam lai nut mic (dung dung duong nghe chuan, da xac nhan chay on).
function scheduleTextAutoAdvance(){
  const w = state.wizard; if(!w) return;
  const idxAtStart = w.index;
  if(w._advanceTimer) clearTimeout(w._advanceTimer);
  w._advanceTimer = setTimeout(()=>{
    if(state.wizard && state.wizard.index===idxAtStart) advanceWizard();
  }, 4000);
}
function clearTextAutoAdvance(){
  const w = state.wizard; if(w && w._advanceTimer){ clearTimeout(w._advanceTimer); w._advanceTimer=null; }
}
function askConfirm(readbackLabel, onYes, onNo){
  const w = state.wizard; if(!w) return;
  w.pendingConfirm = {onYes, onNo};
  w.status='confirming'; render();
  const idxAtStart = w.index;
  speak('Anh vừa đọc: '+readbackLabel+'. Đúng không?', ()=>{ if(state.wizard && state.wizard.index===idxAtStart) beginListenForStep(); });
}
function applyPendingConfirm(isYes){
  const w = state.wizard; if(!w) return;
  const pc = w.pendingConfirm; w.pendingConfirm=null;
  if(isYes){ if(pc && pc.onYes) pc.onYes(); } else { if(pc && pc.onNo) pc.onNo(); }
}
window.wizardManualConfirm = function(isYes){ applyPendingConfirm(isYes); };
window.wizardManualNext = function(){ advanceWizard(); };
window.wizardManualRedo = function(){ runWizardStep(); };
window.wizardManualSkip = function(){
  const w=state.wizard; if(!w) return; const step=w.steps[w.index];
  w.data[step.key]=''; advanceWizard();
};
window.wizardSetTextValue = function(val){
  const w=state.wizard; if(!w) return; const step=w.steps[w.index];
  w.data[step.key]=val;
};
window.wizardChoicePick = function(value, label){
  const w=state.wizard; if(!w) return; const step=w.steps[w.index];
  w.data[step.key]=value; w.data[step.key+'_label']=label;
  if(step.onPick){ step.onPick(value, w.data); return; }
  if(step.confirm){ askConfirm(label, ()=>advanceWizard(), ()=>runWizardStep()); }
  else { advanceWizard(); }
};
window.wizardNumberManualConfirm = function(){
  const w=state.wizard; if(!w) return; const step=w.steps[w.index];
  const el = document.getElementById('wizard-num-input'); if(!el) return;
  const val = parseVNNumber(el.value);
  if(val===null){ alert('Vui lòng nhập số hợp lệ.'); return; }
  w.data[step.key]=val;
  const readback = String(val).replace('.', ' phẩy ')+(step.unit?(' '+step.unit):'');
  askConfirm(readback, ()=>advanceWizard(), ()=>runWizardStep());
};
window.wizardTapListen = function(){ clearTextAutoAdvance(); beginListenForStep(); };
function advanceWizard(){
  const w = state.wizard; if(!w) return;
  clearTextAutoAdvance();
  if(voiceRec){ try{ voiceRec.stop(); }catch(e){} }
  w.index++; w.pendingConfirm=null;
  runWizardStep();
}
function finalizeWizard(){
  const w = state.wizard; if(!w) return;
  const data = w.data; const onDone = w.onDone;
  if(onDone) onDone(data);
}
function renderWizardModal(){
  const w = state.wizard; if(!w) return '';
  const step = w.steps[w.index];
  if(!step) return `<div class="wizard-overlay"><div class="wizard-card"><div class="wizard-head"><span>${esc(w.title)}</span></div><div class="wizard-prompt">Đang lưu…</div></div></div>`;
  const statusLabel = {speaking:'🔊 Đang đọc câu hỏi…', listening:'🎤 Đang nghe…', confirming:'🔊 Đang xác nhận…', 'waiting-input':'Chưa nghe rõ — bấm mic để nói lại, hoặc nhập tay bên dưới', review:'✓ Đã ghi nhận'}[w.status] || '';
  const promptText = wizardPromptText(step);
  const progress = 'Bước '+(w.index+1)+'/'+w.steps.length;
  let bodyHtml;
  if(w.pendingConfirm){
    bodyHtml = `<div class="wizard-actions"><button class="btn" onclick="wizardManualConfirm(true)">✓ Đúng</button><button class="btn-ghost" onclick="wizardManualConfirm(false)">✗ Nói lại</button></div>`;
  } else if(step.kind==='text'){
    bodyHtml = `<textarea id="wizard-text-input" rows="3" style="width:100%;margin-top:10px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 9px;font-size:13px;" oninput="wizardSetTextValue(this.value)">${esc(w.data[step.key]||'')}</textarea>
      <div class="wizard-actions"><button class="btn-ghost" onclick="wizardTapListen()">🎤 Nói</button><button class="btn" onclick="wizardManualNext()">Tiếp tục ▸</button>${step.optional?`<button class="btn-ghost" onclick="wizardManualSkip()">Bỏ qua</button>`:''}</div>`;
  } else if(step.kind==='number'){
    bodyHtml = `<input id="wizard-num-input" type="number" step="0.01" inputmode="decimal" style="width:100%;margin-top:10px;font-size:20px;text-align:center;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 9px;" value="${w.data[step.key]!=null?esc(String(w.data[step.key])):''}">
      <div class="wizard-actions"><button class="btn-ghost" onclick="wizardTapListen()">🎤 Nói</button><button class="btn" onclick="wizardNumberManualConfirm()">Xác nhận</button></div>`;
  } else if(step.kind==='resolve'){
    bodyHtml = w.status==='waiting-input'
      ? `<div class="wizard-actions"><button class="btn" onclick="wizardManualRedo()">Thử lại</button><button class="btn-ghost" onclick="closeWizard()">Đóng, chuyển sang nhập tay</button></div>`
      : `<div class="wizard-status" style="margin-top:6px;">⏳ Đang xử lý dữ liệu…</div>`;
  } else {
    const opts = step.getOptions(w.data);
    bodyHtml = `<select style="width:100%;margin-top:10px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 9px;font-size:13px;" onchange="const o=this.options[this.selectedIndex]; wizardChoicePick(this.value, o.text)">
      <option value="">— chọn ${esc(step.label.toLowerCase())} —</option>
      ${opts.map(o=>`<option value="${esc(o.value)}" ${w.data[step.key]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select>
      <div class="wizard-actions"><button class="btn-ghost" onclick="wizardTapListen()">🎤 Nói</button>${step.optional?`<button class="btn-ghost" onclick="wizardManualSkip()">Bỏ qua</button>`:''}</div>`;
  }
  return `<div class="wizard-overlay">
    <div class="wizard-card">
      <div class="wizard-head"><span>${esc(w.title)} · ${esc(progress)}</span><button class="mini-btn" onclick="closeWizard()">Đóng</button></div>
      <div class="wizard-prompt">${esc(promptText)}</div>
      <div class="wizard-status">${statusLabel}${w.transcript?(' — nghe được: "'+esc(w.transcript)+'"'):''}</div>
      ${bodyHtml}
    </div>
  </div>`;
}

async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms || 12000);
  try{ return await fetch(url, {signal: ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function fetchSheet(type){
  try{
    const res = await fetchWithTimeout(SHEET_URL+'?type='+type, 30000);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data || !data.ok) return null;
    return data.rows;
  }catch(e){ console.error('Không lấy được dữ liệu từ Google Sheet (hoặc quá thời gian chờ):', type, e); return null; }
}
let _lastSyncError = '';
async function fetchSheetAll(){
  try{
    const res = await fetchWithTimeout(SHEET_URL+'?type=all', 30000);
    if(!res.ok){ _lastSyncError = 'Máy chủ trả về lỗi HTTP '+res.status; return null; }
    const data = await res.json();
    if(!data || !data.ok){ _lastSyncError = (data && data.error) ? String(data.error) : 'Phản hồi không đúng định dạng mong đợi (thiếu trường "ok")'; return null; }
    _lastSyncError = '';
    return data;
  }catch(e){
    _lastSyncError = e.name==='AbortError' ? 'Quá thời gian chờ (30 giây) — Google Apps Script phản hồi quá chậm' : ('Lỗi mạng/CORS: '+(e.message||String(e)));
    console.error('Không lấy được dữ liệu tổng hợp từ Google Sheet:', e);
    return null;
  }
}

// Sau khi anh vua upload (base64) len Google Drive qua syncToSheet('upload_anh',...) va da co phan hoi thanh cong,
// goi lai ham nay de lay dung Link Drive that (thay vi giu mai anh xem tam bang base64 luu tren may) — nho luc
// syncToSheet() gio da doc duoc phan hoi that (sua o ban truoc), thoi diem goi ham nay la luc server da luu xong.
async function refreshHinhAnhFromSheet(){
  const rows = await fetchSheet('hinh_anh');
  if(!rows) return;
  const fresh = mapSheetHinhAnh(rows);
  const freshById = {}; fresh.forEach(f=>{ freshById[f.id]=f; });
  // CHI thay anh xem tam (base64) bang ban tren Sheet khi ban tren Sheet co Link Drive THAT (khac rong) —
  // neu Link Drive tren Sheet dang rong (upload Drive that bai o Apps Script), TUYET DOI khong ghi de,
  // giu nguyen anh xem tam dang co de nguoi dung van thay duoc anh, tranh loi da tung gap: anh dang hien tot
  // bi thay bang link rong roi bien mat hoan toan.
  state.hinhAnh = state.hinhAnh.map(h=>{
    const f = freshById[h.id];
    if(f && f.link) return f;
    if(f && !f.link) return Object.assign({}, h, {tenAnh:f.tenAnh||h.tenAnh, uploadFailed:true});
    return h;
  });
  fresh.forEach(f=>{ if(f.link && !state.hinhAnh.some(h=>h.id===f.id)) state.hinhAnh.unshift(f); });
  await persist('hinh-anh', state.hinhAnh, true);
  render();
}

      welds:[]
    };
  }).filter(i=>i.id);
  const byItemId = {};
  items.forEach(i=>{ byItemId[i.id]=i; });
  (weldRows||[]).forEach(r=>{
    const itemId = String(r['Mã hạng mục']||'');
    const item = byItemId[itemId];
    if(!item) return; // mối hàn mồ côi (hạng mục tương ứng không còn) — bỏ qua
    item.welds.push({

      daCat:String(r['Đã cắt']||'')==='X', daHan:String(r['Đã hàn']||'')==='X',

      viTriThucTe:String(r['Vị trí thực tế']||'')
    });

async function syncFromSheetInBackground(){
  const all = await fetchSheetAll();
  if(!all){
    state.offlineUsers = state.offlineDanhMuc = state.offlineDots = state.offlineKiemTra = state.offlineSuaChua = state.offlineVatTu = true;
    state.syncErrorDetail = _lastSyncError || 'Không rõ nguyên nhân';
    state.syncing = false; render();
    return;
  }
  state.syncErrorDetail = '';
  state.anhFolderUrl = all.anhFolderUrl || '';
  const offlineSheetNames = [];
  const applyDefensive = async (key, sheetRows, mapFn, storageKey, label)=>{
    const rawCount = (sheetRows||[]).length;
    const mapped = mapFn(sheetRows||[]);
    const localArr = state[key];
    if(mapped.length>0 || localArr.length===0){
      state[key] = mapped.length? mapped : (key==='danhMuc' ? seedDanhMuc() : mapped);
      await persist(storageKey, state[key], true);
      return false; // online
    }
    const reason = rawCount===0 ? 'sheet trả về 0 dòng (rỗng hoặc tên tab/khoảng đọc bị sai ở Apps Script)' : (rawCount+' dòng thô nhưng không dòng nào khớp được tên cột mong đợi');
    console.warn('Sheet "'+label+'" ('+key+'): '+reason+' — đang giữ bản sao cục bộ.');
    offlineSheetNames.push(label+' ('+reason+')');
    return true; // offline/không đáng tin
  };

  state.offlineUsers = await applyDefensive('users', all.users, mapSheetUsers, 'users', 'Tài khoản (Users)');
  if(state.session){ const u = state.users.find(x=>x.email===state.session.email); if(u) state.session = u; }
  state.offlineDots = await applyDefensive('dots', all.dot, mapSheetDot, 'dots', 'Đợt (Dot)');
  state.offlineDanhMuc = await applyDefensive('danhMuc', all.danh_muc, mapSheetDanhMuc, 'danh-muc', 'Danh mục kỹ thuật (DanhMuc)');
  state.offlineKiemTra = await applyDefensive('kiemTra', all.kiem_tra, mapSheetKiemTra, 'kiem-tra', 'Kiểm tra (KiemTra)');

  const mappedSC = mapSheetSuaChua(all.sua_chua_item||[], all.sua_chua_weld||[]);
  if(mappedSC.length>0 || state.suaChua.length===0){ state.suaChua = mappedSC; await persist('sua-chua', state.suaChua, true); state.offlineSuaChua=false; }
  else {
    const rawCount = (all.sua_chua_item||[]).length;
    const reason = rawCount===0 ? 'sheet trả về 0 dòng' : (rawCount+' dòng thô nhưng không khớp tên cột');
    console.warn('Sheet "SuaChuaHangMuc": '+reason+' — đang giữ bản sao cục bộ.');
    offlineSheetNames.push('Sửa chữa (SuaChuaHangMuc) ('+reason+')');
    state.offlineSuaChua = true;
  }

  state.offlineVatTu = await applyDefensive('vatTu', all.vat_tu, mapSheetVatTu, 'vat-tu', 'Vật tư (VatTu)');
  state.offlineTaiLieu = await applyDefensive('taiLieu', all.tai_lieu, mapSheetTaiLieu, 'tai-lieu', 'Tài liệu (TaiLieu)');
  state.offlineNhatKy = await applyDefensive('nhatKy', all.nhat_ky, mapSheetNhatKy, 'nhat-ky', 'Nhật ký thi công (NhatKyThiCong)');
  state.offlineHinhAnh = await applyDefensive('hinhAnh', all.hinh_anh, mapSheetHinhAnh, 'hinh-anh', 'Hình ảnh (HinhAnh)');

  state.telegram = mapSheetCauHinh(all.cau_hinh||[]);
  state.offlineSheetNames = offlineSheetNames;
  state.syncing = false;
  state.lastSyncAt = new Date();
  render();
}

/* ---------- Kiểm tra chồng lấn dải Vị trí/Lớp ống trong Danh mục kỹ thuật ---------- */
function normTM(s){ return String(s||'').trim().toLowerCase(); }
function removeDiacritics(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi, d=>d==='đ'?'d':'D');
}
function isSharedToMay(v){
  // "Dùng chung" (co dau hoac khong dau, hoa/thuong, thua khoang trang) hoac de trong deu duoc coi la ap dung cho MOI to may
  const s = removeDiacritics(v).trim().toLowerCase();
  return s==='' || s==='dung chung' || s==='chung' || s==='tat ca' || s==='all';
}
function rangesOverlap1D(aFrom,aTo,bFrom,bTo){
  const af=(aFrom===''||isNaN(parseFloat(aFrom)))?-Infinity:parseFloat(aFrom);
  const at=(aTo===''||isNaN(parseFloat(aTo)))?Infinity:parseFloat(aTo);
  const bf=(bFrom===''||isNaN(parseFloat(bFrom)))?-Infinity:parseFloat(bFrom);
  const bt=(bTo===''||isNaN(parseFloat(bTo)))?Infinity:parseFloat(bTo);
  return af<=bt && bf<=at;
}
function danhMucOverlaps(row, excludeId){
  return state.danhMuc.filter(r=>
    r.id!==excludeId && r.heThong===row.heThong && r.thietBi===row.thietBi
    && (isSharedToMay(r.toMay) || isSharedToMay(row.toMay) || normTM(r.toMay)===normTM(row.toMay))
    && rangesOverlap1D(row.viTriTu,row.viTriDen,r.viTriTu,r.viTriDen)
    && rangesOverlap1D(row.lopOngTu,row.lopOngDen,r.lopOngTu,r.lopOngDen)
  );
}

  // du lieu, dung loi da gap khi Nhap Excel hang loat). Doi (await) cho xong het roi moi bao ket qua,

  if(delResults.some(ok=>!ok)){
    alert('Đã xóa xong trên máy này, nhưng MỘT SỐ dữ liệu chưa xóa được trên Google Sheet (lỗi mạng/máy chủ). Vui lòng bấm "Đồng bộ lại" sau ít phút để kiểm tra — nếu vẫn còn sót trên Sheet, hãy thử xóa lại đợt này (hoặc phần còn sót) một lần nữa.');
  }
};

// Ghi len Google Sheet: truoc day dung mode:'no-cors' + Content-Type application/json — cach nay khien trinh duyet
// KHONG BAO GIO doc duoc phan hoi (fire-and-forget mu), nen moi loi thuc su o phia Apps Script (chua deploy ban moi,
// thieu quyen Google Drive, loi ghi sheet...) hoan toan vo hinh, khong the biet duoc du lieu co thuc su vao Sheet hay khong.
// Sua lai: dung Content-Type 'text/plain' (Apps Script van JSON.parse(e.postData.contents) binh thuong du khai bao
// content-type la gi) de trinh duyet KHONG gui preflight OPTIONS (Apps Script khong xu ly OPTIONS), tu do khong con
// can no-cors nua va doc duoc phan hoi that — giong het cach fetchSheetAll() da doc duoc GET thanh cong tu truoc.
async function postToSheet(payload, timeoutMs){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 20000);
    let res;
    try{
      res = await fetch(SHEET_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload), signal: ctrl.signal});
    } finally { clearTimeout(timer); }
    if(!res.ok){ return {ok:false, error:'Máy chủ trả về lỗi HTTP '+res.status}; }
    let data;
    try{ data = await res.json(); }catch(e){ return {ok:false, error:'Phản hồi không đúng định dạng JSON'}; }
    if(!data || !data.ok) return {ok:false, error:(data&&data.error)?String(data.error):'Không rõ nguyên nhân'};
    return data; // tra ve nguyen data (ok:true + cac truong khac neu co, vd written/skippedDup cua batch)
  }catch(e){
    return {ok:false, error: e.name==='AbortError' ? 'Quá thời gian chờ ('+((timeoutMs||20000)/1000)+' giây)' : ('Lỗi mạng/CORS: '+(e.message||String(e)))};
  }
}
function reportWriteError(label, error){
  console.error('Lỗi ghi lên Google Sheet ['+label+']:', error);
  state.writeErrors = state.writeErrors || [];
  state.writeErrors.unshift({time: new Date(), label, error});
  state.writeErrors = state.writeErrors.slice(0, 8);
  render();
}
window.dismissWriteErrors = function(){ state.writeErrors = []; render(); };
async function syncToSheet(type, record){
  const result = await postToSheet({type, record, ts: new Date().toISOString()});
  if(!result.ok) reportWriteError(type, result.error);
  return result.ok;
}
// Ghi nhieu ban ghi Kiem tra trong 1 request duy nhat (dung khi Nhap Excel hang loat) — thay vi ban
// truoc goi syncToSheet() rieng cho tung dong khien trinh duyet ban ra hang tram request gan nhu cung
// luc, lam nghen hang doi khoa ben Apps Script va rot mat phan lon (vd chi 16/388 dong duoc ghi thanh
// cong). Cho Apps Script tu doc sheet 1 lan, tu bo qua cac dong da trung (theo Dot+To may+He thong+
// Thiet bi+Vi tri+Lop ong+Ngay) de nhap lai cung 1 file khong bi nhan doi cac dong da nhap thanh cong truoc do.
async function syncKiemTraBatch(records){
  if(!records || !records.length) return {ok:true, written:0, skippedDup:0, skippedIds:[]};
  const result = await postToSheet({type:'kiem_tra_batch', records, ts: new Date().toISOString()}, 60000);
  if(!result.ok) reportWriteError('kiem_tra_batch', result.error);
  return result;
}
// Cap nhat nhieu ban ghi Kiem tra DA CO SAN (sua lai so do) trong 1 request duy nhat — dung khi Luu bang
// ma tran nhap tay co nhieu o da ton tai duoc sua cung luc. Khac voi syncKiemTraBatch (chi dung cho ban
// ghi MOI, tu bo qua neu trung), ham nay cap nhat DUNG theo ID da biet, khong kiem tra trung khoa tu nhien.
async function syncKiemTraBatchUpdate(records){
  if(!records || !records.length) return {ok:true, updated:0};
  const result = await postToSheet({type:'kiem_tra_batch_update', records, ts: new Date().toISOString()}, 60000);
  if(!result.ok) reportWriteError('kiem_tra_batch_update', result.error);
  return result;
}
async function sendTelegramToMany(chatIds, text){

  }

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  if(!name||!email||!pass){ state.authErr='Vui lòng nhập đầy đủ họ tên, email và mật khẩu.'; render(); return; }
  if(state.users.find(u=>u.email===email)){ state.authErr='Email này đã được đăng ký.'; render(); return; }
  const role = state.users.length===0 ? 'admin' : ''; // '' = chua duoc Quan tri phan quyen, se sua truc tiep cot Vai tro tren sheet Users
  const user = {name, email, passHash: await sha256Hex(pass), role};
  state.users.push(user);
  await persist('users', state.users, true);
  syncToSheet('user', user);
  state.session = user; state.authErr='';
  await persist('session', email, false);
  render();
}
async function doLogin(){
  const email=document.getElementById('log-email').value.trim().toLowerCase();
  const pass=document.getElementById('log-pass').value;
  const user = state.users.find(u=>u.email===email);
  if(!user){ state.authErr='Email hoặc mật khẩu không đúng.'; render(); return; }
  const newHash = await sha256Hex(pass);
  let ok = user.passHash === newHash;
  if(!ok && user.passHash === simpleHash(pass)){
    // tai khoan cu con dung ham bam yeu (simpleHash) - nang cap am tham len SHA-256 ngay khi dang nhap thanh cong
    ok = true;
    user.passHash = newHash;
    await persist('users', state.users, true);
    syncToSheet('user', user);
  }
  if(!ok){ state.authErr='Email hoặc mật khẩu không đúng.'; render(); return; }
  state.session=user; state.authErr='';
  await persist('session', email, false);
  render();
}
async function doLogout(){ state.session=null; await persist('session', null, false); render(); }

window.importDanhMuc = function(input){
  if(!can('danhMuc')){ noPermAlert(); input.value=''; return; }
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    if(!(await withXLSXReady())) return;
    const wb = XLSX.read(e.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let added=0, lastHeThong='', lastThietBi='', lastToMay='';
    const newlyAdded = [];
    rows.forEach(r=>{
      let heThong=String(r['Hệ thống']||r['He thong']||'').trim();
      let thietBi=String(r['Thiết bị']||r['Thiet bi']||'').trim();
      let toMay=String(r['Tổ máy (để trống = dùng chung)']||r['Tổ máy']||r['To may']||'').trim();
      const vung=String(r['Quy ước vùng vật liệu trên bản vẽ']||r['Vùng']||r['Vung']||'').trim();
      const duongKinh=r['Đường kính']||r['Duong kinh'], chieuDay=r['Chiều dày']||r['Chieu day'];
      if(!duongKinh||!chieuDay) return;
      // các dòng gộp ô trong Excel thường để trống Hệ thống/Thiết bị/Tổ máy ở các hàng con — kế thừa từ dòng trước đó
      if(heThong) lastHeThong=heThong; else heThong=lastHeThong;
      if(thietBi) lastThietBi=thietBi; else thietBi=lastThietBi;
      if(toMay) lastToMay=toMay;
      const newRec = {id:genId('DM'), toMay, heThong, thietBi,
        viTriTu:String(r['Vị trí từ']||r['Vi tri tu']||''), viTriDen:String(r['Vị trí đến']||r['Vi tri den']||''),
        lopOngTu:String(r['Lớp ống từ']||r['Lop ong tu']||''), lopOngDen:String(r['Lớp ống đến']||r['Lop ong den']||''),
        vung: vung||('#'+pad(state.danhMuc.length+1)),
        duongKinh:String(duongKinh), chieuDay:String(chieuDay),
        vatLieu:String(r['Vật liệu']||r['Vat lieu']||''), ghiChu:String(r['Ghi chú']||r['Ghi chu']||'')};
      state.danhMuc.push(newRec);
      newlyAdded.push(newRec);
      syncToSheet('danh_muc', newRec);
      added++;
    });
    await persist('danh-muc', state.danhMuc, true);
    // sau khi nhập xong mới rà soát chồng lấn (không chặn nhập, chỉ cảnh báo để sửa sau)
    const conflictMsgs = [];
    newlyAdded.forEach(rec=>{
      const ov = danhMucOverlaps(rec, rec.id);
      if(ov.length) conflictMsgs.push('Vùng "'+rec.vung+'" ('+rec.heThong+(rec.thietBi?(' - '+rec.thietBi):'')+') chồng lấn với vùng "'+ov[0].vung+'"');
    });
    let msg = 'Đã nhập '+added+' dòng từ file Excel.';
    if(conflictMsgs.length){
      msg += '\n\nCẢNH BÁO: phát hiện '+conflictMsgs.length+' dòng có dải Vị trí/Lớp ống chồng lấn với vùng khác — cần sửa lại để Kiểm tra tự nhận diện đúng vùng:\n- '+conflictMsgs.slice(0,10).join('\n- ')+(conflictMsgs.length>10?'\n... và '+(conflictMsgs.length-10)+' dòng khác':'');
    }
    alert(msg);
    input.value=''; render();
  };
  reader.readAsArrayBuffer(file);

function inRange(val, from, to){
  const v=parseFloat(val);
  if(isNaN(v)) return false;
  const f = (from===undefined||from===null||from===''||isNaN(parseFloat(from))) ? -Infinity : parseFloat(from);
  const t = (to===undefined||to===null||to===''||isNaN(parseFloat(to))) ? Infinity : parseFloat(to);
  return v>=f && v<=t;
}
// Chuẩn hóa chuỗi trước khi so khớp Hệ thống/Thiết bị: gộp về cùng 1 kiểu Unicode (NFC) và bỏ khoảng trắng
// thừa đầu/cuối — vì text gõ trực tiếp trên trình duyệt và text trong file Excel cũ (nhất là file làm từ
// lâu/trên máy khác) có thể lưu dấu tiếng Việt ở 2 dạng Unicode khác nhau (dựng sẵn/tổ hợp), nhìn giống hệt
// nhau nhưng so sánh "===" tuyệt đối sẽ SAI KHÁC — khiến Danh mục kỹ thuật rõ ràng đã có nhưng vẫn báo
// "không khớp". Đây là lỗi rất khó phát hiện bằng mắt vì 2 chuỗi hiển thị giống hệt nhau.
function normTxt(s){ return String(s===undefined||s===null?'':s).normalize('NFC').trim().replace(/\s+/g,' '); }
function ktCandidates(toMay, heThong, thietBi, viTri, lopOng){
  if(!heThong || !viTri || !lopOng) return [];
  const heN = normTxt(heThong), tbN = normTxt(thietBi);
  return state.danhMuc.filter(r=> normTxt(r.heThong)===heN && (!tbN || normTxt(r.thietBi)===tbN)
    && (isSharedToMay(r.toMay) || normTM(r.toMay)===normTM(toMay))
    && inRange(viTri, r.viTriTu, r.viTriDen) && inRange(lopOng, r.lopOngTu, r.lopOngDen));
}
// Khi ktCandidates() tra ve 0 ket qua, ham nay xac dinh CHINH XAC tieu chi nao da loai het ung vien —
// giup chan doan thay vi doan mo: "khong khop Danh muc" chung chung khong noi duoc dung cho nao sai.
function ktDiagnoseMismatch(toMay, heThong, thietBi, viTri, lopOng){
  const heN = normTxt(heThong), tbN = normTxt(thietBi);
  const byHe = state.danhMuc.filter(r=> normTxt(r.heThong)===heN);
  if(!byHe.length) return {code:'heThong', label:'Không có Hệ thống "'+heThong+'" nào trong Danh mục kỹ thuật'};
  const byTb = tbN ? byHe.filter(r=> normTxt(r.thietBi)===tbN) : byHe;
  if(!byTb.length) return {code:'thietBi', label:'Hệ thống "'+heThong+'" có trong Danh mục, nhưng không có Thiết bị "'+thietBi+'" khớp'};
  const byTM = byTb.filter(r=> isSharedToMay(r.toMay) || normTM(r.toMay)===normTM(toMay));
  if(!byTM.length) return {code:'toMay', label:'Hệ thống/Thiết bị khớp, nhưng Tổ máy của Đợt ("'+(toMay||'—')+'") không khớp Tổ máy khai trong Danh mục (dòng Danh mục đang gán riêng cho 1 tổ máy khác)'};
  const byVt = byTM.filter(r=> inRange(viTri, r.viTriTu, r.viTriDen));
  if(!byVt.length) return {code:'viTri', label:'Hệ thống/Thiết bị/Tổ máy khớp, nhưng Vị trí "'+viTri+'" nằm ngoài mọi dải Vị trí đã khai trong Danh mục'};
  const byLo = byVt.filter(r=> inRange(lopOng, r.lopOngTu, r.lopOngDen));
  if(!byLo.length) return {code:'lopOng', label:'Hệ thống/Thiết bị/Tổ máy/Vị trí khớp, nhưng Lớp ống "'+lopOng+'" nằm ngoài mọi dải Lớp ống đã khai trong Danh mục'};
  return {code:'unknown', label:'Không xác định được nguyên nhân cụ thể'};
}
window.updateKtDerived = function(){
  const vt = document.getElementById('kt-vitri'), lo = document.getElementById('kt-lopong');
  if(!vt || !lo) return;
  state.ktSel.viTri = vt.value.trim(); state.ktSel.lopOng = lo.value.trim();
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj ? dotObj.toMay : '';
  const candidates = ktCandidates(toMay, state.ktSel.heThong, state.ktSel.thietBi, state.ktSel.viTri, state.ktSel.lopOng);
  const dm = candidates.length===1 ? candidates[0] : null;
  state.ktCandidates = candidates; state.ktResolved = dm;
  const box = id=>document.getElementById(id);
  if(box('kt-vung-box')) box('kt-vung-box').textContent = dm? dm.vung : '—';
  if(box('kt-dk-box')) box('kt-dk-box').textContent = dm? dm.duongKinh : '—';
  if(box('kt-day-box')) box('kt-day-box').textContent = dm? dm.chieuDay : '—';
  if(box('kt-vl-box')) box('kt-vl-box').textContent = dm? (dm.vatLieu||'—') : '—';
  const ambig = box('kt-ambig-wrap');
  if(ambig){
    if(candidates.length>1){
      ambig.style.display='block';
      ambig.innerHTML = '<b>Danh mục kỹ thuật đang bị xung đột:</b> có '+candidates.length+' vùng vật liệu ('
        + candidates.map(c=>esc(c.vung)).join(', ')
        + ') cùng bao trùm vị trí/lớp ống này. Không thể tự nhận diện đúng vùng. Vui lòng vào tab "Danh mục kỹ thuật" sửa lại dải Vị trí/Lớp ống của các vùng này cho KHÔNG chồng lấn nhau, rồi quay lại kiểm tra.';
    } else if(state.ktSel.viTri && state.ktSel.lopOng && candidates.length===0 && state.ktSel.heThong){
      ambig.style.display='block';
      ambig.innerHTML = 'Không tìm thấy vùng vật liệu nào trong Danh mục kỹ thuật khớp với Vị trí/Lớp ống này. Vui lòng kiểm tra lại Danh mục kỹ thuật hoặc nhập đúng số Vị trí/Lớp ống.';
    } else { ambig.style.display='none'; ambig.innerHTML=''; }
  }
};
window.addKiemTra = async function(){
  if(!can('kiemTra')){ noPermAlert(); return; }
  const g=id=>document.getElementById(id).value.trim();
  window.updateKtDerived();
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  if(!dotObj){ alert('Vui lòng chọn Đợt kiểm tra/sửa chữa (tổ máy) trước.'); return; }
  const dm = state.ktResolved;
  const viTri = g('kt-vitri'), lopOng = g('kt-lopong'), chieuDayDo = g('kt-do');
  if(!state.ktSel.heThong || !viTri || !lopOng){ alert('Vui lòng chọn Hệ thống và nhập Vị trí, Lớp ống.'); return; }
  if(!dm){
    if((state.ktCandidates||[]).length===0) alert('Không tìm thấy vùng vật liệu nào trong Danh mục kỹ thuật khớp với Tổ máy/Hệ thống/Thiết bị/Vị trí/Lớp ống này. Vui lòng kiểm tra lại Danh mục kỹ thuật.');
    else alert('Danh mục kỹ thuật đang có nhiều vùng vật liệu chồng lấn dải vị trí/lớp ống này — không thể lưu cho đến khi sửa lại Danh mục kỹ thuật cho các dải không còn chồng lấn.');

  };
  state.kiemTra.unshift(rec);

  state.ktSel={dotId:dotObj.id,heThong:'',thietBi:'',vung:'',viTri:'',lopOng:''};

  if(phanTramConLai<=70 && state.telegram.botToken && state.telegram.chatIdsCanhBao && state.telegram.chatIdsCanhBao.length){
    sendTelegram('\u26a0\ufe0f <b>C\u1ea2NH B\u00c1O CHI\u1ec0U D\u00c0Y \u2014 '+rec.id+'</b>\n'
      +'V\u1ecb tr\u00ed: '+pipeCode(rec)+'\n'
      +'Chi\u1ec1u d\u00e0y \u0111o: '+chieuDayDo+'mm / Thi\u1ebft k\u1ebf: '+dm.chieuDay+'mm ('+rec.phanTramConLai+'% c\u00f2n l\u1ea1i)\n'
      +'\u0110\u00e3 \u0111\u01b0a v\u00e0o danh s\u00e1ch c\u1eaft thay.');
  }
};

/* ---------- Kiểm tra — bảng nhập/sửa dạng ma trận (1 dòng = 1 Vị trí, cột = từng Lớp ống) ----------
   Đây là form nhập bằng bàn phím DUY NHẤT cho Kiểm tra (thay form nhập từng dòng cũ) — mô phỏng đúng
   thói quen của NDT khi ghi tay trên giấy: chọn Đợt/Hệ thống/Thiết bị 1 lần, rồi điền số đo cho cả
   một dải Vị trí × Lớp ống trong 1 màn hình. Giọng nói vẫn dùng wizard hỏi-đáp riêng bên dưới, không đổi.
   LƯU Ý QUAN TRỌNG: bảng này chỉ là lớp NHẬP/SỬA — khi lưu, mỗi ô có số liệu vẫn tách thành 1 bản ghi
   Kiểm tra riêng (đúng cấu trúc dài hiện có, ghi vào cùng sheet KiemTra), không đổi schema lưu trữ hay
   bất kỳ phần hiển thị/báo cáo/xu hướng mòn nào khác của app. */
function mtxKeyId(key){ return 'mtx-pct-'+String(key).replace(/[^a-zA-Z0-9_]/g,'_'); }
function ktMatrixDefaultLopOngRange(toMay, heThong, thietBi){
  const rows = state.danhMuc.filter(r=> r.heThong===heThong && (!thietBi || r.thietBi===thietBi)
    && (isSharedToMay(r.toMay) || normTM(r.toMay)===normTM(toMay)));
  let maxLop = 0;
  rows.forEach(r=>{ const t = parseFloat(r.lopOngDen); if(!isNaN(t) && t>maxLop) maxLop=t; });
  if(maxLop<1) maxLop = 8;
  if(maxLop>20) maxLop = 20; // chặn an toàn nếu Danh mục nhập nhầm số quá lớn
  const cols = []; for(let i=1;i<=maxLop;i++) cols.push(String(i));
  return cols;
}
function ktMatrixRecomputeCols(){
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj?dotObj.toMay:'';
  state.ktMatrix.lopOngCols = ktMatrixDefaultLopOngRange(toMay, state.ktSel.heThong, state.ktSel.thietBi);
}
function ktMatrixRecomputeResolved(){
  const m = state.ktMatrix;
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj?dotObj.toMay:'';
  const resolved = {};
  m.viTriList.forEach(vt=>{
    m.lopOngCols.forEach(lo=>{
      const key = vt+'__'+lo;
      const candidates = ktCandidates(toMay, state.ktSel.heThong, state.ktSel.thietBi, vt, lo);
      resolved[key] = candidates.length===1 ? candidates[0] : (candidates.length===0 ? null : 'conflict');
    });
  });
  m.resolved = resolved;
}
window.toggleKtMatrix = function(){
  if(!can('kiemTra')){ noPermAlert(); return; }
  const activeDots = state.dots.filter(d=>d.trangThai==='Đang diễn ra');
  if(!activeDots.length){ alert('Chưa có đợt nào đang diễn ra. Vào tab "Đợt kiểm tra/sửa chữa" để tạo đợt mới trước khi nhập kết quả kiểm tra.'); return; }
  if(state.ktMatrix.active){
    state.ktMatrix = {active:false, editMode:false, ngay:'', rangeFrom:'', rangeTo:'', viTriList:[], lopOngCols:[], cells:{}, resolved:{}, exceptions:[]};
  } else {
    if(!state.ktSel.dotId || !activeDots.some(d=>d.id===state.ktSel.dotId)) state.ktSel.dotId = activeDots[0].id;
    state.ktMatrix = {active:true, editMode:false, ngay:todayStr(), rangeFrom:'', rangeTo:'', viTriList:[], lopOngCols:[], cells:{}, resolved:{}, exceptions:[]};
    ktMatrixRecomputeCols();
    ktMatrixRecomputeResolved();
  }
  render();
};
window.ktMatrixSetRange = function(){
  const m = state.ktMatrix;
  const fromEl = document.getElementById('mtx-range-from'), toEl = document.getElementById('mtx-range-to');
  const from = parseInt((fromEl&&fromEl.value)||'',10), to = parseInt((toEl&&toEl.value)||'',10);
  if(isNaN(from) || isNaN(to) || from>to){ alert('Vui lòng nhập đúng khoảng Vị trí (Từ ≤ Đến).'); return; }
  if(to-from>300 && !confirm('Khoảng vị trí có '+(to-from+1)+' dòng, khá lớn — tiếp tục?')) return;
  const existing = new Set(m.viTriList);
  for(let i=from;i<=to;i++) existing.add(String(i));
  m.viTriList = Array.from(existing).sort((a,b)=>(parseFloat(a)-parseFloat(b)) || a.localeCompare(b));
  ktMatrixRecomputeResolved();
  render();
};
window.ktMatrixAddRow = function(){
  const v = prompt('Nhập Vị trí cần thêm:'); if(!v) return;
  const m = state.ktMatrix;
  if(!m.viTriList.includes(v)){
    m.viTriList.push(v);
    m.viTriList.sort((a,b)=>(parseFloat(a)-parseFloat(b)) || String(a).localeCompare(String(b)));
  }
  ktMatrixRecomputeResolved();
  render();
};
window.ktMatrixRemoveRow = function(viTri){
  const m = state.ktMatrix;
  m.viTriList = m.viTriList.filter(v=>v!==viTri);
  render();
};
window.ktMatrixAddCol = function(){
  const m = state.ktMatrix;
  const nums = m.lopOngCols.map(Number).filter(n=>!isNaN(n));
  const next = (nums.length? Math.max(...nums):0)+1;
  m.lopOngCols.push(String(next));
  ktMatrixRecomputeResolved();
  render();
};
window.ktMatrixRemoveCol = function(){
  const m = state.ktMatrix;
  if(m.lopOngCols.length<=1) return;
  m.lopOngCols.pop();
  render();
};
window.ktMatrixLoadExisting = function(){
  const m = state.ktMatrix;
  if(!state.ktSel.dotId || !state.ktSel.heThong){ alert('Vui lòng chọn Đợt và Hệ thống trước.'); return; }
  const matches = state.kiemTra.filter(r=> r.dotId===state.ktSel.dotId && r.heThong===state.ktSel.heThong && (!state.ktSel.thietBi || r.thietBi===state.ktSel.thietBi));
  if(!matches.length){ alert('Chưa có bản ghi Kiểm tra nào khớp Đợt/Hệ thống/Thiết bị đã chọn — có thể nhập mới trực tiếp trên bảng.'); return; }
  const viSet = new Set(m.viTriList);
  const loSet = new Set(m.lopOngCols.map(String));
  const loadedExceptions = m.exceptions.slice();
  matches.forEach(r=>{
    viSet.add(String(r.viTri)); loSet.add(String(r.lopOng));
    m.cells[String(r.viTri)+'__'+String(r.lopOng)] = {val:String(r.chieuDayDo), existingId:r.id};
    // Bản ghi cũ đang có Ngoại dạng bất thường -> hiện lại vào bảng đánh dấu để anh xem/sửa tiếp,
    // tránh mất dấu khi mở lại đợt cũ để sửa.
    if(NGOAI_DANG_BAT_THUONG.includes(r.ngoaiDang) && !loadedExceptions.some(ex=>ex.viTri===String(r.viTri) && ex.lopOng===String(r.lopOng))){
      loadedExceptions.push({viTri:String(r.viTri), lopOng:String(r.lopOng), ngoaiDang:r.ngoaiDang});
    }
  });
  m.viTriList = Array.from(viSet).sort((a,b)=>(parseFloat(a)-parseFloat(b)) || a.localeCompare(b));
  m.lopOngCols = Array.from(loSet).sort((a,b)=>(parseFloat(a)-parseFloat(b)) || a.localeCompare(b));
  m.exceptions = loadedExceptions;
  m.editMode = true;
  ktMatrixRecomputeResolved();
  render();
};
window.ktMatrixCellInput = function(viTri, lopOng, el){
  const key = viTri+'__'+lopOng;
  const m = state.ktMatrix;
  if(!m.cells[key]) m.cells[key] = {};
  m.cells[key].val = el.value;
  const dm = m.resolved[key];
  const td = el.closest('td');
  if(td) td.classList.remove('mtx-good','mtx-warn','mtx-danger');
  const pctBox = document.getElementById(mtxKeyId(key));
  const v = parseFloat(el.value);
  if(dm && dm!=='conflict' && el.value!=='' && !isNaN(v)){
    const pct = v/parseFloat(dm.chieuDay)*100;
    if(!isNaN(pct)){
      const cls = pct<=70?'mtx-danger':(pct<=85?'mtx-warn':'mtx-good');
      if(td) td.classList.add(cls);
      if(pctBox) pctBox.textContent = pct.toFixed(0)+'%';
    }
  } else if(pctBox) pctBox.textContent = '';
};
// Ghi nhận Ngoại dạng bất thường trong bảng ma trận: thay vì thêm 1 lựa chọn vào MỌI ô (đa số sẽ là
// "Bình thường", làm bảng rối), chỉ hiện 1 danh sách nhỏ bên dưới để đánh dấu đúng những ô thực sự bất
// thường — chỉ chọn được trong số Vị trí/Lớp ống đã có số đo trong bảng. Ô nào không được đánh dấu ở đây
// mặc định lưu là "Bình thường" (giữ nguyên hành vi cũ khi tạo mới).
function ktMatrixFilledLopOngForViTri(vt){
  const m = state.ktMatrix;
  return m.lopOngCols.filter(lo=>{ const c = m.cells[vt+'__'+lo]; return c && String(c.val||'').trim()!==''; });
}
function ktMatrixFilledViTriList(){
  return state.ktMatrix.viTriList.filter(vt=> ktMatrixFilledLopOngForViTri(vt).length>0);
}
window.ktMatrixExceptionAdd = function(){
  state.ktMatrix.exceptions.push({viTri:'', lopOng:'', ngoaiDang:NGOAI_DANG_BAT_THUONG[0]});
  render();
};
window.ktMatrixExceptionRemove = function(idx){
  state.ktMatrix.exceptions.splice(idx,1);

};
window.ktMatrixExceptionSet = function(idx, field, val){

window.ktMatrixClose = function(){
  if(!confirm('Đóng bảng nhập? Dữ liệu chưa lưu trong bảng sẽ mất (dữ liệu đã lưu trước đó không bị ảnh hưởng).')) return;
