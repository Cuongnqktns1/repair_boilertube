<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLSC ỐNG LÒ HƠI — NHIỆT ĐIỆN NGHI SƠN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0d1b26; --panel:#132635; --panel2:#1a3245; --border:#274156; --border-soft:#1e3547;
  --text:#e9eef2; --muted:#8fa3b3; --dim:#54697a;
  --accent:#e08a3c; --accent-soft:#3a2712;
  --danger:#e2564f; --danger-soft:#3a1f1d;
  --warn:#e0b23c; --warn-soft:#3a3012;
  --good:#4fb88a; --good-soft:#163429;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --display:'Big Shoulders Display',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}
::selection{background:var(--accent);color:#1a1305;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand-row{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.logo-mark{width:38px;height:38px;flex-shrink:0;}
.brand-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
.brand-title{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;letter-spacing:.01em;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-size:13px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--text);border-color:var(--border);}
.nav-tag{font-family:var(--mono);font-size:10px;font-weight:600;width:26px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);color:var(--dim);flex-shrink:0;}
.nav-item.active .nav-tag{color:var(--accent);border-color:var(--accent-soft);}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border-soft);margin-top:10px;}
.user-pill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.user-pill .u-role{font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:block;font-family:var(--mono);}
.logout-btn{background:none;border:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:4px 0 0;}
.tg-pill{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.dot.off{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.bottom-nav{display:none;}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.page-title{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#1a1305;border:none;padding:10px 15px;border-radius:6px;font-size:12.5px;font-weight:600;}
.btn:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.btn-ghost:hover{background:var(--panel2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #4a2422;padding:6px 10px;border-radius:5px;font-size:11.5px;}
.file-btn{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.file-btn:hover{border-color:#3a4450;}
input[type=file]{display:none;}
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px;}
.stat-card .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-card .val{font-family:var(--display);font-size:28px;font-weight:800;margin-top:5px;}
.stat-card.danger .val{color:var(--danger);}
.stat-card.warn .val{color:var(--warn);}
.stat-card.good .val{color:var(--good);}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:24px 0 10px;}
.record{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:9px;}
.record:hover{border-color:#3a4450;}
.tag-chip{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--dim);background:#0d1b26;border:1px solid var(--border);border-radius:4px;padding:3px 7px;margin-right:8px;}
.record-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.record-loc{font-weight:600;font-size:13.5px;}
.record-meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.record-meta span{margin-right:12px;}
.status{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.status.good{background:var(--good-soft);color:var(--good);}
.status.warn{background:var(--warn-soft);color:var(--warn);}
.status.danger{background:var(--danger-soft);color:var(--danger);}
.record-note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--border-soft);padding-top:7px;}
.record-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);}
.mini-btn:hover{color:var(--text);border-color:#3a4450;}
.mini-btn.tg{color:#4aa3d6;}
.empty{color:var(--dim);font-size:13px;padding:26px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
.form-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:#0d1b26;border:1px solid var(--border);border-radius:6px;padding:8px 9px;color:var(--text);font-size:13px;}
.field input:disabled{color:var(--muted);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:50px;}
.form-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap;}
.readonly-box{background:#0d1b26;border:1px solid var(--border-soft);border-radius:6px;padding:8px 9px;font-family:var(--mono);font-size:13px;color:var(--accent);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.dm{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
table.dm th{background:var(--panel2);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.dm td{padding:8px 10px;border-bottom:1px solid var(--border-soft);}
table.dm tr:last-child td{border-bottom:none;}
.cause-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
.cause-list{display:flex;flex-direction:column;gap:6px;}
.cause-item{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:11px 13px;color:var(--muted);font-size:13px;}
.cause-item.active{background:var(--panel2);color:var(--text);border-color:var(--accent-soft);}
.cause-item b{display:block;color:inherit;font-size:13.5px;margin-bottom:2px;}
.cause-detail{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;position:sticky;top:20px;}
.cause-detail h3{font-family:var(--display);font-size:21px;margin:0 0 4px;}
.cause-detail .cause-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.cause-detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:14px 0 7px;}
.cause-detail ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#c9cfd4;}
.settings-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;max-width:560px;margin-bottom:18px;}
.settings-note{background:var(--panel2);border:1px solid var(--border-soft);border-radius:7px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border-soft);margin-top:6px;}
.switch{width:38px;height:21px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#e7eaec;transition:left .15s;}
.switch.on::after{left:19px;background:#1a1305;}
.loading{padding:60px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.08em;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 25% 15%,#16324a 0%,var(--bg) 62%);}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px 26px;}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-title{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;}
.tabbtns{display:flex;gap:6px;margin-bottom:16px;background:var(--panel2);border-radius:7px;padding:3px;}
.tabbtn{flex:1;padding:8px;text-align:center;border-radius:5px;font-size:12.5px;color:var(--muted);background:none;border:none;}
.tabbtn.active{background:var(--accent);color:#1a1305;font-weight:600;}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;}
.weld-row{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--border-soft);border-radius:6px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;background:#0d1b26;}
.weld-id{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:150px;}
.weld-chk{display:flex;align-items:center;gap:4px;color:var(--muted);}
.weld-badge{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:10px;text-transform:uppercase;}
.weld-badge.bp{background:var(--warn-soft);color:var(--warn);}
.weld-badge.official{background:var(--good-soft);color:var(--good);}
.repair-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:14px 16px;}
.repair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.progress-mini{font-family:var(--mono);font-size:11px;color:var(--muted);}
.section-sub{margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border-soft);}
@media(max-width:880px){
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .cause-grid{grid-template-columns:1fr;}
  .cause-detail{position:static;}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:720px){
  .sidebar{display:none;}
  .main{padding:16px 14px 90px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9px;padding:4px 5px;flex-shrink:0;}
  .bn-item.active{color:var(--accent);}
  .bn-tag{font-family:var(--mono);font-size:9.5px;font-weight:700;width:22px;height:17px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);}
  .bn-item.active .bn-tag{border-color:var(--accent-soft);color:var(--accent);}
  .page-title{font-size:22px;}
  .grid-cards{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwvkiNUDnaei3JMXSpfRSEwpzZOKK3GWHy76VXEyBeXnSJWuyPBKNV2o6TA0GFSuHNkxg/exec';
const LOGO_SVG = '<svg class="logo-mark" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">'
  +'<circle cx="22" cy="22" r="19" fill="none" stroke="#e08a3c" stroke-width="3"/>'
  +'<circle cx="22" cy="22" r="11" fill="none" stroke="#e08a3c" stroke-width="3" opacity="0.55"/>'
  +'<circle cx="22" cy="22" r="3" fill="#e08a3c"/>'
  +'</svg>';

const NAV = [
  {id:'overview', tag:'TQ', label:'Tổng quan'},
  {id:'dots',     tag:'ĐV', label:'Đợt kiểm tra/sửa chữa'},
  {id:'danhmuc',  tag:'DM', label:'Danh mục kỹ thuật'},
  {id:'kiemtra',  tag:'ĐĐ', label:'Kiểm tra (đo đạc)'},
  {id:'suachua',  tag:'SC', label:'Sửa chữa & hàn'},
  {id:'vattu',    tag:'VT', label:'Vật tư sử dụng'},
  {id:'history',  tag:'LS', label:'Lịch sử & xu hướng'},
  {id:'analysis', tag:'PT', label:'Phân tích & khuyến nghị'},
];

const CAUSES = [
  {id:'erosion', name:'Mài mòn tro bay (ăn mòn phía khói)', where:'Ống sinh hơi vùng đổi hướng dòng khói, gần miệng đốt',
    causes:['Tốc độ, nồng độ tro bay cao tại vùng đổi hướng dòng khói','Vận hành lệch tâm ngọn lửa gây xoáy dòng khói','Khoảng cách ống - tường quá hẹp làm tăng tốc độ cục bộ'],
    signs:['Bề mặt ống mỏng dần dạng rãnh khía hình yên ngựa, lệch về phía đón dòng khói','Chiều dày giảm dần đều theo thời gian tại cùng vị trí'],
    fix:['Cắt bỏ đoạn ống dưới chiều dày tối thiểu, hàn nối ống mới cùng mác vật liệu và đường kính','Kiểm tra 100% mối hàn bằng NDT trước khi vận hành','Lắp tấm chắn chống mài mòn tại vị trí lặp lại hư hỏng','Rà soát chế độ đốt, cân bằng vòi đốt','Bổ sung điểm đo định kỳ tại vị trí đã sửa chữa']},
  {id:'waterside', name:'Ăn mòn phía nước / hơi', where:'Ống sinh hơi, ống góp, khu vực lưu lượng thấp',
    causes:['Chất lượng nước cấp không đạt (pH, oxy hòa tan)','Đóng cặn tạo lớp cách nhiệt trong ống','Ăn mòn rỗ do oxy hòa tan khi dừng lò không xử lý đúng'],
    signs:['Rỗ ăn mòn cục bộ hoặc lớp cặn dày khi cắt mẫu kiểm tra','Chiều dày giảm không đều, phát hiện qua UT hoặc nội soi'],
    fix:['Cắt và thay ống mới; có thể vá đắp nếu ăn mòn rỗ cục bộ theo quy trình hàn được duyệt','Súc rửa hóa chất nếu cặn vượt ngưỡng cho phép','Hiệu chỉnh chế độ xử lý nước cấp, xử lý oxy, bảo quản lò khi dừng máy']},
  {id:'long-overheat', name:'Quá nhiệt dài hạn (creep)', where:'Ống sinh hơi, quá nhiệt/tái nhiệt vận hành lâu ở nhiệt độ vượt thiết kế',
    causes:['Đóng cặn làm giảm trao đổi nhiệt, kim loại nóng cục bộ','Lưu lượng tuần hoàn không đủ tại một số nhánh','Vận hành kéo dài ở nhiệt độ khói cao hơn thiết kế'],
    signs:['Ống phình cục bộ, vảy oxit dày, đổi màu kim loại','Vết nứt "cửa sổ" khi vỡ ống, mép mỏng biến dạng nhiều'],
    fix:['Cắt bỏ toàn bộ đoạn phình/biến dạng, thay ống đúng mác vật liệu chịu nhiệt','Kiểm tra kim tương, đo độ cứng đoạn lân cận','Xử lý nhiệt sau hàn (PWHT) nếu vật liệu yêu cầu','Làm sạch cặn trong ống trước khi vận hành lại']},
  {id:'short-overheat', name:'Quá nhiệt ngắn hạn (mất lưu lượng đột ngột)', where:'Ống tắc nghẽn cục bộ hoặc mất tuần hoàn đột ngột',
    causes:['Tắc nghẽn dị vật hoặc cặn bong tróc','Sự cố bơm cấp nước, mất tuần hoàn tức thời','Khởi động lò sai quy trình'],
    signs:['Vỡ ống dạng miệng cá, mép mỏng, biến dạng dẻo rõ, xảy ra đột ngột'],
    fix:['Cắt và thay đoạn ống hỏng ngay, kiểm tra kỹ ống lân cận cùng nhánh','Nội soi/súc rửa loại bỏ dị vật gây tắc trước khi vận hành lại','Rà soát quy trình khởi động và liên động bảo vệ mất nước cấp']},
  {id:'fatigue', name:'Nứt do mỏi nhiệt / mỏi cơ', where:'Vị trí hàn, gối đỡ ống, chỗ uốn, điểm ràng buộc giãn nở nhiệt',
    causes:['Chu kỳ khởi động - dừng lò thường xuyên','Gối đỡ kẹt hoặc hư hỏng cản trở giãn nở nhiệt','Rung động cơ khí kéo dài'],
    signs:['Vết nứt dạng mạng nhện tại mối hàn/điểm uốn, lan dần theo thời gian'],
    fix:['Mài loại bỏ vết nứt, nếu vượt giới hạn thì cắt và hàn nối đoạn mới','Sửa chữa hệ thống gối đỡ, giá treo','Kiểm tra PT/MT các vị trí tương tự trong cùng cụm ống']},
  {id:'low-temp-corrosion', name:'Ăn mòn nhiệt độ thấp (điểm sương axit)', where:'Bộ hâm nước, bộ sấy không khí, khu vực khói nhiệt độ thấp',
    causes:['Nhiệt độ vách ống xuống dưới điểm sương axit sulfuric','Hàm lượng lưu huỳnh nhiên liệu cao kết hợp nhiệt độ khói thấp'],
    signs:['Ăn mòn dạng vảy, mất kim loại đều trên diện rộng'],

function pad(n){ return String(n).padStart(4,'0'); }
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function simpleHash(str){ let h=0; str=String(str); for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return 'h'+Math.abs(h).toString(36); }
function uniq(arr){ return [...new Set(arr)]; }
function pipeCode(r){ return (r.toMay?r.toMay+' · ':'')+r.heThong+' - '+r.thietBi+' - '+r.viTri+' - '+r.lopOng; }

const getLocal = async (k, def) => { 
  try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } 
  catch(e) { return def; } 
};
const persist = async (key, value) => { 
  try { localStorage.setItem(key, JSON.stringify(value)); } 
  catch(e) {} 
};

async function loadAll(){
  // Khắc phục lỗi mất dữ liệu khi Sheet trả về mảng rỗng nhưng local đang có dữ liệu
  const localUsers = await getLocal('users', []);
  const sheetUsers = await fetchSheet('users');
  if(sheetUsers && sheetUsers.length > 0){ 
    state.users = mapSheetUsers(sheetUsers); 
    await persist('users', state.users); 
  } else { 
    state.users = localUsers; 
  }

  const localDanhMuc = await getLocal('danh-muc', []);
  const sheetDanhMuc = await fetchSheet('danh_muc');
  if(sheetDanhMuc && sheetDanhMuc.length > 0){ 
    state.danhMuc = mapSheetDanhMuc(sheetDanhMuc); 
    await persist('danh-muc', state.danhMuc); 
  } else {
    state.danhMuc = localDanhMuc.length > 0 ? localDanhMuc : seedDanhMuc();
    if(localDanhMuc.length === 0) await persist('danh-muc', state.danhMuc);
  }

  state.dots = await getLocal('dots', []);
  state.taiLieu = await getLocal('tai-lieu', []);
  state.kiemTra = await getLocal('kiem-tra', []);
  state.suaChua = await getLocal('sua-chua', []);
  state.vatTu = await getLocal('vat-tu', []);

  state.telegram = sheetCauHinh ? mapSheetCauHinh(sheetCauHinh) : {botToken:'',chatId:'',tanSuatGio:''};

  const sess = await getLocal('session', null);
  if(sess && state.users.find(u=>u.email===sess)) state.session = state.users.find(u=>u.email===sess);
  state.loading=false;
  render();
}

function rangesOverlap1D(aFrom,aTo,bFrom,bTo){
  const af=(aFrom===''||isNaN(parseFloat(aFrom)))?-Infinity:parseFloat(aFrom);
  const at=(aTo===''||isNaN(parseFloat(aTo)))?Infinity:parseFloat(aTo);
  const bf=(bFrom===''||isNaN(parseFloat(bFrom)))?-Infinity:parseFloat(bFrom);
  const bt=(bTo===''||isNaN(parseFloat(bTo)))?Infinity:parseFloat(bTo);
  return af<=bt && bf<=at;
}
function danhMucOverlaps(row, excludeId){
  return state.danhMuc.filter(r=>
    r.id!==excludeId && r.heThong===row.heThong && r.thietBi===row.thietBi
    && (!r.toMay || !row.toMay || r.toMay===row.toMay)
    && rangesOverlap1D(row.viTriTu,row.viTriDen,r.viTriTu,r.viTriDen)
    && rangesOverlap1D(row.lopOngTu,row.lopOngDen,r.lopOngTu,r.lopOngDen)
  );
}

function inRange(val, from, to){
  const v=parseFloat(val);
  if(isNaN(v)) return false;
  const f = (from===''||isNaN(parseFloat(from))) ? -Infinity : parseFloat(from);
  const t = (to===''||isNaN(parseFloat(to))) ? Infinity : parseFloat(to);
  return v>=f && v<=t;
}
function ktCandidates(toMay, heThong, thietBi, viTri, lopOng){

  return state.danhMuc.filter(r=> r.heThong===heThong && (!thietBi || r.thietBi===thietBi) && (!r.toMay || r.toMay===toMay) && inRange(viTri, r.viTriTu, r.viTriDen) && inRange(lopOng, r.lopOngTu, r.lopOngDen));
}

function pipeKeyOf(k){ return (k.toMay||'')+'|'+k.heThong+'|'+k.thietBi+'|'+k.viTri+'|'+k.lopOng; }
async function syncSuaChua(){
  const byPipe = {};
  state.kiemTra.forEach(k=>{
    const key = pipeKeyOf(k);
    if(!byPipe[key]) byPipe[key]=[];
    byPipe[key].push(k);
  });
  Object.keys(byPipe).forEach(key=>{
    const history = byPipe[key].slice().sort((a,b)=>a.ngay.localeCompare(b.ngay));
    const latest = history[history.length-1];
    if(parseFloat(latest.phanTramConLai) > 70) return;
    let activeItem = state.suaChua.find(s=>s.pipeKey===key && s.trangThai!=='Hoàn thành');
    if(!activeItem){
      const displayId = latest.id + ' (Cắt Thay)';
      activeItem = {id:displayId, pipeKey:key, chuKy:1, dotId:latest.dotId, toMay:latest.toMay, heThong:latest.heThong, thietBi:latest.thietBi, viTri:latest.viTri, lopOng:latest.lopOng, phanTramConLai:latest.phanTramConLai, trangThai:'Chờ xử lý', phuongAn:'Cắt thay', welds:[{id:displayId+'-w1', maMoiHan:'w1', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', thoHan:''},{id:displayId+'-w2', maMoiHan:'w2', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', thoHan:''}]};
      state.suaChua.push(activeItem);
      syncToSheet('sua_chua_item', activeItem);
    }
  });
  await persist('sua-chua', state.suaChua);
}

function recomputeStatus(item){
  if(item.welds.length===0){ item.trangThai='Chờ xử lý'; return; }

  if(allDone){ item.trangThai='Hoàn thành'; if(!item.ngayHoanThanh) item.ngayHoanThanh=todayStr(); }
  else { item.trangThai='Đang tiến hành'; item.ngayHoanThanh=''; }
}

  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  item.phuongAn = value;
  if(value!=='Cắt thay'){ if(item.trangThai==='Hoàn thành' && !item.ngayHoanThanh) item.ngayHoanThanh=todayStr(); }
  else { recomputeStatus(item); }
  await persist('sua-chua', state.suaChua); syncToSheet('sua_chua_item', item); render();
};
window.setManualStatus = async function(itemId, value){
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  item.trangThai = value; item.ngayHoanThanh = value==='Hoàn thành' ? (item.ngayHoanThanh||todayStr()) : '';
  await persist('sua-chua', state.suaChua); syncToSheet('sua_chua_item', item); render();
};
window.toggleRepairExpand = function(id){ state.expandedRepair = state.expandedRepair===id? null : id; render(); };
window.addBienPhapWeld = async function(itemId){
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  const wId = 'wbp'+(item.welds.filter(w=>w.loai==='bien_phap').length+1);
  item.welds.push({id:itemId+'-'+wId, maMoiHan:wId, loai:'bien_phap', daCat:false, daHan:false, paut:'Chưa kiểm tra', thoHan:''});
  recomputeStatus(item); await persist('sua-chua', state.suaChua); render();
};
window.removeWeld = async function(itemId, weldId){
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  item.welds = item.welds.filter(x=>x.id!==weldId); recomputeStatus(item);
  await persist('sua-chua', state.suaChua); render();
};
window.toggleWeldFlag = async function(itemId, weldId, field){
  const item = state.suaChua.find(s=>s.id===itemId); const w = item.welds.find(x=>x.id===weldId);
  w[field] = !w[field]; recomputeStatus(item); await persist('sua-chua', state.suaChua);
  syncToSheet('sua_chua_weld', {itemId:item.id, maMoiHan:w.maMoiHan, trangThai:item.trangThai, weld:w}); render();
};
window.setWeldPaut = async function(itemId, weldId, value){
  const item = state.suaChua.find(s=>s.id===itemId); const w = item.welds.find(x=>x.id===weldId);
  w.paut = value; recomputeStatus(item); await persist('sua-chua', state.suaChua);
  syncToSheet('sua_chua_weld', {itemId:item.id, maMoiHan:w.maMoiHan, trangThai:item.trangThai, weld:w}); render();
};
window.setWeldField = async function(itemId, weldId, field, value){
  const item = state.suaChua.find(s=>s.id===itemId); const w = item.welds.find(x=>x.id===weldId);
  w[field]=value; await persist('sua-chua', state.suaChua);
  syncToSheet('sua_chua_weld', {itemId:item.id, maMoiHan:w.maMoiHan, trangThai:item.trangThai, weld:w});
};

window.addVatTu = async function(){
  const g=id=>document.getElementById(id).value.trim();
  const dotObj = state.dots.find(d=>d.id===g('vt-dot'));
  if(!dotObj) return;
  const rec = {id:'VT-'+pad(state.vatTu.length+1), dotId:dotObj.id, toMay:dotObj.toMay, heThong:g('vt-hethong'), thietBi:g('vt-thietbi'), mucDich:g('vt-mucdich'), maVatTu:g('vt-ma'), tenVatTu:g('vt-ten'), donVi:g('vt-donvi'), soLuong:g('vt-soluong'), lyDoThayThe:g('vt-lydo'), ghiChu:g('vt-ghichu'), ngay:todayStr()};
  if(!rec.tenVatTu || !rec.soLuong) return;
  state.vatTu.push(rec); await persist('vat-tu', state.vatTu); syncToSheet('vat_tu', rec);
  state.showForm.vattu=false; render();
};
window.deleteVatTu = async function(id){
  state.vatTu = state.vatTu.filter(r=>r.id!==id); await persist('vat-tu', state.vatTu); render();
};

window.setTab = t => { state.tab=t; render(); window.scrollTo(0,0); };
window.toggleForm = k => { state.showForm[k]=!state.showForm[k]; render(); };
window.setCause = id => { state.activeCause=id; render(); };

function render(){
  const app=document.getElementById('app');
  if(state.loading){ app.innerHTML='<div class="loading">ĐANG TẢI DỮ LIỆU…</div>'; return; }
  if(!state.session){ app.innerHTML = renderAuth(); return; }

  const navHtml = NAV.map(n=> `<button class="nav-item ${state.tab===n.id?'active':''}" onclick="setTab('${n.id}')"><span class="nav-tag">${n.tag}</span><span>${n.label}</span></button>`).join('');
  const bottomNavHtml = NAV.map(n=> `<button class="bn-item ${state.tab===n.id?'active':''}" onclick="setTab('${n.id}')"><span class="bn-tag">${n.tag}</span><span>${n.label.split(' ')[0]}</span></button>`).join('');
  const tgOn = !!(state.telegram.botToken && state.telegram.chatId);

  app.innerHTML = `<div class="shell">
    <div class="sidebar">
      <div class="brand-row">${LOGO_SVG}<div><div class="brand-eyebrow">Nhiệt điện Nghi Sơn</div><div class="brand-title">QLSC ỐNG LÒ HƠI</div></div></div>
      <div class="nav">${navHtml}</div>
      <div class="sidebar-foot">
        <div class="user-pill"><div><div>${esc(state.session.name)}</div><span class="u-role">${state.session.role}</span></div><button class="logout-btn" onclick="doLogout()">Đăng xuất</button></div>
        <div class="tg-pill"><span class="dot ${tgOn?'on':'off'}"></span>${tgOn?'Telegram kết nối':'Telegram chưa cấu hình'}</div>
      </div>
    </div>
    <div class="main">${renderTab()}</div>
  </div><div class="bottom-nav">${bottomNavHtml}</div>`;
}

function renderAuth(){
  const isLogin = state.authView==='login';
  return `<div class="login-wrap"><div class="login-card">
    <div class="login-brand">${LOGO_SVG}<div><div class="brand-eyebrow">Nhiệt điện Nghi Sơn</div><div class="login-title">Quản lý sửa chữa<br>ống lò hơi</div></div></div>
    <div class="tabbtns"><button class="tabbtn ${isLogin?'active':''}" onclick="setAuthView('login')">Đăng nhập</button><button class="tabbtn ${!isLogin?'active':''}" onclick="setAuthView('register')">Đăng ký</button></div>
    ${isLogin ? `<div class="field" style="margin-bottom:10px;"><label>Email</label><input id="log-email" type="email"></div><div class="field" style="margin-bottom:10px;"><label>Mật khẩu</label><input id="log-pass" type="password"></div>${state.authErr?`<div class="err-msg">${esc(state.authErr)}</div>`:''}<div class="form-actions" style="justify-content:stretch;"><button class="btn" style="width:100%;" onclick="doLogin()">Đăng nhập</button></div>` : `<div class="field" style="margin-bottom:10px;"><label>Họ tên</label><input id="reg-name" type="text"></div><div class="field" style="margin-bottom:10px;"><label>Email</label><input id="reg-email" type="email"></div><div class="field" style="margin-bottom:10px;"><label>Mật khẩu</label><input id="reg-pass" type="password"></div>${state.authErr?`<div class="err-msg">${esc(state.authErr)}</div>`:''}<div class="form-actions" style="justify-content:stretch;"><button class="btn" style="width:100%;" onclick="doRegister()">Tạo tài khoản</button></div>`}
  </div></div>`;
}

function renderTab(){
  if(state.tab==='overview') return '<div class="page-head"><div class="page-title">Tổng quan</div></div><div class="empty">Bảng điều khiển hệ thống quản lý lò hơi.</div>';
  if(state.tab==='dots') return renderDots();
  if(state.tab==='danhmuc') return renderDanhMuc();
  if(state.tab==='kiemtra') return renderKiemTra();
  if(state.tab==='suachua') return renderSuaChua();
  if(state.tab==='vattu') return renderVatTu();
  if(state.tab==='history') return '<div class="page-head"><div class="page-title">Lịch sử</div></div>';
  if(state.tab==='analysis') return renderAnalysis();
}

function renderDots(){
  const rows = state.dots.map(d=>`<div class="record"><div class="record-top"><div class="record-loc">${esc(d.ten)} (${esc(d.toMay)})</div><span class="status ${d.trangThai==='Đang diễn ra'?'warn':'good'}">${d.trangThai}</span></div><div class="record-actions">${d.trangThai==='Đang diễn ra'?`<button class="mini-btn" onclick="closeDot('${d.id}')">Đóng đợt</button>`:`<button class="mini-btn" onclick="reopenDot('${d.id}')">Mở lại</button>`}</div></div>`).join('');
  return `<div class="page-head"><div><div class="page-title">Đợt kiểm tra / sửa chữa</div></div><button class="btn" onclick="toggleForm('dot')">+ Tạo đợt mới</button></div>${state.showForm.dot?`<div class="form-panel"><div class="form-grid"><div class="field full"><label>Tên đợt *</label><input id="dot-ten"></div><div class="field"><label>Tổ máy *</label><input id="dot-tomay"></div></div><div class="form-actions"><button class="btn" onclick="addDot()">Lưu</button></div></div>`:''}${rows||'<div class="empty">Chưa có đợt nào.</div>'}`;
}

function renderDanhMuc(){
  const rows = state.danhMuc.map(r=>`<tr><td>${esc(r.toMay)}</td><td>${esc(r.heThong)}</td><td>${esc(r.thietBi)}</td><td>${esc(r.viTriTu)} - ${esc(r.viTriDen)}</td><td>${esc(r.vung)}</td><td>${esc(r.chieuDay)}</td><td><button class="btn-danger" onclick="deleteDanhMuc('${r.id}')">Xóa</button></td></tr>`).join('');
  return `<div class="page-head"><div><div class="page-title">Danh mục kỹ thuật</div></div><div class="head-actions"><label class="file-btn">Nhập Excel<input type="file" onchange="importDanhMuc(this)"></label><button class="btn-ghost" onclick="exportDanhMuc()">Xuất Excel</button><button class="btn-danger" onclick="deleteAllDanhMuc()">Xóa tất cả</button><button class="btn" onclick="toggleForm('danhmuc')">+ Thêm dòng</button></div></div>${state.showForm.danhmuc?`<div class="form-panel"><div class="form-grid"><div class="field"><label>Hệ thống *</label><input id="dm-hethong"></div><div class="field"><label>Vùng *</label><input id="dm-vung"></div><div class="field"><label>Đường kính *</label><input id="dm-duongkinh"></div><div class="field"><label>Chiều dày *</label><input id="dm-chieuday"></div></div><div class="form-actions"><button class="btn" onclick="addDanhMuc()">Lưu</button></div></div>`:''}<div class="table-wrap"><table class="dm"><thead><tr><th>Tổ máy</th><th>Hệ thống</th><th>Thiết bị</th><th>Vị trí</th><th>Vùng</th><th>Dày (mm)</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" style="text-align:center;">Trống</td></tr>'}</tbody></table></div>`;
}

function renderKiemTra(){
  const activeDots = state.dots.filter(d=>d.trangThai==='Đang diễn ra');
  return `<div class="page-head"><div><div class="page-title">Kiểm tra đo đạc</div></div><button class="btn" onclick="toggleForm('kiemtra')">+ Thêm bản ghi</button></div>${state.showForm.kiemtra?`<div class="form-panel"><div class="form-grid"><div class="field full"><label>Đợt</label><select id="kt-dot">${activeDots.map(d=>`<option value="${d.id}">${d.ten}</option>`).join('')}</select></div><div class="field"><label>Hệ thống</label><input id="kt-hethong" oninput="updateKtDerived()"></div><div class="field"><label>Vị trí</label><input id="kt-vitri" oninput="updateKtDerived()"></div><div class="field"><label>Lớp ống</label><input id="kt-lopong" oninput="updateKtDerived()"></div><div class="field"><label>Chiều dày đo</label><input id="kt-do"></div></div><div class="form-actions"><button class="btn" onclick="addKiemTra()">Lưu</button></div></div>`:''}`;
}

function renderSuaChua(){
  const items = state.suaChua.map(item=>`<div class="repair-item"><div class="repair-head" onclick="toggleRepairExpand('${item.id}')"><div><b>${esc(item.id)}</b> — Còn ${item.phanTramConLai}%</div><span class="status ${item.trangThai==='Hoàn thành'?'good':'danger'}">${item.trangThai}</span></div>${state.expandedRepair===item.id?`<div style="margin-top:10px;">${item.welds.map(w=>`<div class="weld-row"><span class="weld-id">${w.maMoiHan}</span><label><input type="checkbox" ${w.daCat?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daCat')"> Đã cắt</label><label><input type="checkbox" ${w.daHan?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daHan')"> Đã hàn</label><select onchange="setWeldPaut('${item.id}','${w.id}',this.value)"><option ${w.paut==='Chưa kiểm tra'?'selected':''}>Chưa kiểm tra</option><option ${w.paut==='Đạt'?'selected':''}>Đạt</option><option ${w.paut==='Lỗi'?'selected':''}>Lỗi</option></select></div>`).join('')}<button class="mini-btn" onclick="addBienPhapWeld('${item.id}')">+ Mối hàn biện pháp</button></div>`:''}</div>`).join('');
  return `<div class="page-head"><div class="page-title">Sửa chữa &amp; hàn</div></div>${items||'<div class="empty">Không có hạng mục sửa chữa.</div>'}`;
}

function renderVatTu(){
  const activeDots = state.dots.filter(d=>d.trangThai==='Đang diễn ra');
  return `<div class="page-head"><div class="page-title">Vật tư sử dụng</div><button class="btn" onclick="toggleForm('vattu')">+ Thêm dòng</button></div>${state.showForm.vattu?`<div class="form-panel"><div class="form-grid"><div class="field"><label>Đợt</label><select id="vt-dot">${activeDots.map(d=>`<option value="${d.id}">${d.ten}</option>`).join('')}</select></div><div class="field"><label>Tên vật tư</label><input id="vt-ten"></div><div class="field"><label>Số lượng</label><input id="vt-soluong"></div></div><div class="form-actions"><button class="btn" onclick="addVatTu()">Lưu</button></div></div>`:''}`;
}

function renderAnalysis(){ return '<div class="page-head"><div class="page-title">Phân tích nguyên nhân</div></div>'; }

loadAll();
</script>
</body>
</html>
