<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLSC ỐNG LÒ HƠI — NHIỆT ĐIỆN NGHI SƠN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0d1b26; --panel:#132635; --panel2:#1a3245; --border:#274156; --border-soft:#1e3547;
  --text:#e9eef2; --muted:#8fa3b3; --dim:#54697a;
  --accent:#e08a3c; --accent-soft:#3a2712;
  --danger:#e2564f; --danger-soft:#3a1f1d;
  --warn:#e0b23c; --warn-soft:#3a3012;
  --good:#4fb88a; --good-soft:#163429;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --display:'Big Shoulders Display',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}
::selection{background:var(--accent);color:#1a1305;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand-row{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.logo-mark{width:38px;height:38px;flex-shrink:0;}
.brand-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
.brand-title{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;letter-spacing:.01em;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-size:13px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--text);border-color:var(--border);}
.nav-tag{font-family:var(--mono);font-size:10px;font-weight:600;width:26px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);color:var(--dim);flex-shrink:0;}
.nav-item.active .nav-tag{color:var(--accent);border-color:var(--accent-soft);}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border-soft);margin-top:10px;}
.user-pill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.user-pill .u-role{font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:block;font-family:var(--mono);}
.logout-btn{background:none;border:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:4px 0 0;}
.bottom-nav{display:none;}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.page-title{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#1a1305;border:none;padding:10px 15px;border-radius:6px;font-size:12.5px;font-weight:600;}
.btn:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.btn-ghost:hover{background:var(--panel2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #4a2422;padding:6px 10px;border-radius:5px;font-size:11.5px;}
.file-btn{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.file-btn:hover{border-color:#3a4450;}
input[type=file]{display:none;}
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px;}
.stat-card .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-card .val{font-family:var(--display);font-size:28px;font-weight:800;margin-top:5px;}
.stat-card.danger .val{color:var(--danger);}
.stat-card.warn .val{color:var(--warn);}
.stat-card.good .val{color:var(--good);}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:24px 0 10px;}
.record{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:9px;}
.record:hover{border-color:#3a4450;}
.tag-chip{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--dim);background:#0d1b26;border:1px solid var(--border);border-radius:4px;padding:3px 7px;margin-right:8px;}
.record-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.record-loc{font-weight:600;font-size:13.5px;}
.record-meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.record-meta span{margin-right:12px;}
.status{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.status.good{background:var(--good-soft);color:var(--good);}
.status.warn{background:var(--warn-soft);color:var(--warn);}
.status.danger{background:var(--danger-soft);color:var(--danger);}
.record-note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--border-soft);padding-top:7px;}
.record-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);}
.mini-btn:hover{color:var(--text);border-color:#3a4450;}
.empty{color:var(--dim);font-size:13px;padding:26px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
.form-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:#0d1b26;border:1px solid var(--border);border-radius:6px;padding:8px 9px;color:var(--text);font-size:13px;}
.field input:disabled{color:var(--muted);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.form-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap;}
.readonly-box{background:#0d1b26;border:1px solid var(--border-soft);border-radius:6px;padding:8px 9px;font-family:var(--mono);font-size:13px;color:var(--accent);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.dm{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
table.dm th{background:var(--panel2);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.dm td{padding:8px 10px;border-bottom:1px solid var(--border-soft);}
table.dm tr:last-child td{border-bottom:none;}
.cause-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
.cause-list{display:flex;flex-direction:column;gap:6px;}
.cause-item{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:11px 13px;color:var(--muted);font-size:13px;}
.cause-item.active{background:var(--panel2);color:var(--text);border-color:var(--accent-soft);}
.cause-item b{display:block;color:inherit;font-size:13.5px;margin-bottom:2px;}
.cause-detail{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;position:sticky;top:20px;}
.cause-detail h3{font-family:var(--display);font-size:21px;margin:0 0 4px;}
.cause-detail .cause-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.cause-detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:14px 0 7px;}
.cause-detail ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#c9cfd4;}
.loading{padding:60px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.08em;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 25% 15%,#16324a 0%,var(--bg) 62%);}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px 26px;}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-title{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;}
.tabbtns{display:flex;gap:6px;margin-bottom:16px;background:var(--panel2);border-radius:7px;padding:3px;}
.tabbtn{flex:1;padding:8px;text-align:center;border-radius:5px;font-size:12.5px;color:var(--muted);background:none;border:none;}
.tabbtn.active{background:var(--accent);color:#1a1305;font-weight:600;}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;}
.weld-row{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--border-soft);border-radius:6px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;background:#0d1b26;}
.weld-id{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:150px;}
.weld-chk{display:flex;align-items:center;gap:4px;color:var(--muted);}
.weld-badge{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:10px;text-transform:uppercase;}
.weld-badge.bp{background:var(--warn-soft);color:var(--warn);}
.weld-badge.official{background:var(--good-soft);color:var(--good);}
.repair-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:14px 16px;}
.repair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.progress-mini{font-family:var(--mono);font-size:11px;color:var(--muted);}
.section-sub{margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border-soft);}
@media(max-width:880px){ .grid-cards{grid-template-columns:repeat(2,1fr);} .cause-grid{grid-template-columns:1fr;} .cause-detail{position:static;} .form-grid{grid-template-columns:1fr;} }
@media(max-width:720px){
  .sidebar{display:none;}
  .main{padding:16px 14px 90px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9px;padding:4px 5px;flex-shrink:0;}
  .bn-item.active{color:var(--accent);}
  .bn-tag{font-family:var(--mono);font-size:9.5px;font-weight:700;width:22px;height:17px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);}
  .bn-item.active .bn-tag{border-color:var(--accent-soft);color:var(--accent);}
  .page-title{font-size:22px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxen4XWVFuS_vFnaSO5uJdLfUPv4Czs0k3nny_UdPruHaB_IcwiAAeZA_j4heIbW_LUEA/exec";

const LOGO_SVG = '<svg class="logo-mark" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="19" fill="none" stroke="#e08a3c" stroke-width="3"/><circle cx="22" cy="22" r="11" fill="none" stroke="#e08a3c" stroke-width="3" opacity="0.55"/><circle cx="22" cy="22" r="3" fill="#e08a3c"/></svg>';

const NAV = [
  {id:'overview', tag:'TQ', label:'Tổng quan'},
  {id:'dots',     tag:'ĐV', label:'Đợt kiểm tra'},
  {id:'danhmuc',  tag:'DM', label:'Danh mục kỹ thuật'},
  {id:'kiemtra',  tag:'ĐĐ', label:'Kiểm tra (đo đạc)'},
  {id:'suachua',  tag:'SC', label:'Sửa chữa & hàn'},
  {id:'vattu',    tag:'VT', label:'Vật tư sử dụng'},
  {id:'history',  tag:'LS', label:'Lịch sử & xu hướng'},
  {id:'analysis', tag:'PT', label:'Phân tích kỹ thuật'}
];

const CAUSES = [
  {id:'erosion', name:'Mài mòn tro bay (ăn mòn phía khói)', where:'Ống sinh hơi vùng đổi hướng dòng khói, gần miệng đốt', causes:['Tốc độ, nồng độ tro bay cao tại vùng đổi hướng dòng khói'], signs:['Bề mặt ống mỏng dần dạng rãnh khía hình yên ngựa'], fix:['Cắt bỏ đoạn ống, hàn nối ống mới']},
  {id:'waterside', name:'Ăn mòn phía nước / hơi', where:'Ống sinh hơi, ống góp', causes:['Chất lượng nước cấp không đạt'], signs:['Rỗ ăn mòn cục bộ'], fix:['Cắt và thay ống mới', 'Súc rửa hóa chất']}
];

let state = {
  session:null, authView:'login', authErr:'',
  tab:'overview', loading:true,
  users:[], danhMuc:[], taiLieu:[], kiemTra:[], suaChua:[], dots:[], vatTu:[], telegram:{},
  showForm:{danhmuc:false,tailieu:false,kiemtra:false,dot:false,vattu:false},
  activeCause:CAUSES[0].id, ktSel:{dotId:'',heThong:'',thietBi:'',vung:'',viTri:'',lopOng:''},
  ktCandidates:[], ktResolved:null, vtSel:{dotId:''}, scFilter:{dotId:'',toMay:'',heThong:'',thietBi:''},
  ovYear:null, ovDot:null, ovMode:'current', expandedRepair:null, expandedHistory:null, expandedOldCycles:null
};

function pad(n){ return String(n).padStart(4,'0'); }
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('vi-VN'); }
function simpleHash(str){ let h=0; str=String(str); for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return 'h'+Math.abs(h).toString(36); }
function uniq(arr){ return [...new Set(arr)]; }
function pipeCode(r){ return (r.toMay?r.toMay+' · ':'')+r.heThong+' - '+r.thietBi+' - '+r.viTri+' - '+r.lopOng; }

async function apiCall(action, payload) {
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({action, payload})
    });
    return await res.json();
  } catch (e) {
    console.error(e);
    alert("Lỗi kết nối máy chủ Google Sheet!");
    return {success: false, error: e.message};
  }
}

async function loadAll(){
  const sessionEmail = localStorage.getItem('app_session_email');
  const res = await apiCall('PULL_DATA');
  
  if(res.success) {
    const db = res.data;
    state.users = db.Users || [];
    state.dots = db.Dots || [];
    state.danhMuc = db.Danh_Muc || [];
    state.taiLieu = db.Tai_Lieu || [];
    state.kiemTra = db.Kiem_Tra || [];
    state.suaChua = (db.Sua_Chua || []).map(s => ({...s, welds: JSON.parse(s.welds||'[]')}));
    state.vatTu = db.Vat_Tu || [];
    
    if(sessionEmail) {
      state.session = state.users.find(u => u.email === sessionEmail);
    }
  } else {
    alert("Không thể tải dữ liệu: " + res.error);
  }
  state.loading = false;
  render();
}

async function syncAndSave(table, record) {
  let dbRec = {...record};
  if(table === 'Sua_Chua' && dbRec.welds) dbRec.welds = JSON.stringify(dbRec.welds);
  await apiCall('UPSERT', {table, record: dbRec});
}

async function syncBatchAndSave(table, records) {
  let dbRecs = records.map(r => {
    let rec = {...r};
    if(table === 'Sua_Chua' && rec.welds) rec.welds = JSON.stringify(rec.welds);
    return rec;
  });
  await apiCall('UPSERT_BATCH', {table, records: dbRecs});
}

/* ---------- ĐỢT KIỂM TRA / SỬA CHỮA ---------- */
window.addDot = async function(){
  const g=id=>document.getElementById(id).value.trim();
  const ten=g('dot-ten'), toMay=g('dot-tomay'), ngayBatDau=g('dot-batdau')||todayStr();
  if(!ten || !toMay){ alert('Vui lòng nhập Tên đợt và Tổ máy.'); return; }
  const dot = {id:'DOT-'+pad(state.dots.length+1), ten, toMay, ngayBatDau, ngayKetThuc:'', trangThai:'Đang diễn ra'};
  state.dots.unshift(dot);
  state.showForm.dot=false; render();
  await syncAndSave('Dots', dot);
};
window.closeDot = async function(id){
  if(!confirm('Đóng đợt này?')) return;
  const d = state.dots.find(x=>x.id===id); if(!d) return;
  d.trangThai='Đã hoàn thành'; d.ngayKetThuc=todayStr();
  render(); await syncAndSave('Dots', d);
};
window.reopenDot = async function(id){
  const d = state.dots.find(x=>x.id===id); if(!d) return;
  d.trangThai='Đang diễn ra'; d.ngayKetThuc='';
  render(); await syncAndSave('Dots', d);
};

/* ---------- AUTH ---------- */
async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  if(!name||!email||!pass){ state.authErr='Vui lòng nhập đủ thông tin.'; render(); return; }
  if(state.users.find(u=>u.email===email)){ state.authErr='Email đã được đăng ký.'; render(); return; }
  const role = state.users.length===0 ? 'admin' : 'ky_thuat';
  const user = {id: 'U-'+Date.now(), name, email, passHash: simpleHash(pass), role};
  state.users.push(user);
  state.session = user; state.authErr='';
  localStorage.setItem('app_session_email', email);
  render();
  await syncAndSave('Users', user);
}
async function doLogin(){
  const email=document.getElementById('log-email').value.trim().toLowerCase();
  const pass=document.getElementById('log-pass').value;
  const user = state.users.find(u=>u.email===email);
  if(!user || user.passHash !== simpleHash(pass)){ state.authErr='Email hoặc mật khẩu sai.'; render(); return; }
  state.session=user; state.authErr='';
  localStorage.setItem('app_session_email', email);
  render();
}
async function doLogout(){ state.session=null; localStorage.removeItem('app_session_email'); render(); }
window.setAuthView = v => { state.authView=v; state.authErr=''; render(); };
window.doRegister=doRegister; window.doLogin=doLogin; window.doLogout=doLogout;

/* ---------- DANH MỤC ---------- */
window.addDanhMuc = async function(){
  const g=id=>document.getElementById(id).value.trim();
  const rec={id:'DM-'+Date.now(), toMay:g('dm-tomay'), heThong:g('dm-hethong'), thietBi:g('dm-thietbi'), viTriTu:g('dm-vitritu'), viTriDen:g('dm-vitriden'), lopOngTu:g('dm-lopongtu'), lopOngDen:g('dm-lopongden'), vung:g('dm-vung'), duongKinh:g('dm-duongkinh'), chieuDay:g('dm-chieuday'), vatLieu:g('dm-vatlieu'), ghiChu:g('dm-ghichu')};
  state.danhMuc.push(rec); state.showForm.danhmuc=false; render();
  await syncAndSave('Danh_Muc', rec);
};
window.deleteDanhMuc = async function(id){
  if(!confirm('Xóa dòng này?')) return;
  state.danhMuc = state.danhMuc.filter(r=>r.id!==id); render();
  await apiCall('DELETE_RECORD', {table: 'Danh_Muc', id});
};
window.clearAllDanhMuc = async function(){
  if(!confirm('Bạn có chắc chắn muốn XÓA SẠCH toàn bộ bảng Danh mục trên CẢ CLOUD không?')) return;
  state.danhMuc = []; render();
  await apiCall('CLEAR_TABLE', {table: 'Danh_Muc'});
  alert('Đã xóa sạch dữ liệu Danh mục trên Google Sheet.');
};
window.importDanhMuc = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    const wb = XLSX.read(e.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let added=0; const newlyAdded = [];
    rows.forEach(r=>{
      const vung=String(r['Quy ước vùng vật liệu trên bản vẽ']||r['Vùng']||r['Vung']||'').trim();
      const duongKinh=r['Đường kính']||r['Duong kinh'], chieuDay=r['Chiều dày']||r['Chieu day'];
      if(!duongKinh||!chieuDay) return;
      const newRec = {id:'DM-'+Date.now()+'-'+added, 
        toMay:String(r['Tổ máy (để trống = dùng chung)']||'').trim(), heThong:String(r['Hệ thống']||'').trim(), thietBi:String(r['Thiết bị']||'').trim(),
        viTriTu:String(r['Vị trí từ']||''), viTriDen:String(r['Vị trí đến']||''), lopOngTu:String(r['Lớp ống từ']||''), lopOngDen:String(r['Lớp ống đến']||''),
        vung: vung||'#', duongKinh:String(duongKinh), chieuDay:String(chieuDay), vatLieu:String(r['Vật liệu']||''), ghiChu:String(r['Ghi chú']||'')};
      state.danhMuc.push(newRec); newlyAdded.push(newRec); added++;
    });
    render();
    await syncBatchAndSave('Danh_Muc', newlyAdded);
    alert('Đã nhập '+added+' dòng từ Excel.'); input.value='';
  };
  reader.readAsArrayBuffer(file);
};
window.exportDanhMuc = function(){
  const rows = state.danhMuc.map((r,i)=>({'STT':i+1,'Tổ máy (để trống = dùng chung)':r.toMay,'Hệ thống':r.heThong,'Thiết bị':r.thietBi,'Vị trí từ':r.viTriTu,'Vị trí đến':r.viTriDen,'Lớp ống từ':r.lopOngTu,'Lớp ống đến':r.lopOngDen,'Quy ước vùng vật liệu trên bản vẽ':r.vung,'Đường kính':r.duongKinh,'Chiều dày':r.chieuDay,'Vật liệu':r.vatLieu,'Ghi chú':r.ghiChu}));
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'DanhMuc'); XLSX.writeFile(wb,'danh-muc-ky-thuat.xlsx');
};

/* ---------- KIỂM TRA & SỬA CHỮA ---------- */
window.ktSelect = function(level, value){
  if(level==='dotId'){ state.ktSel.dotId=value; state.ktSel.heThong=''; state.ktSel.thietBi=''; state.ktSel.vung=''; }
  if(level==='heThong'){ state.ktSel.heThong=value; state.ktSel.thietBi=''; state.ktSel.vung=''; }
  if(level==='thietBi'){ state.ktSel.thietBi=value; state.ktSel.vung=''; }
  render(); window.updateKtDerived();
};
function inRange(val, from, to){
  const v=parseFloat(val); if(isNaN(v)) return false;
  const f = (from===undefined||from===''||isNaN(parseFloat(from))) ? -Infinity : parseFloat(from);
  const t = (to===undefined||to===''||isNaN(parseFloat(to))) ? Infinity : parseFloat(to);
  return v>=f && v<=t;
}
function ktCandidates(toMay, heThong, thietBi, viTri, lopOng){
  if(!heThong || !viTri || !lopOng) return [];
  return state.danhMuc.filter(r=> r.heThong===heThong && (!thietBi || r.thietBi===thietBi) && (!r.toMay || r.toMay===toMay) && inRange(viTri, r.viTriTu, r.viTriDen) && inRange(lopOng, r.lopOngTu, r.lopOngDen));
}
window.updateKtDerived = function(){
  const vt = document.getElementById('kt-vitri'), lo = document.getElementById('kt-lopong');
  if(!vt || !lo) return;
  state.ktSel.viTri = vt.value.trim(); state.ktSel.lopOng = lo.value.trim();
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const candidates = ktCandidates(dotObj?dotObj.toMay:'', state.ktSel.heThong, state.ktSel.thietBi, state.ktSel.viTri, state.ktSel.lopOng);
  state.ktResolved = candidates.length===1 ? candidates[0] : null;
  const box = id=>document.getElementById(id);
  if(box('kt-vung-box')) box('kt-vung-box').textContent = state.ktResolved? state.ktResolved.vung : '—';
};
window.addKiemTra = async function(){
  const g=id=>document.getElementById(id).value.trim();
  window.updateKtDerived();
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const dm = state.ktResolved;
  if(!dm || !g('kt-do')){ alert('Vui lòng điền đủ thông tin hợp lệ.'); return; }
  const phanTram = (parseFloat(g('kt-do'))/parseFloat(dm.chieuDay)*100).toFixed(1);
  const rec = {id:'KT-'+Date.now(), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay, heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri:g('kt-vitri'), lopOng:g('kt-lopong'), duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay, chieuDayDo:g('kt-do'), phanTramConLai: phanTram, ngoaiDang:g('kt-ngoaidang'), ngay:g('kt-ngay')||todayStr(), nguoiKiemTra: state.session.name};
  state.kiemTra.unshift(rec); state.showForm.kiemtra=false; 
  await syncSuaChua(rec); render();
  await syncAndSave('Kiem_Tra', rec);
};

function pipeKeyOf(k){ return (k.toMay||'')+'|'+k.heThong+'|'+k.thietBi+'|'+k.viTri+'|'+k.lopOng; }
async function syncSuaChua(latest){
  const key = pipeKeyOf(latest);
  if(parseFloat(latest.phanTramConLai) > 70) return;
  let activeItem = state.suaChua.find(s=>s.pipeKey===key && s.trangThai!=='Hoàn thành');
  if(!activeItem){
    const idBase = (latest.toMay?latest.toMay+' · ':'')+latest.heThong+' - '+latest.thietBi+' - '+latest.viTri+' - '+latest.lopOng;
    activeItem = {id:idBase+'-'+Date.now(), pipeKey:key, chuKy:1, dotId:latest.dotId, toMay:latest.toMay,
      heThong:latest.heThong, thietBi:latest.thietBi, viTri:latest.viTri, lopOng:latest.lopOng,
      chieuDayTK:latest.chieuDayTK, chieuDayDoGanNhat:latest.chieuDayDo, phanTramConLai:latest.phanTramConLai,
      ngayTao:todayStr(), trangThai:'Chờ xử lý', ngayHoanThanh:'', phuongAn:'Cắt thay',
      welds:[{id:idBase+'-w1', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:''}]};
    state.suaChua.push(activeItem);
  } else {
    activeItem.chieuDayDoGanNhat = latest.chieuDayDo; activeItem.phanTramConLai = latest.phanTramConLai;
  }
  await syncAndSave('Sua_Chua', activeItem);
}

function recomputeStatus(item){
  const official = item.welds.filter(w=>w.loai==='chinh_thuc');
  if(official.length===0){ item.trangThai='Chờ xử lý'; return; }
  if(official.every(w=>w.daCat && w.daHan && w.paut==='Đạt')){ item.trangThai='Hoàn thành'; item.ngayHoanThanh = todayStr(); } 
  else { item.trangThai='Đang tiến hành'; item.ngayHoanThanh=''; }
}
window.toggleWeldFlag = async function(itemId, weldId, field){
  const item = state.suaChua.find(s=>s.id===itemId); const w = item.welds.find(x=>x.id===weldId);
  w[field] = !w[field]; recomputeStatus(item); render(); await syncAndSave('Sua_Chua', item);
};
window.setWeldPaut = async function(itemId, weldId, value){
  const item = state.suaChua.find(s=>s.id===itemId); const w = item.welds.find(x=>x.id===weldId);
  w.paut = value; recomputeStatus(item); render(); await syncAndSave('Sua_Chua', item);
};

/* ---------- RENDER LOGIC ---------- */
function render(){
  const app=document.getElementById('app');
  if(state.loading){ app.innerHTML='<div class="loading">ĐANG TẢI DỮ LIỆU TỪ GOOGLE SHEET…</div>'; return; }
  if(!state.session){ app.innerHTML = renderAuth(); return; }
  const roleLabel = {admin:'Quản trị',ky_thuat:'Kỹ thuật viên'}[state.session.role]||state.session.role;
  app.innerHTML = `<div class="shell">
    <div class="sidebar">
      <div class="brand-row">${LOGO_SVG}<div><div class="brand-eyebrow">Nhiệt điện Nghi Sơn</div><div class="brand-title">QLSC ỐNG LÒ HƠI</div></div></div>
      <div class="nav">${NAV.map(n=>`<button class="nav-item ${state.tab===n.id?'active':''}" onclick="setTab('${n.id}')"><span class="nav-tag">${n.tag}</span><span>${n.label}</span></button>`).join('')}</div>
      <div class="sidebar-foot">
        <div class="user-pill"><div><div>${esc(state.session.name)}</div><span class="u-role">${roleLabel}</span></div><button class="logout-btn" onclick="doLogout()">Đăng xuất</button></div>
      </div>
    </div>
    <div class="main">${renderTab()}</div>
  </div>`;
}

function renderAuth(){
  const isLogin = state.authView==='login';
  return `<div class="login-wrap"><div class="login-card">
    <div class="login-brand">${LOGO_SVG}<div><div class="brand-eyebrow">Công ty Nhiệt điện Nghi Sơn</div><div class="login-title">Quản lý sửa chữa ống lò hơi</div></div></div>
    <div class="tabbtns"><button class="tabbtn ${isLogin?'active':''}" onclick="setAuthView('login')">Đăng nhập</button><button class="tabbtn ${!isLogin?'active':''}" onclick="setAuthView('register')">Đăng ký</button></div>
    ${isLogin ? `
      <div class="field" style="margin-bottom:10px;"><label>Email</label><input id="log-email" type="email"></div>
      <div class="field" style="margin-bottom:10px;"><label>Mật khẩu</label><input id="log-pass" type="password"></div>
      ${state.authErr?`<div class="err-msg">${esc(state.authErr)}</div>`:''}
      <div class="form-actions" style="justify-content:stretch;"><button class="btn" style="width:100%;" onclick="doLogin()">Đăng nhập</button></div>
    ` : `
      <div class="field" style="margin-bottom:10px;"><label>Họ và tên</label><input id="reg-name" type="text"></div>
      <div class="field" style="margin-bottom:10px;"><label>Email</label><input id="reg-email" type="email"></div>
      <div class="field" style="margin-bottom:10px;"><label>Mật khẩu</label><input id="reg-pass" type="password"></div>
      ${state.authErr?`<div class="err-msg">${esc(state.authErr)}</div>`:''}
      <div class="form-actions" style="justify-content:stretch;"><button class="btn" style="width:100%;" onclick="doRegister()">Tạo tài khoản</button></div>
    `}
  </div></div>`;
}

function renderTab(){
  if(state.tab==='overview') return renderOverview();
  if(state.tab==='dots') return renderDots();
  if(state.tab==='danhmuc') return renderDanhMuc();
  if(state.tab==='kiemtra') return renderKiemTra();
  if(state.tab==='suachua') return renderSuaChua();
  if(state.tab==='vattu') return `<div class="empty">Module Vật tư (Rút gọn cho demo hiển thị)</div>`;
  if(state.tab==='history') return `<div class="empty">Module Lịch sử (Rút gọn cho demo hiển thị)</div>`;
  if(state.tab==='analysis') return `<div class="empty">Module Phân tích (Rút gọn cho demo hiển thị)</div>`;
}

function renderOverview(){ return `<div class="page-head"><div><div class="page-title">Bảng điều khiển</div></div></div><div class="empty">Đang kết nối thành công với Google Sheets.</div>`; }
function renderDots(){ return `<div class="page-head"><div><div class="page-title">Đợt kiểm tra / sửa chữa</div></div><button class="btn" onclick="toggleForm('dot')">+ Tạo đợt mới</button></div>${state.showForm.dot?`<div class="form-panel"><div class="form-grid"><div class="field full"><label>Tên đợt</label><input id="dot-ten"></div><div class="field"><label>Tổ máy</label><input id="dot-tomay"></div></div><div class="form-actions"><button class="btn" onclick="addDot()">Lưu</button></div></div>`:''}${state.dots.map(d=>`<div class="record"><div class="record-top"><b>${esc(d.ten)}</b><span class="status ${d.trangThai==='Đang diễn ra'?'warn':'good'}">${esc(d.trangThai)}</span></div>${d.trangThai==='Đang diễn ra'?`<button class="mini-btn" onclick="closeDot('${d.id}')" style="margin-top:10px;">Đóng đợt</button>`:''}</div>`).join('')}`; }
function renderDanhMuc(){
  return `<div class="page-head"><div><div class="page-title">Danh mục kỹ thuật ống</div></div>
    <div class="head-actions">
      <button class="btn-danger" onclick="clearAllDanhMuc()">Xóa sạch (Cả trên Sheet)</button>
      <label class="file-btn">Nhập Excel<input type="file" onchange="importDanhMuc(this)"></label>
      <button class="btn" onclick="toggleForm('danhmuc')">${state.showForm.danhmuc?'Đóng':'+ Thêm dòng'}</button>
    </div></div>
    ${state.showForm.danhmuc?`<div class="form-panel"><div class="form-grid"><div class="field"><label>Hệ thống</label><input id="dm-hethong"></div><div class="field"><label>Vùng</label><input id="dm-vung"></div><div class="field"><label>ĐK</label><input id="dm-duongkinh"></div><div class="field"><label>Dày</label><input id="dm-chieuday"></div></div><div class="form-actions"><button class="btn" onclick="addDanhMuc()">Lưu</button></div></div>`:''}
    <div class="table-wrap"><table class="dm"><thead><tr><th>Hệ thống</th><th>Vùng</th><th>ĐK</th><th>Dày</th><th></th></tr></thead><tbody>${state.danhMuc.slice(0,50).map(r=>`<tr><td>${esc(r.heThong)}</td><td>${esc(r.vung)}</td><td>${esc(r.duongKinh)}</td><td>${esc(r.chieuDay)}</td><td><button class="btn-danger" onclick="deleteDanhMuc('${r.id}')">Xóa</button></td></tr>`).join('')}</tbody></table></div>`;
}
function renderKiemTra(){ return `<div class="page-head"><div><div class="page-title">Kiểm tra đo đạc</div></div></div><div class="empty">Dữ liệu lấy từ Sheet Kiem_Tra...</div>`; }

function renderSuaChua(){
  /* HIỂN THỊ CẢ HẠNG MỤC ĐÃ HOÀN THÀNH NẾU ĐỢT VẪN ĐANG DIỄN RA */
  const allActive = state.suaChua.filter(item => {
    const dot = state.dots.find(d => d.id === item.dotId);
    const isDotActive = dot && dot.trangThai === 'Đang diễn ra';
    return item.trangThai !== 'Hoàn thành' || isDotActive;
  });

  const items = allActive.map(item=>{
    const s = item.trangThai==='Hoàn thành'?'good':(item.trangThai==='Đang tiến hành'?'warn':'danger');
    const weldRows = item.welds.map(w=>`<div class="weld-row"><span class="weld-id">${esc(w.id)}</span><label class="weld-chk"><input type="checkbox" ${w.daCat?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daCat')"> Đã cắt</label><label class="weld-chk"><input type="checkbox" ${w.daHan?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daHan')"> Đã hàn</label><select onchange="setWeldPaut('${item.id}','${w.id}', this.value)" style="background:#0d1b26;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11.5px;"><option ${w.paut==='Chưa kiểm tra'?'selected':''}>Chưa kiểm tra</option><option ${w.paut==='Đạt'?'selected':''}>Đạt</option><option ${w.paut==='Lỗi'?'selected':''}>Lỗi</option></select></div>`).join('');
    return `<div class="repair-item"><div class="repair-head"><div><b>${esc(item.id)}</b> <span class="progress-mini">${item.phanTramConLai}% còn lại</span></div><span class="status ${s}">${esc(item.trangThai)}</span></div><div style="margin-top:12px;">${weldRows}</div></div>`;
  }).join('');
  return `<div class="page-head"><div><div class="page-title">Sửa chữa &amp; hàn</div></div></div>${items || '<div class="empty">Không có hạng mục cần sửa.</div>'}`;
}

window.setTab = t => { state.tab=t; render(); window.scrollTo(0,0); };
window.toggleForm = k => { state.showForm[k]=!state.showForm[k]; render(); };
loadAll();
</script>
