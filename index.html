window.ktMatrixSave = async function(){
  if(!can('kiemTra')){ noPermAlert(); return; }
  const m = state.ktMatrix;
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  if(!dotObj){ alert('Vui lòng chọn Đợt kiểm tra/sửa chữa.'); return; }
  if(!state.ktSel.heThong){ alert('Vui lòng chọn Hệ thống.'); return; }
  const ngay = m.ngay || todayStr();
  const nguoi = state.session? state.session.name : '—';
  let created=0, updated=0, skipped=0; const belowThreshold=[];
  const exceptionMap = {};
  (m.exceptions||[]).forEach(ex=>{ if(ex.viTri && ex.lopOng && ex.ngoaiDang) exceptionMap[ex.viTri+'__'+ex.lopOng] = ex.ngoaiDang; });
  const pendingCreate = [], pendingUpdate = []; // gom lai, gui gop thanh toi da 2 request thay vi tung o mot
  m.viTriList.forEach(vt=>{
    m.lopOngCols.forEach(lo=>{
      const key = vt+'__'+lo;
      const cell = m.cells[key];
      if(!cell || cell.val===undefined || cell.val===null || String(cell.val).trim()==='') return;
      const dm = m.resolved[key];
      if(!dm || dm==='conflict' || isNaN(parseFloat(cell.val))){ skipped++; return; }
      const chieuDayDo = String(cell.val).trim();
      const phanTramConLai = (parseFloat(chieuDayDo)/parseFloat(dm.chieuDay)*100);
      if(cell.existingId){
        const rec = state.kiemTra.find(r=>r.id===cell.existingId);
        if(rec){
          rec.danhMucId=dm.id; rec.vung=dm.vung; rec.duongKinh=dm.duongKinh; rec.chieuDayTK=dm.chieuDay;
          rec.chieuDayDo=chieuDayDo; rec.phanTramConLai=phanTramConLai.toFixed(1);
          // Chỉ ghi đè Ngoại dạng khi có đánh dấu MỚI trong bảng lần này — nếu không, giữ nguyên giá trị
          // đã lưu trước đó (tránh vô tình xóa mất ghi nhận bất thường cũ khi chỉ sửa lại số đo).
          if(exceptionMap[key]) rec.ngoaiDang = exceptionMap[key];
          pendingUpdate.push(rec);
          updated++;
          if(phanTramConLai<=70) belowThreshold.push(rec);
        }
      } else {
        const rec = {
          id:genId('KT'), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay,
          heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri:vt, lopOng:lo,
          duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay, chieuDayDo, phanTramConLai:phanTramConLai.toFixed(1),
          ngoaiDang: exceptionMap[key] || 'Bình thường', ngay, nguoiKiemTra:nguoi
        };
        state.kiemTra.unshift(rec);
        pendingCreate.push(rec);
        created++;
        if(phanTramConLai<=70) belowThreshold.push(rec);
      }
    });
  });
  if(created===0 && updated===0){ alert('Chưa có ô nào được nhập số liệu hợp lệ để lưu.'); return; }
  await persist('kiem-tra', state.kiemTra, true);
  // Gui len Google Sheet theo LO — toi da 2 request (1 cho o moi, 1 cho o cap nhat) thay vi tung o mot goi
  // 1 request rieng nhu truoc (khong cho/await) — cach cu voi bang lon (hang chuc/hang tram o) se ban ra
  // ngan ay request cung luc, nghen hang doi khoa ben Apps Script va rot mat phan lon (dung loi da gap o
  // Nhap Excel hang loat, sau do lai gap tiep o day vi ham nay chua duoc sua cung dot).
  const [createResult, updateResult] = await Promise.all([
    syncKiemTraBatch(pendingCreate),
    syncKiemTraBatchUpdate(pendingUpdate)
  ]);
  await syncSuaChua();
  state.ktMatrix = {active:false, editMode:false, ngay:'', rangeFrom:'', rangeTo:'', viTriList:[], lopOngCols:[], cells:{}, resolved:{}, exceptions:[]};
  render();
  const syncFailed = !createResult.ok || !updateResult.ok;
  const syncNote = syncFailed
    ? '\n\n⚠️ LỖI: một phần dữ liệu chưa ghi được lên Google Sheet (lỗi mạng/máy chủ) — dữ liệu tạm thời chỉ có trên máy này. Vui lòng bấm "Đồng bộ lại" sau ít phút để kiểm tra, và mở lại bảng để lưu bổ sung phần còn thiếu nếu cần.'
    : (createResult.skippedDup ? '\n\nGhi chú: '+createResult.skippedDup+' ô đã có sẵn trên Sheet từ trước (trùng dữ liệu), không bị ghi đè/nhân đôi.' : '');
  alert('Đã lưu bảng kiểm tra: '+created+' bản ghi mới'+(updated?(', cập nhật '+updated+' bản ghi đã có'):'')+'.'+(skipped?(' Bỏ qua '+skipped+' ô không xác định được vùng vật liệu (xung đột/không khớp Danh mục hoặc số liệu không hợp lệ).'):'')+syncNote);
  if(belowThreshold.length && state.telegram.botToken && state.telegram.chatIdsCanhBao && state.telegram.chatIdsCanhBao.length){
    const lines = belowThreshold.map(r=>'• '+pipeCode(r)+': '+r.chieuDayDo+'mm/'+r.chieuDayTK+'mm ('+r.phanTramConLai+'%)').join('\n');
    sendTelegram('⚠️ <b>CẢNH BÁO CHIỀU DÀY — '+belowThreshold.length+' vị trí dưới ngưỡng (nhập dạng bảng)</b>\n'+lines+'\nĐã đưa vào danh sách cắt thay.');
  }
};
function renderKtMatrix(){
  const m = state.ktMatrix;
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj?dotObj.toMay:'';
  const activeDots = state.dots.filter(d=>d.trangThai==='Đang diễn ra');
  const heThongOpts = uniq(state.danhMuc.filter(r=>isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)).map(r=>r.heThong));
  const thietBiOpts = uniq(state.danhMuc.filter(r=>(isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)) && r.heThong===state.ktSel.heThong).map(r=>r.thietBi));
  const opt = (arr, cur) => `<option value="">— Chọn —</option>` + arr.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)||'(không có)'}</option>`).join('');

  let gridHtml = '<div class="empty" style="padding:14px 0;">Chưa có dòng nào — nhập khoảng Vị trí rồi bấm "Tạo dải vị trí", hoặc bấm "+ Thêm 1 dòng".</div>';
  if(state.ktSel.heThong && m.viTriList.length && m.lopOngCols.length){
    const headCols = m.lopOngCols.map(lo=>`<th>Lớp ${esc(lo)}</th>`).join('');
    const bodyRows = m.viTriList.map(vt=>{
      const cells = m.lopOngCols.map(lo=>{
        const key = vt+'__'+lo;
        const dm = m.resolved[key];
        const cellData = m.cells[key];
        const val = cellData? (cellData.val||'') : '';
        if(dm===null || dm===undefined){
          const diag = ktDiagnoseMismatch(toMay, state.ktSel.heThong, state.ktSel.thietBi, vt, lo);
          return `<td class="mtx-na" title="${esc(diag.label)}">–</td>`;
        }
        if(dm==='conflict'){
          return `<td class="mtx-conflict" title="Danh mục kỹ thuật có nhiều vùng vật liệu chồng lấn tại ô này — vào tab Danh mục kỹ thuật sửa lại dải Vị trí/Lớp ống trước khi nhập">⚠</td>`;
        }
        let cls = '', pctText = '';
        const pv = parseFloat(val);
        if(val!=='' && !isNaN(pv)){
          const p = pv/parseFloat(dm.chieuDay)*100;
          if(!isNaN(p)){ cls = p<=70?'mtx-danger':(p<=85?'mtx-warn':'mtx-good'); pctText = p.toFixed(0)+'%'; }
        }
        return `<td class="${cls}"><input class="mtx-input" type="text" inputmode="decimal" value="${esc(val)}" placeholder="${esc(dm.chieuDay)}" oninput="ktMatrixCellInput('${esc(vt)}','${esc(lo)}', this)"><div class="mtx-pct" id="${mtxKeyId(key)}">${esc(pctText)}</div></td>`;
      }).join('');
      return `<tr><td class="mtx-vitri">${esc(vt)} <span class="mtx-rowdel" onclick="ktMatrixRemoveRow('${esc(vt)}')" title="Bỏ dòng này khỏi bảng đang nhập (không xóa bản ghi đã lưu)">✕</span></td>${cells}</tr>`;
    }).join('');
    gridHtml = `<div class="mtx-wrap"><table class="mtx"><thead><tr><th>Vị trí</th>${headCols}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
  }

  return `<div class="form-panel">
    <div class="mtx-toolbar">
      <div class="field"><label>Đợt *</label><select onchange="ktSelect('dotId', this.value)">${activeDots.map(d=>`<option value="${esc(d.id)}" ${d.id===state.ktSel.dotId?'selected':''}>${esc(d.ten)} — ${esc(d.toMay)}</option>`).join('')}</select></div>
      <div class="field"><label>Hệ thống *</label><select onchange="ktSelect('heThong', this.value)">${opt(heThongOpts, state.ktSel.heThong)}</select></div>
      <div class="field"><label>Thiết bị</label><select onchange="ktSelect('thietBi', this.value)" ${!state.ktSel.heThong?'disabled':''}>${opt(thietBiOpts, state.ktSel.thietBi)}</select></div>
      <div class="field"><label>Ngày kiểm tra</label><input type="date" value="${esc(m.ngay||todayStr())}" onchange="state.ktMatrix.ngay=this.value"></div>
    </div>
    ${state.ktSel.heThong ? `<div class="mtx-toolbar">
      <div class="field"><label>Từ vị trí</label><input id="mtx-range-from" type="text" placeholder="VD: 1"></div>
      <div class="field"><label>Đến vị trí</label><input id="mtx-range-to" type="text" placeholder="VD: 64"></div>
      <button class="mini-btn" onclick="ktMatrixSetRange()">Tạo dải vị trí</button>
      <button class="mini-btn" onclick="ktMatrixAddRow()">+ Thêm 1 dòng</button>
      <button class="mini-btn" onclick="ktMatrixAddCol()">+ Thêm cột lớp ống</button>
      <button class="mini-btn" onclick="ktMatrixRemoveCol()">− Bớt cột lớp ống</button>
      <button class="mini-btn" onclick="ktMatrixLoadExisting()">Tải dữ liệu đã có (để sửa)</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Ô xám "–" là lớp ống không tồn tại theo Danh mục kỹ thuật tại vị trí đó. Ô "⚠" là xung đột Danh mục kỹ thuật. Bỏ trống ô nào thì ô đó không được lưu — sửa dữ liệu đã có sẽ CẬP NHẬT đúng bản ghi cũ, không tạo trùng.</div>` : `<div class="empty" style="padding:10px 0;">Chọn Hệ thống để bắt đầu.</div>`}
    ${state.ktSel.heThong ? gridHtml : ''}
    ${(state.ktSel.heThong && m.viTriList.length) ? (()=>{
      const viOptsAll = ktMatrixFilledViTriList();
      const exRows = m.exceptions.map((ex,idx)=>{
        const loOpts = ex.viTri ? ktMatrixFilledLopOngForViTri(ex.viTri) : [];
        return `<div class="mtx-toolbar">
          <select onchange="ktMatrixExceptionSet(${idx},'viTri',this.value)">
            <option value="">— Vị trí —</option>
            ${viOptsAll.map(v=>`<option value="${esc(v)}" ${v===ex.viTri?'selected':''}>${esc(v)}</option>`).join('')}
          </select>
          <select onchange="ktMatrixExceptionSet(${idx},'lopOng',this.value)" ${!ex.viTri?'disabled':''}>
            <option value="">— Lớp ống —</option>
            ${loOpts.map(v=>`<option value="${esc(v)}" ${v===ex.lopOng?'selected':''}>Lớp ${esc(v)}</option>`).join('')}
          </select>
          <select onchange="ktMatrixExceptionSet(${idx},'ngoaiDang',this.value)">
            ${NGOAI_DANG_BAT_THUONG.map(v=>`<option value="${esc(v)}" ${v===ex.ngoaiDang?'selected':''}>${esc(v)}</option>`).join('')}
          </select>
          <button class="mini-btn" onclick="ktMatrixExceptionRemove(${idx})">Xóa</button>
        </div>`;
      }).join('');
      return `<div style="margin-top:14px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px;">Ghi nhận Ngoại dạng bất thường (nếu có)</div>
        ${exRows}
        <button class="mini-btn" onclick="ktMatrixExceptionAdd()">+ Đánh dấu 1 ô bất thường</button>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Chỉ chọn được Vị trí/Lớp ống đã có số đo trong bảng trên. Ô nào không được đánh dấu ở đây sẽ tự lưu là "Bình thường".</div>
      </div>`;
    })() : ''}
    <div class="form-actions"><button class="btn-ghost" onclick="ktMatrixClose()">Đóng</button><button class="btn" onclick="ktMatrixSave()">Lưu bảng kiểm tra</button></div>
  </div>`;
}

/* ---------- Hội thoại giọng nói cho Kiểm tra (đo chiều dày) — chế độ đo liên tục ---------- */
function buildKtWizardSteps(loopMode){
  const steps = [];
  if(!loopMode){
    steps.push({key:'dotId', label:'Đợt', kind:'choice', confirm:false,
      prompt:'Đọc tên đợt kiểm tra sửa chữa.',
      getOptions:()=> state.dots.filter(d=>d.trangThai==='Đang diễn ra').map(d=>({value:d.id, label:d.ten}))});
    steps.push({key:'heThong', label:'Hệ thống', kind:'choice', confirm:false,
      prompt:'Đọc tên hệ thống.',
      getOptions:(data)=>{
        const dotObj = state.dots.find(d=>d.id===data.dotId);
        const toMay = dotObj?dotObj.toMay:'';
        const list = uniq(state.danhMuc.filter(r=>isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)).map(r=>r.heThong).filter(Boolean));
        return list.map(v=>({value:v,label:v}));
      }});
    steps.push({key:'thietBi', label:'Thiết bị', kind:'choice', confirm:false, optional:true,
      prompt:'Đọc tên thiết bị, hoặc nói "bỏ qua" nếu hệ thống này không chia thiết bị.',
      getOptions:(data)=>{
        const dotObj = state.dots.find(d=>d.id===data.dotId);
        const toMay = dotObj?dotObj.toMay:'';
        const list = uniq(state.danhMuc.filter(r=> r.heThong===data.heThong && (isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay))).map(r=>r.thietBi).filter(Boolean));
        return list.map(v=>({value:v,label:v}));
      }});
  }
  steps.push({key:'viTri', label:'Vị trí', kind:'number', confirm:false,
    prompt:'Đọc số vị trí.'});
  steps.push({key:'lopOng', label:'Lớp ống', kind:'number', confirm:false,
    prompt:'Đọc số lớp ống.'});
  steps.push({kind:'resolve', compute:(data)=>{
    const dotObj = state.dots.find(d=>d.id===data.dotId);
    const toMay = dotObj?dotObj.toMay:'';
    const candidates = ktCandidates(toMay, data.heThong, data.thietBi, String(data.viTri), String(data.lopOng));
    if(candidates.length===1){
      const dm = candidates[0];
      data.__dm = dm;
      return {ok:true, message:'Đã xác định vùng '+dm.vung+', đường kính '+dm.duongKinh+' mi-li-mét, chiều dày thiết kế '+dm.chieuDay+' mi-li-mét.'};
    } else if(candidates.length===0){
      return {ok:false, backSteps:-2, message:'Không tìm thấy vùng vật liệu nào khớp vị trí và lớp ống này trong Danh mục kỹ thuật. Anh đọc lại vị trí và lớp ống nhé.'};
    } else {
      return {ok:false, backSteps:-2, message:'Có nhiều vùng vật liệu bị chồng lấn cho vị trí này, không thể tự xác định. Anh đọc lại vị trí và lớp ống, hoặc vào Danh mục kỹ thuật sửa lại cho hết chồng lấn.'};
    }
  }});
  steps.push({key:'chieuDayDo', label:'Chiều dày đo', kind:'number', confirm:true, unit:'mi li mét',
    prompt:'Đọc chiều dày đo được.'});
  steps.push({key:'ngoaiDang', label:'Ngoại dạng', kind:'text', confirm:false, optional:true,
    prompt:'Mô tả ngoại dạng bên ngoài, hoặc nói "bỏ qua".'});
  steps.push({kind:'resolve', compute: async (data)=>{
    const dotObj = state.dots.find(d=>d.id===data.dotId);
    const dm = data.__dm;
    if(!dotObj || !dm) return {ok:false, fatal:true, message:'Thiếu thông tin, không thể lưu bản ghi này.'};
    const phanTramConLai = (parseFloat(data.chieuDayDo)/parseFloat(dm.chieuDay)*100);
    const rec = {
      id:genId('KT'), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay,
      heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri:String(data.viTri), lopOng:String(data.lopOng),
      duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay,
      chieuDayDo:String(data.chieuDayDo), phanTramConLai: phanTramConLai.toFixed(1),
      ngoaiDang:data.ngoaiDang||'', ngay:todayStr(),
      nguoiKiemTra: state.session? state.session.name : '—'
    };
    state.kiemTra.unshift(rec);
    await persist('kiem-tra', state.kiemTra, true);
    syncToSheet('kiem_tra', rec);
    await syncSuaChua();
    render();
    if(phanTramConLai<=70 && state.telegram.botToken && state.telegram.chatIdsCanhBao && state.telegram.chatIdsCanhBao.length){
      sendTelegram('CẢNH BÁO CHIỀU DÀY — '+rec.id+'\n'
        +'Vị trí: '+pipeCode(rec)+'\n'
        +'Chiều dày đo: '+rec.chieuDayDo+'mm / Thiết kế: '+dm.chieuDay+'mm ('+rec.phanTramConLai+'% còn lại)\n'
        +'Đã đưa vào danh sách cắt thay.');
    }
    return {ok:true, message:'Đã lưu, còn lại '+phanTramConLai.toFixed(0)+' phần trăm.'};
  }});
  steps.push({key:'__loop', label:'Tiếp tục', kind:'choice', confirm:false,
    prompt:'Đo tiếp vị trí khác cùng thiết bị này chứ? Nói "tiếp" hoặc "xong".',
    getOptions:()=> [{value:'tiep',label:'Tiếp tục đo'},{value:'xong',label:'Xong, kết thúc'}],
    onPick:(value, data)=>{
      if(value==='tiep'){
        const loopData = {dotId:data.dotId, dotId_label:data.dotId_label, heThong:data.heThong, heThong_label:data.heThong_label, thietBi:data.thietBi, thietBi_label:data.thietBi_label};
        state.wizard = null;
        openWizard({title:'Kiểm tra (đo chiều dày)', steps: buildKtWizardSteps(true), data: loopData});
      } else {
        closeWizard();
      }
    }});
  return steps;
}

function scSafeSheetName(s){

// Xuat bao cao dep, theo tung Dot (1 sheet = 1 dot), dung de in/luu tru — thay cho ban bang du lieu tho truoc day
window.exportKiemTra = async function(){
  if(!(await withXLSXReady())) return;
  if(!state.kiemTra.length){ alert('Chưa có bản ghi kiểm tra nào để xuất.'); return; }
  const NCOL = 13;
  const byDot = {};
  state.kiemTra.forEach(r=>{ const k=r.dotId||'(chưa gán đợt)'; if(!byDot[k]) byDot[k]=[]; byDot[k].push(r); });
  const dotIds = Object.keys(byDot).sort((a,b)=>{
    const da=state.dots.find(x=>x.id===a), db=state.dots.find(x=>x.id===b);
    return (da?da.ten:a).localeCompare(db?db.ten:b);
  });
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  dotIds.forEach(dotId=>{
    const d = state.dots.find(x=>x.id===dotId);
    const rows = byDot[dotId].slice().sort((a,b)=> (a.heThong||'').localeCompare(b.heThong||'') || (a.viTri||'').localeCompare(b.viTri||'') || (a.ngay||'').localeCompare(b.ngay||''));
    const aoa = []; const merges = [];
    aoa.push(['BIÊN BẢN KIỂM TRA CHIỀU DÀY ỐNG LÒ HƠI']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['NHIỆT ĐIỆN NGHI SƠN']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Đợt kiểm tra/sửa chữa:', d?d.ten:dotId,'','','Tổ máy:', d?d.toMay:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['Thời gian:', (d&&d.ngayBatDau?fmtDate(d.ngayBatDau):'')+(d&&d.ngayKetThuc?(' đến '+fmtDate(d.ngayKetThuc)):' (đang diễn ra)'),'','','Trạng thái:', d?d.trangThai:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['STT','Hệ thống','Thiết bị','Quy ước vùng vật liệu trên bản vẽ','Vị trí','Lớp ống','Đường kính TK (mm)','Chiều dày TK (mm)','Chiều dày đo (mm)','% còn lại','Ngoại dạng','Ngày kiểm tra','Người kiểm tra']);
    rows.forEach((r,i)=>{ aoa.push([i+1, r.heThong, r.thietBi, r.vung, r.viTri, r.lopOng, r.duongKinh, r.chieuDayTK, r.chieuDayDo, r.phanTramConLai, r.ngoaiDang, fmtDate(r.ngay), r.nguoiKiemTra]); });
    aoa.push([]);
    aoa.push(['Tổng số bản ghi: '+rows.length]); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Người kiểm tra (ký, ghi rõ họ tên)','','','','Người lập biên bản (ký, ghi rõ họ tên)','','','','Xác nhận của đơn vị (ký, đóng dấu)']);
    { const rIdx = aoa.length-1;
      merges.push({s:{r:rIdx,c:0},e:{r:rIdx,c:3}});
      merges.push({s:{r:rIdx,c:4},e:{r:rIdx,c:7}});
      merges.push({s:{r:rIdx,c:8},e:{r:rIdx,c:NCOL-1}}); }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:6},{wch:16},{wch:16},{wch:22},{wch:12},{wch:10},{wch:12},{wch:12},{wch:12},{wch:10},{wch:14},{wch:13},{wch:16}];
    ws['!merges'] = merges;
    let name = scSafeSheetName(d?d.ten:dotId);
    if(usedNames[name]){ usedNames[name]++; name = scSafeSheetName(name+' ('+usedNames[name]+')'); } else { usedNames[name]=1; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb,'bien-ban-kiem-tra-chieu-day-ong.xlsx');
};

window.exportKiemTraMatrix = async function(){
  if(!(await withXLSXReady())) return;
  if(!state.kiemTra.length){ alert('Chưa có bản ghi kiểm tra nào để xuất.'); return; }
  const byDot = {};
  state.kiemTra.forEach(r=>{ const k=r.dotId||'(chưa gán đợt)'; if(!byDot[k]) byDot[k]=[]; byDot[k].push(r); });
  const dotIds = Object.keys(byDot).sort((a,b)=>{
    const da=state.dots.find(x=>x.id===a), db=state.dots.find(x=>x.id===b);
    return (da?da.ten:a).localeCompare(db?db.ten:b);
  });
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  dotIds.forEach(dotId=>{
    const d = state.dots.find(x=>x.id===dotId);
    const dotRecs = byDot[dotId];
    let maxLop = 1;
    dotRecs.forEach(r=>{ const n=parseFloat(r.lopOng); if(!isNaN(n)&&n>maxLop) maxLop=n; });
    const NCOL = 6+maxLop;
    const byGroup = {};
    dotRecs.forEach(r=>{ const gk=(r.heThong||'')+'|||'+(r.thietBi||''); if(!byGroup[gk]) byGroup[gk]=[]; byGroup[gk].push(r); });
    const groupKeys = Object.keys(byGroup).sort((a,b)=>a.localeCompare(b));
    const aoa = []; const merges = [];
    aoa.push(['BIÊN BẢN KIỂM TRA CHIỀU DÀY ỐNG LÒ HƠI (DẠNG BẢNG)']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['NHIỆT ĐIỆN NGHI SƠN']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Đợt kiểm tra/sửa chữa:', d?d.ten:dotId,'','','Tổ máy:', d?d.toMay:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['Thời gian:', (d&&d.ngayBatDau?fmtDate(d.ngayBatDau):'')+(d&&d.ngayKetThuc?(' đến '+fmtDate(d.ngayKetThuc)):' (đang diễn ra)'),'','','Trạng thái:', d?d.trangThai:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    let totalRows = 0;
    groupKeys.forEach(gk=>{
      const [heThong, thietBi] = gk.split('|||');
      const recs = byGroup[gk];
      const titleIdx = aoa.length;
      aoa.push([(heThong||'(không có hệ thống)')+(thietBi?(' — '+thietBi):'')]);
      merges.push({s:{r:titleIdx,c:0},e:{r:titleIdx,c:NCOL-1}});
      const h1 = aoa.length;
      const row1 = ['STT','Hệ thống','Thiết bị','Vị trí','Đường kính TK (mm)','Chiều dày TK (mm)','Chiều dày đo được (mm)'];
      for(let i=1;i<maxLop;i++) row1.push('');
      aoa.push(row1);
      const h2 = aoa.length;
      const row2 = ['','','','','','']; for(let i=1;i<=maxLop;i++) row2.push('Lớp '+i);
      aoa.push(row2);
      merges.push({s:{r:h1,c:0},e:{r:h2,c:0}}); merges.push({s:{r:h1,c:1},e:{r:h2,c:1}});
      merges.push({s:{r:h1,c:2},e:{r:h2,c:2}}); merges.push({s:{r:h1,c:3},e:{r:h2,c:3}});
      merges.push({s:{r:h1,c:4},e:{r:h2,c:4}}); merges.push({s:{r:h1,c:5},e:{r:h2,c:5}});
      merges.push({s:{r:h1,c:6},e:{r:h1,c:6+maxLop-1}});
      const byViTri = {};
      recs.forEach(r=>{ const key=String(r.viTri); if(!byViTri[key]) byViTri[key]=[]; byViTri[key].push(r); });
      const viTris = Object.keys(byViTri).sort((a,b)=>(parseFloat(a)-parseFloat(b))||a.localeCompare(b));
      viTris.forEach((vt,idx)=>{
        const byLop = {}; byViTri[vt].forEach(r=>{ byLop[String(r.lopOng)]=r; });
        const first = byViTri[vt][0];
        const row = [idx+1, heThong, thietBi, vt, first.duongKinh, first.chieuDayTK];
        for(let i=1;i<=maxLop;i++){ const r=byLop[String(i)]; row.push(r?r.chieuDayDo:'-'); }
        aoa.push(row); totalRows++;
      });
      aoa.push([]);
    });
    aoa.push(['Tổng số vị trí: '+totalRows]); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Người kiểm tra (ký, ghi rõ họ tên)','','','','Người lập biên bản (ký, ghi rõ họ tên)','','','','Xác nhận của đơn vị (ký, đóng dấu)']);
    { const rIdx = aoa.length-1;
      merges.push({s:{r:rIdx,c:0},e:{r:rIdx,c:Math.min(3,NCOL-1)}});
      if(NCOL>4) merges.push({s:{r:rIdx,c:4},e:{r:rIdx,c:Math.min(7,NCOL-1)}});
      if(NCOL>8) merges.push({s:{r:rIdx,c:8},e:{r:rIdx,c:NCOL-1}}); }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const cols = [{wch:6},{wch:16},{wch:14},{wch:10},{wch:12},{wch:12}];
    for(let i=0;i<maxLop;i++) cols.push({wch:9});
    ws['!cols'] = cols;
    ws['!merges'] = merges;
    let name = scSafeSheetName(d?d.ten:dotId);
    if(usedNames[name]){ usedNames[name]++; name = scSafeSheetName(name+' ('+usedNames[name]+')'); } else { usedNames[name]=1; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb,'bien-ban-kiem-tra-chieu-day-ong-dang-bang.xlsx');
};
window.deleteKiemTra = async function(id){
  if(!can('kiemTra')){ noPermAlert(); return; }
  if(!confirm('Xóa bản ghi kiểm tra này? Sẽ xóa cả trên Google Sheet (nếu đã có). Chỉ nên xóa các bản ghi tạo lỗi/trùng lặp, vì dữ liệu đo đạc dùng để tính xu hướng mòn ống.')) return;
  const removed = state.kiemTra.find(r=>r.id===id);
  state.kiemTra = state.kiemTra.filter(r=>r.id!==id);
  await persist('kiem-tra', state.kiemTra, true);
  render(); // xoa ngay tren giao dien cho nhanh, cho ket qua xoa tren Sheet chay ngam ben duoi
  // Truoc day KHONG cho (await) buoc nay — neu xoa tren Sheet loi/cham (vd dang co nhieu request khac
  // xep hang), ban ghi van bien mat "ao" o may nay nhung Sheet (nguon du lieu dung chung) van con, roi
  // lan dong bo ngam ke tiep se keo ban ghi cu ve va hien lai — dung y tinh huong da gap. Nay cho (await)
  // ket qua that su, neu that bai thi khoi phuc lai ban ghi + bao loi ro rang thay vi de tu hoi phuc am tham.
  const ok = await deleteFromSheet('KiemTra', id);
  if(!ok && removed){
    state.kiemTra.push(removed);
    await persist('kiem-tra', state.kiemTra, true);
    alert('Không xóa được trên Google Sheet (lỗi mạng/máy chủ) — bản ghi đã được khôi phục lại, chưa mất. Vui lòng thử xóa lại khi mạng ổn định.');
    render();
  }
};
// Phat hien + doc file Excel dang BANG MA TRAN, DOC THANG TU MANG-THO (khong dung sheet_to_json mac dinh) —
// vi mau bien ban NDT thuong co tieu de 2 DONG (dong 1: STT/He thong/Thiet bi/Vi tri/...; dong 2 (duoi tieu
// de gop o "Chieu day do duoc"): Lop ong 1..8) — sheet_to_json mac dinh CHI lay dong 1 lam ten cot, khien
// toan bo nhan "Lop ong 1..8" bi lac vao NHU MOT DONG DU LIEU, va khong con cot nao ten "Lop ong N" nua ->
// nhan sai la file dang danh sach dai, roi bo qua sach du lieu vi thieu cot "Chieu day do (mm)". Ham nay
// quet toi da 6 dong dau tim dong chua nhan "Lop ong N" (bat ky dong nao), roi tim rieng cac cot He thong/
// Thiet bi/Vi tri/Ngay kiem tra trong CAC DONG TU DAU DEN DONG DO — nen doc dung du la tieu de 1 dong hay 2 dong.
function ktMatrixParseSheet(ws){
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  if(!aoa.length) return null;
  const scanRows = Math.min(aoa.length, 6);
  let lopHeaderRow = -1, lopOngCols = [];
  for(let i=0;i<scanRows;i++){
    const cols = [];
    (aoa[i]||[]).forEach((cell,ci)=>{
      const m = String(cell).match(/l[ớo]p\s*[ốo]ng\s*(\d+)/i);
      if(m) cols.push({col:ci, n:parseInt(m[1],10)});
    });
    if(cols.length>=1){ lopHeaderRow = i; lopOngCols = cols; break; }
  }
  if(lopHeaderRow===-1) return null;
  lopOngCols.sort((a,b)=>a.n-b.n);
  // Dò cột theo kiểu "bắt đầu bằng" (không cần khớp tuyệt đối cả cụm từ) — vì tiêu đề thực tế có thể là
  // "Ngày kiểm tra", "Ngày đo", hay chỉ ngắn gọn "Ngày" — khớp cứng nguyên cụm dễ bị trượt nếu người lập
  // file đặt tên hơi khác đi.
  const findCol = (prefixes)=>{
    for(let i=0;i<=lopHeaderRow;i++){
      const row = aoa[i]||[];
      for(let ci=0;ci<row.length;ci++){
        const norm = normalizeVN(row[ci]);
        if(norm && prefixes.some(p=>norm.startsWith(p))) return ci;
      }
    }
    return -1;
  };
  const heThongCol = findCol(['he thong']);
  const thietBiCol = findCol(['thiet bi']);
  const viTriCol = findCol(['vi tri']);
  const ngayCol = findCol(['ngay kiem tra','ngay do','ngay']);
  if(heThongCol===-1 || viTriCol===-1) return null;
  return {lopOngCols, heThongCol, thietBiCol, viTriCol, ngayCol, dataRows: aoa.slice(lopHeaderRow+1)};
}
// Chuyen 1 o ngay-thang trong Excel (co the la so serial cua Excel, chuoi "dd/mm/yyyy", hoac da la
// "yyyy-mm-dd") ve dung dinh dang ISO "yyyy-MM-dd" ma fmtDate()/input type=date cua app dang can.
function parseExcelDateCell(val){
  if(val===undefined || val===null || val==='') return '';
  if(typeof val==='number' && isFinite(val)){
    const ms = Math.round((val-25569)*86400*1000); // 25569 = so ngay giua moc Excel (1899-12-30) va moc Unix (1970-01-01)
    const d = new Date(ms);
    if(isNaN(d.getTime())) return '';
    return d.toISOString().slice(0,10);
  }
  const s = String(val).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return '';
}
window.importKiemTra = function(input){
  if(!can('kiemTra')){ noPermAlert(); input.value=''; return; }
  const file=input.files[0]; if(!file) return;
  if(!state.ktSel.dotId){ alert('Vui lòng chọn Đợt kiểm tra/sửa chữa (ở bảng "+ Nhập/sửa kết quả") trước khi nhập Excel — toàn bộ dữ liệu trong file sẽ được gắn vào đợt/tổ máy đó.'); input.value=''; return; }
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const reader=new FileReader();
  reader.onload=async e=>{
    if(!(await withXLSXReady())) return;
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const mtx = ktMatrixParseSheet(ws);
    let added=0, skipped=0, ambiguous=0, missingHeader=0;
    const reasonTally = {};
    const pendingSync = []; // gom het lai, gui 1 lan duy nhat len Google Sheet sau khi doc xong file
    const belowThreshold = []; // cac ban ghi <=70% con lai, dung de canh bao Telegram sau khi nhap xong (truoc day ham nay bi thieu, chi ktMatrixSave/them tay/giong noi moi co canh bao)
    if(mtx){
      // ---- Dạng bảng ma trận (tiêu đề 1 hoặc 2 dòng): mỗi dòng dữ liệu = 1 Vị trí, mỗi cột Lớp ống N có số liệu riêng ----
      mtx.dataRows.forEach(row=>{
        const rowHasContent = (row||[]).some(c=>String(c===undefined||c===null?'':c).trim()!=='');
        if(!rowHasContent) return;
        const heThong = String(row[mtx.heThongCol]||'').trim();
        const thietBi = mtx.thietBiCol>=0 ? String(row[mtx.thietBiCol]||'').trim() : '';
        const viTriVal = String(row[mtx.viTriCol]||'').trim();
        if(!heThong || !viTriVal){ missingHeader++; return; }
        const ngay = (mtx.ngayCol>=0 ? parseExcelDateCell(row[mtx.ngayCol]) : '') || todayStr();
        mtx.lopOngCols.forEach(col=>{
          const raw = row[col.col];
          const cellStr = String(raw===undefined||raw===null?'':raw).trim();
          if(!cellStr || cellStr==='-' || cellStr==='—') return;
          if(isNaN(parseFloat(cellStr))){ skipped++; return; }
          const candidates = ktCandidates(dotObj.toMay, heThong, thietBi, viTriVal, String(col.n));
          const dm = candidates.length===1 ? candidates[0] : null;
          if(!dm){
            if(candidates.length>1) ambiguous++;
            else {
              skipped++;
              const diag = ktDiagnoseMismatch(dotObj.toMay, heThong, thietBi, viTriVal, String(col.n));
              reasonTally[diag.code] = (reasonTally[diag.code]||{count:0,label:diag.label});
              reasonTally[diag.code].count++;
              reasonTally[diag.code].label = diag.label;
            }
            return;
          }
          const phanTramConLai=(parseFloat(cellStr)/parseFloat(dm.chieuDay)*100);
          const newRec = {id:genId('KT'), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay, heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri:viTriVal, lopOng:String(col.n), duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay, chieuDayDo:cellStr, phanTramConLai:phanTramConLai.toFixed(1), ngoaiDang:'Bình thường', ngay, nguoiKiemTra: state.session?state.session.name:'—'};
          state.kiemTra.unshift(newRec);
          pendingSync.push(newRec);
          if(phanTramConLai<=70) belowThreshold.push(newRec);
          added++;
        });
      });
    } else {
      // ---- Dạng danh sách dài (như cũ): mỗi dòng = 1 bản ghi (1 Vị trí + 1 Lớp ống) ----
      const rows=XLSX.utils.sheet_to_json(ws, {defval:''});
      rows.forEach(r=>{
        const heThong=r['Hệ thống']||r['He thong'], thietBi=r['Thiết bị']||r['Thiet bi']||'';
        const vungCol=String(r['Quy ước vùng vật liệu trên bản vẽ']||r['Vùng']||r['Vung']||'');
        const viTri=String(r['Vị trí']||r['Vi tri']||''), lopOng=String(r['Lớp ống']||r['Lop ong']||'');
        const chieuDayDo = r['Chiều dày đo (mm)']||r['Chieu day do'];
        if(!heThong || !viTri || !lopOng || !chieuDayDo){ skipped++; return; }
        let candidates = ktCandidates(dotObj.toMay, String(heThong), String(thietBi), viTri, lopOng);
        let dm = candidates.length===1 ? candidates[0] : (vungCol ? candidates.find(c=>c.vung===vungCol) : null);
        if(!dm){
          if(candidates.length>1) ambiguous++;
          else {
            skipped++;
            const diag = ktDiagnoseMismatch(dotObj.toMay, String(heThong), String(thietBi), viTri, lopOng);
            reasonTally[diag.code] = (reasonTally[diag.code]||{count:0,label:diag.label});
            reasonTally[diag.code].count++;
            reasonTally[diag.code].label = diag.label;
          }
          return;
        }
        const phanTramConLai=(parseFloat(chieuDayDo)/parseFloat(dm.chieuDay)*100);
        const newRec = {id:genId('KT'), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay, heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri, lopOng, duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay, chieuDayDo:String(chieuDayDo), phanTramConLai:phanTramConLai.toFixed(1), ngoaiDang:String(r['Ngoại dạng']||r['Ngoai dang']||''), ngay:(parseExcelDateCell(r['Ngày kiểm tra']||r['Ngay kiem tra'])||todayStr()), nguoiKiemTra:String(r['Người kiểm tra']||r['Nguoi kiem tra']||(state.session?state.session.name:''))};
        state.kiemTra.unshift(newRec);
        pendingSync.push(newRec);
        if(phanTramConLai<=70) belowThreshold.push(newRec);
        added++;
      });
    }
    await persist('kiem-tra', state.kiemTra, true);
    // Gui het len Google Sheet trong 1 request duy nhat (thay vi tung dong mot nhu truoc — cach cu voi
    // file vai tram dong se ban ra ngan ay request gan nhu cung luc, nghen hang doi khoa ben Apps Script
    // va rot mat phan lon). Apps Script se tu bo qua cac dong da co san (dung cho truong hop nhap lai
    // dung file sau khi lan truoc bi loi mang chi luu duoc mot phan) nen nhap lai an toan, khong nhan doi.
    let batchResult = {ok:true, written:0, skippedDup:0, skippedIds:[]};
    let belowThresholdFinal = belowThreshold;
    if(pendingSync.length){
      batchResult = await syncKiemTraBatch(pendingSync);
      if(batchResult.ok && batchResult.skippedIds && batchResult.skippedIds.length){
        const skipSet = new Set(batchResult.skippedIds);
        state.kiemTra = state.kiemTra.filter(k=>!skipSet.has(k.id));
        await persist('kiem-tra', state.kiemTra, true);
        // Bo nhung ban ghi bi coi la trung (da co san tren Sheet tu truoc) khoi danh sach canh bao —
        // vi day khong phai phat hien MOI, tranh bao dong gia moi lan nhap lai dung 1 file.
        belowThresholdFinal = belowThreshold.filter(r=>!skipSet.has(r.id));
      }
    }
    await syncSuaChua();
    const reasonLines = Object.keys(reasonTally).sort((a,b)=>reasonTally[b].count-reasonTally[a].count)
      .map(code=>'• ('+reasonTally[code].count+' ô/dòng) '+reasonTally[code].label).join('\n');
    let syncMsg;
    if(!pendingSync.length){
      syncMsg = '';
    } else if(!batchResult.ok){
      syncMsg = '\n\n⚠️ LỖI: Không gửi được lên Google Sheet ('+(batchResult.error||'không rõ nguyên nhân')+'). Dữ liệu đang tạm chỉ có trên máy này, CHƯA có trên Sheet — vui lòng thử nhập lại file này khi mạng ổn định (nhập lại sẽ an toàn, không bị nhân đôi các dòng đã lỡ ghi được).';
    } else {
      syncMsg = '\n\nĐã ghi lên Google Sheet: '+batchResult.written+' dòng mới.'+(batchResult.skippedDup?(' Bỏ qua '+batchResult.skippedDup+' dòng đã có sẵn trên Sheet trước đó (trùng Đợt/Hệ thống/Thiết bị/Vị trí/Lớp ống/Ngày) — không ghi đè, không nhân đôi.'):'');
    }
    alert('Đã nhập '+added+' bản ghi vào đợt "'+dotObj.ten+'"'+(mtx?(' (nhận diện file dạng bảng ma trận, '+mtx.lopOngCols.length+' cột lớp ống)'):'')+'. Bỏ qua '+skipped+' ô/dòng không khớp Danh mục kỹ thuật hoặc thiếu dữ liệu.'+(ambiguous?(' '+ambiguous+' ô/dòng có nhiều vùng khớp — cần sửa lại Danh mục kỹ thuật cho các dải không chồng lấn.'):'')+(missingHeader?(' '+missingHeader+' dòng bị bỏ qua hoàn toàn vì không đọc được cột "Hệ thống"/"Vị trí" — kiểm tra lại đúng tên cột trong file.'):'')+(reasonLines?('\n\nChi tiết nguyên nhân không khớp Danh mục kỹ thuật:\n'+reasonLines):'')+syncMsg);
    input.value=''; render();
    // Canh bao Telegram cho cac ban ghi <=70% con lai TRUOC DAY BI THIEU o luong Nhap Excel — chi cac form
    // nhap tay (bang ma tran/giong noi) moi co canh bao nay, khien nhap hang loat qua Excel (thuong la
    // luong nhieu du lieu nhat, de sot canh bao quan trong nhat) bi im lang. Chi gui khi ghi thanh cong
    // len Sheet (batchResult.ok) — tranh bao "da phat hien" cho du lieu thuc ra chua luu duoc.
    if(belowThresholdFinal.length && batchResult.ok && state.telegram.botToken && state.telegram.chatIdsCanhBao && state.telegram.chatIdsCanhBao.length){
      const lines = belowThresholdFinal.map(r=>'• '+pipeCode(r)+': '+r.chieuDayDo+'mm/'+r.chieuDayTK+'mm ('+r.phanTramConLai+'%)').join('\n');
      sendTelegram('⚠️ <b>CẢNH BÁO CHIỀU DÀY — '+belowThresholdFinal.length+' vị trí dưới ngưỡng (nhập Excel)</b>\n'+lines+'\nĐã đưa vào danh sách cắt thay.');
    }
  };
  reader.readAsArrayBuffer(file);
};

/* ---------- SỬA CHỮA & HÀN ---------- */
function pipeKeyOf(k){ return (k.toMay||'')+'|'+k.heThong+'|'+k.thietBi+'|'+k.viTri+'|'+k.lopOng; }
async function syncSuaChua(){
  const byPipe = {};
  state.kiemTra.forEach(k=>{
    const key = pipeKeyOf(k);
    if(!byPipe[key]) byPipe[key]=[];
    byPipe[key].push(k);
  });
  Object.keys(byPipe).forEach(key=>{
    const history = byPipe[key].slice().sort((a,b)=>a.ngay.localeCompare(b.ngay));
    const existingItems = state.suaChua.filter(s=>s.pipeKey===key).sort((a,b)=>a.chuKy-b.chuKy);
    const lastItem = existingItems.length ? existingItems[existingItems.length-1] : null;
    // nếu chu kỳ trước đã hoàn thành (đã thay ống), chỉ xét các lần đo SAU ngày hoàn thành đó — không nối tiếp xu hướng ống cũ
    const cycleStart = (lastItem && lastItem.trangThai==='Hoàn thành' && lastItem.ngayHoanThanh) ? lastItem.ngayHoanThanh : null;
    const relevant = cycleStart ? history.filter(h=>h.ngay > cycleStart) : history;
    if(relevant.length===0) return;
    const latest = relevant[relevant.length-1];
    // Đẩy sang Sửa chữa khi HOẶC chiều dày còn lại ≤70%, HOẶC ngoại dạng quan sát được là bất thường
    // (Rỗ ăn mòn/Biến dạng-phình/Nứt/Mài mòn cục bộ/Khác) — dù chiều dày vẫn còn tốt, vì đây là các dấu
    // hiệu hư hỏng cần xử lý ngay, không chỉ dựa vào % còn lại.
    const ngoaiDangBatThuong = NGOAI_DANG_BAT_THUONG.includes(latest.ngoaiDang);
    if(parseFloat(latest.phanTramConLai) > 70 && !ngoaiDangBatThuong) return;
    let activeItem = (lastItem && lastItem.trangThai!=='Hoàn thành') ? lastItem : null;
    if(!activeItem){
      const chuKy = (lastItem ? lastItem.chuKy : 0) + 1;
      const idBase = (latest.toMay?latest.toMay+' · ':'')+latest.heThong+' - '+latest.thietBi+' - '+latest.viTri+' - '+latest.lopOng;
      const displayId = idBase + (chuKy>1 ? (' (Chu kỳ '+chuKy+')') : '');
      activeItem = {id:displayId, pipeKey:key, chuKy, dotId:latest.dotId, toMay:latest.toMay,
        heThong:latest.heThong, thietBi:latest.thietBi, viTri:latest.viTri, lopOng:latest.lopOng,
        chieuDayTK:latest.chieuDayTK, chieuDayDoGanNhat:latest.chieuDayDo, phanTramConLai:latest.phanTramConLai,
        ngoaiDangGanNhat: latest.ngoaiDang||'', ghiChuXoaMoiHan:'',
        ngayTao:todayStr(), trangThai:'Chờ xử lý', ngayHoanThanh:'', phuongAn:'Cắt thay',
        choPhepThiCong:false, nguoiChoPhep:'', thoiGianChoPhep:'',
        welds:[{id:displayId+'-w1', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:'', nguoiThucHien:'', nguoiXacNhanPAUT:''},
               {id:displayId+'-w2', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:'', nguoiThucHien:'', nguoiXacNhanPAUT:''}]};
      state.suaChua.push(activeItem);
      syncToSheet('sua_chua_item', activeItem);
    } else {
      activeItem.chieuDayDoGanNhat = latest.chieuDayDo; activeItem.phanTramConLai = latest.phanTramConLai;
      activeItem.ngoaiDangGanNhat = latest.ngoaiDang||'';
    }
    if(activeItem.phuongAn==='Cắt thay') recomputeStatus(activeItem);
  });
  await persist('sua-chua', state.suaChua, true);
}
function recomputeStatus(item){
  if(item.welds.length===0){ item.trangThai='Chờ xử lý'; return; }
  // Phải hoàn thành TOÀN BỘ mối hàn — cả chính thức lẫn biện pháp — mới coi là xong,
  // vì mối hàn biện pháp (mở để cắt/nâng hạ) chưa đóng lại thì công việc chưa thể coi là kết thúc.
  const allDone = item.welds.every(w=>w.daCat && w.daHan && w.paut==='Đạt');
  if(allDone){
    item.trangThai='Hoàn thành';
    if(!item.ngayHoanThanh) item.ngayHoanThanh = todayStr();
  } else {
    item.trangThai='Đang tiến hành';
    item.ngayHoanThanh='';
  }
}
window.setPhuongAn = async function(itemId, value){
  if(!can('hanCat')){ noPermAlert(); render(); return; }
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  item.phuongAn = value;
  if(value!=='Cắt thay'){
    // phương án Hàn phủ/Sửa ốp theo dõi bằng trạng thái thủ công, không dùng khung mối hàn w1/w2
    if(item.trangThai==='Hoàn thành' && !item.ngayHoanThanh) item.ngayHoanThanh = todayStr();
  } else {
    recomputeStatus(item);
  }
  await persist('sua-chua', state.suaChua, true);
  syncToSheet('sua_chua_item', item);
  render();
};

// Tải lại đúng dữ liệu Sửa chữa (SuaChuaHangMuc + SuaChua) ngay khi mở 1 hạng mục ra để xem/sửa — vì có
// thể nhiều người (4-5 người) đang cùng mở app xem trong lúc sửa chữa, tránh trường hợp anh đang thao tác
// trên bản dữ liệu cũ (do người khác vừa cập nhật mà máy mình chưa tự đồng bộ kịp).
async function refreshSuaChuaFromSheet(){
  try{
    const [itemRows, weldRows] = await Promise.all([fetchSheet('sua_chua_item'), fetchSheet('sua_chua_weld')]);
    if(!itemRows && !weldRows) return; // mất mạng — giữ nguyên dữ liệu đang có, không ghi đè bằng rỗng
    const fresh = mapSheetSuaChua(itemRows||[], weldRows||[]);
    if(fresh.length){ state.suaChua = fresh; await persist('sua-chua', state.suaChua, true); }
  }catch(e){ console.error('Không tải lại được dữ liệu Sửa chữa mới nhất:', e); }
}
window.toggleRepairExpand = async function(id){

};
window.addBienPhapWeld = async function(itemId){
  if(!can('hanCat')){ noPermAlert(); return; }
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  // Bat buoc nguoi tao dien "Vi tri thuc te moi han" (vd: cach mep bich 20cm, doan giua tang X-Y...) —
  // vi moi han bien phap la moi han phat sinh tuy tinh huong thi cong thuc te (khong co san nhu w1/w2),
  // neu khong ghi lai vi tri thi ve sau se khong biet moi han nay nam o dau tren doan ong.
  const viTriThucTe = prompt('Bắt buộc nhập Vị trí thực tế của mối hàn biện pháp này (VD: cách mép bích 20cm, giữa đoạn tầng 7-8...):');
  if(!viTriThucTe || !viTriThucTe.trim()){ alert('Chưa nhập vị trí thực tế — không thể tạo mối hàn biện pháp khi chưa xác định rõ vị trí.'); return; }
  const bpCount = item.welds.filter(w=>w.loai==='bien_phap').length;
  item.welds.push({id:itemId+'-wbp'+(bpCount+1), loai:'bien_phap', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:'', nguoiThucHien: state.session?state.session.name:'', nguoiXacNhanPAUT:'', viTriThucTe:viTriThucTe.trim()});
  if((item.phuongAn||'Cắt thay')==='Cắt thay') recomputeStatus(item);
  await persist('sua-chua', state.suaChua, true);
  syncToSheet('sua_chua_item', item);
  render();
};
window.removeWeld = async function(itemId, weldId){
  if(!can('hanCat')){ noPermAlert(); return; }
  const item = state.suaChua.find(s=>s.id===itemId); if(!item) return;
  const w = item.welds.find(x=>x.id===weldId);
  if(!w) return;
  if(w.loai==='chinh_thuc'){
    // Mối 1 (w1) luôn bắt buộc phải có — chỉ cho phép xóa mối 2 trở đi, dùng cho trường hợp 2 hạng mục
    // Cắt thay liền kề nhau dùng chung 1 mối hàn ranh giới thay vì mỗi bên tự có đủ 2 mối hàn riêng.
    if(weldId.endsWith('-w1')){
      alert('Không thể xóa mối hàn chính thức đầu tiên (mối 1) — hạng mục Cắt thay luôn phải có tối thiểu mối hàn này.');
      return;
    }
    const lyDo = prompt('Bắt buộc nhập lý do xóa mối hàn chính thức "'+weldId+'" (VD: đoạn ống liền kề dùng chung mối hàn với hạng mục bên cạnh):');
    if(!lyDo || !lyDo.trim()){ alert('Chưa nhập lý do — không thể xóa mối hàn chính thức khi chưa có lý do rõ ràng.'); return; }
    if(!confirm('Xác nhận xóa mối hàn chính thức "'+weldId+'"?\n\nLý do: '+lyDo.trim()+'\n\nHành động này sẽ được ghi lại vào lịch sử hạng mục, không thể hoàn tác.')) return;
    const stamp = '['+fmtDate(todayStr())+' · '+(state.session?state.session.name:'—')+'] Xóa '+weldId+' — Lý do: '+lyDo.trim();
    item.ghiChuXoaMoiHan = (item.ghiChuXoaMoiHan ? item.ghiChuXoaMoiHan+'\n' : '') + stamp;
  } else {
    // Moi han bien phap: khong bat buoc ly do, nhung van can xac nhan de tranh bam nham (thao tac khong
    // the hoan tac, mat luon du lieu Vi tri thuc te da ghi).
    if(!confirm('Xác nhận xóa mối hàn biện pháp "'+weldId+'"'+(w.viTriThucTe?(' (vị trí thực tế: '+w.viTriThucTe+')'):'')+'?\n\nHành động này không thể hoàn tác.')) return;
  }
  item.welds = item.welds.filter(x=>x.id!==weldId);
  if((item.phuongAn||'Cắt thay')==='Cắt thay') recomputeStatus(item);
  await persist('sua-chua', state.suaChua, true);
  syncToSheet('sua_chua_item', item);
  render();
};

  ]);
  if(delResults.some(ok=>!ok) && !state.suaChua.some(s=>s.id===itemId)){
    state.suaChua.push(item);
    await persist('sua-chua', state.suaChua, true);
    alert('Không xóa được trên Google Sheet (lỗi mạng/máy chủ) — hạng mục đã được khôi phục lại, chưa mất. Vui lòng thử xóa lại khi mạng ổn định.');
    render();
  }
};

// Xuat bao cao dep, theo tung Dot (1 sheet = 1 dot), dung de in/luu tru — thay cho ban bang du lieu tho truoc day
window.exportSuaChua = async function(){
  if(!(await withXLSXReady())) return;
  if(!state.suaChua.length){ alert('Chưa có hạng mục sửa chữa nào để xuất.'); return; }
  const NCOL = 16;
  const byDot = {};
  state.suaChua.forEach(item=>{ const k=item.dotId||'(chưa gán đợt)'; if(!byDot[k]) byDot[k]=[]; byDot[k].push(item); });
  const dotIds = Object.keys(byDot).sort((a,b)=>{
    const da=state.dots.find(x=>x.id===a), db=state.dots.find(x=>x.id===b);
    return (da?da.ten:a).localeCompare(db?db.ten:b);
  });
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  dotIds.forEach(dotId=>{
    const d = state.dots.find(x=>x.id===dotId);
    const items = byDot[dotId].slice().sort((a,b)=> (a.heThong||'').localeCompare(b.heThong||'') || String(a.id).localeCompare(String(b.id)));
    const aoa = []; const merges = [];
    aoa.push(['BIÊN BẢN SỬA CHỮA & HÀN ỐNG LÒ HƠI']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['NHIỆT ĐIỆN NGHI SƠN']); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Đợt kiểm tra/sửa chữa:', d?d.ten:dotId,'','','Tổ máy:', d?d.toMay:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push(['Thời gian:', (d&&d.ngayBatDau?fmtDate(d.ngayBatDau):'')+(d&&d.ngayKetThuc?(' đến '+fmtDate(d.ngayKetThuc)):' (đang diễn ra)'),'','','Trạng thái:', d?d.trangThai:'']);
    merges.push({s:{r:aoa.length-1,c:1},e:{r:aoa.length-1,c:3}}); merges.push({s:{r:aoa.length-1,c:5},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['STT','Hệ thống','Vị trí ống','Phương án','% còn lại','Trạng thái hạng mục','Ngày tạo','Ngày hoàn thành','Mã mối hàn','Loại','Đã cắt','Đã hàn','PAUT','Ngày hàn','Thợ hàn','Ghi chú']);
    let stt=1;
    items.forEach(item=>{
      const phuongAn = item.phuongAn || 'Cắt thay';
      if(phuongAn==='Cắt thay' && item.welds.length){
        item.welds.forEach(w=>{
          aoa.push([stt++, item.heThong, item.id, phuongAn, item.phanTramConLai, item.trangThai, fmtDate(item.ngayTao), fmtDate(item.ngayHoanThanh), w.id, w.loai==='chinh_thuc'?'Chính thức':'Biện pháp', w.daCat?'X':'', w.daHan?'X':'', w.paut, w.ngayHan, w.thoHan, w.ghiChu]);
        });
      } else {
        aoa.push([stt++, item.heThong, item.id, phuongAn, item.phanTramConLai, item.trangThai, fmtDate(item.ngayTao), fmtDate(item.ngayHoanThanh), '', '', '', '', '', '', '', '']);
      }
    });
    aoa.push([]);
    aoa.push(['Tổng số hạng mục: '+items.length]); merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:NCOL-1}});
    aoa.push([]);
    aoa.push(['Thợ hàn / KTV thực hiện (ký, ghi rõ họ tên)','','','','Người xác nhận PAUT (ký, ghi rõ họ tên)','','','','Xác nhận của đơn vị (ký, đóng dấu)']);
    { const rIdx = aoa.length-1;
      merges.push({s:{r:rIdx,c:0},e:{r:rIdx,c:3}});
      merges.push({s:{r:rIdx,c:4},e:{r:rIdx,c:7}});
      merges.push({s:{r:rIdx,c:8},e:{r:rIdx,c:NCOL-1}}); }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:5},{wch:14},{wch:26},{wch:11},{wch:10},{wch:16},{wch:12},{wch:12},{wch:14},{wch:11},{wch:8},{wch:8},{wch:12},{wch:11},{wch:12},{wch:20}];
    ws['!merges'] = merges;
    let name = scSafeSheetName(d?d.ten:dotId);
    if(usedNames[name]){ usedNames[name]++; name = scSafeSheetName(name+' ('+usedNames[name]+')'); } else { usedNames[name]=1; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb,'bien-ban-sua-chua-han.xlsx');
};

window.addVatTu = async function(){
  if(!can('vatTu')){ noPermAlert(); return; }
  const g=id=>document.getElementById(id).value.trim();
  const dotId = g('vt-dot');
  const dotObj = state.dots.find(d=>d.id===dotId);
  if(!dotObj){ alert('Vui lòng chọn Đợt.'); return; }
  const rec = {id:genId('VT'), dotId, toMay:dotObj.toMay,
    heThong:g('vt-hethong'), thietBi:g('vt-thietbi'), mucDich:g('vt-mucdich'), maVatTu:g('vt-ma'),
    tenVatTu:g('vt-ten'), donVi:g('vt-donvi'), soLuong:g('vt-soluong'), lyDoThayThe:g('vt-lydo'),
    ghiChu:g('vt-ghichu'), ngay:todayStr()};

window.importVatTu = function(input){

  const dotObj = state.dots.find(d=>d.id===state.vtSel.dotId);
  const reader=new FileReader();
  reader.onload=async e=>{
    if(!(await withXLSXReady())) return;
    const wb=XLSX.read(e.target.result,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let added=0;
    rows.forEach(r=>{
      const tenVatTu = String(r['Tên vật tư']||r['Ten vat tu']||'').trim();

        heThong:String(r['Hệ thống']||r['He thong']||''), thietBi:String(r['Thiết bị']||r['Thiet bi']||''),
        mucDich:String(r['Mục đích sử dụng']||r['Muc dich su dung']||''), maVatTu:String(r['Mã vật tư']||r['Ma vat tu']||''),

        lyDoThayThe:String(r['Lý do thay thế']||r['Ly do thay the']||''), ghiChu:String(r['Ghi chú']||r['Ghi chu']||''),
        ngay:String(r['Ngày']||r['Ngay']||todayStr())};
      state.vatTu.push(newRec);
      syncToSheet('vat_tu', newRec);

};

window.onNkPhotoSelect = function(input){
  if(!can('nhatKy')){ noPermAlert(); input.value=''; return; }
  const files = Array.from(input.files||[]);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxSide = 1280;
        let w = img.width, h = img.height;
        if(w>=h && w>maxSide){ h = Math.round(h*maxSide/w); w = maxSide; }
        else if(h>w && h>maxSide){ w = Math.round(w*maxSide/h); h = maxSide; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
        state.nkPendingPhotos.push({ tempId: 'tmp'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), dataUrl, tenAnh:'' });
        render();
      };
      img.onerror = function(){ alert('Không đọc được ảnh này, vui lòng thử lại.'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
};

window.deleteNhatKy = async function(id){

window.exportNhatKy = async function(){
  if(!(await withXLSXReady())) return;
  if(!state.nhatKy.length){ alert('Chưa có nhật ký thi công nào để xuất.'); return; }
  const sorted = state.nhatKy.slice().sort((a,b)=> String(a.dotId||'').localeCompare(String(b.dotId||'')) || (a.ngay||'').localeCompare(b.ngay||'') || String(a.id).localeCompare(String(b.id)));
  const trangSoMap = computeNkTrangSoMap();
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  sorted.forEach(n=>{
    const trangSo = trangSoMap[n.id]||'';
    const aoa = [
      ['NHẬT KÝ THI CÔNG', '', 'Trang số: '+trangSo],
      [],
      ['Tên hạng mục công trình:', n.tenHangMucCongTrinh||'', ''],
      ['Tên gói thầu:', n.tenGoiThau||'', ''],
      ['Tên đơn vị thi công:', n.donViThiCong||'', ''],
      ['Ngày thi công:', fmtDate(n.ngay), 'Ca: '+(n.ca||'')+'   Bắt đầu: '+(n.gioBatDau||'')+'   Kết thúc: '+(n.gioKetThuc||'')],
      [],
      ['Nội dung', 'Thực tế hiện trường (nhà thầu ghi)', 'Ý kiến của giám sát thi công/Chủ đầu tư'],
    ];
    NK_SECTIONS.forEach(s=>{ aoa.push([s.label, n[s.key]||'', n[s.key+'_yk']||'']); });
    aoa.push([]);
    aoa.push(['Đại diện các bên xác nhận (ký và ghi rõ họ tên):', 'Kỹ thuật B: '+(n.kyThuatB||''), 'Cán bộ giám sát: '+(n.canBoGiamSat||'')]);
    aoa.push(['Trạng thái: '+(n.trangThai||''), 'Người tạo: '+(n.nguoiTao||''), 'Người duyệt: '+(n.nguoiDuyet||'')]);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:38},{wch:48},{wch:48}];
    ws['!merges'] = [
      {s:{r:0,c:0}, e:{r:0,c:1}},
      {s:{r:2,c:1}, e:{r:2,c:2}},
      {s:{r:3,c:1}, e:{r:3,c:2}},
      {s:{r:4,c:1}, e:{r:4,c:2}}
    ];
    let name = nkSafeSheetName('Trang '+(trangSo||'?')+' - '+n.ngay);
    if(usedNames[name]){ usedNames[name]++; name = nkSafeSheetName(name+' ('+usedNames[name]+')'); } else { usedNames[name]=1; }
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb,'nhat-ky-thi-cong.xlsx');
};
// Xuat dang bang du lieu tho (1 dong = 1 nhat ky) — dung lam file mau de Nhap Excel lai, khac voi ban Xuat Excel o tren (dung de in/nop bao cao theo dung mau giay)
window.exportNhatKyTemplate = async function(){
  if(!(await withXLSXReady())) return;
  const sorted = state.nhatKy.slice().sort((a,b)=> String(a.dotId||'').localeCompare(String(b.dotId||'')) || (a.ngay||'').localeCompare(b.ngay||'') || String(a.id).localeCompare(String(b.id)));
  const trangSoMap = computeNkTrangSoMap();
  const rows = sorted.map(n=>{
    const dotObj = state.dots.find(d=>d.id===n.dotId);
    const row = {
      'Mã nhật ký': n.id, 'Trang số': trangSoMap[n.id]||'', 'Ngày thi công': n.ngay, 'Ca': n.ca,
      'Giờ bắt đầu': n.gioBatDau, 'Giờ kết thúc': n.gioKetThuc,
      'Tên hạng mục công trình': n.tenHangMucCongTrinh, 'Tên gói thầu': n.tenGoiThau, 'Đơn vị thi công': n.donViThiCong,
      'Đợt': dotObj?dotObj.ten:n.dotId, 'Tổ máy': n.toMay, 'Hệ thống': n.heThong, 'Mã hạng mục liên quan': n.hangMucId
    };
    NK_SECTIONS.forEach(s=>{
      const cols = NK_SHEET_KEY_MAP[s.key];
      row[cols[0]] = n[s.key];
      row[cols[1]] = n[s.key+'_yk'];
    });
    row['Kỹ thuật B'] = n.kyThuatB;
    row['Cán bộ giám sát'] = n.canBoGiamSat;
    row['Trạng thái'] = n.trangThai;
    row['Người tạo'] = n.nguoiTao;
    row['Người duyệt'] = n.nguoiDuyet;
    row['Thời gian duyệt'] = n.thoiGianDuyet;
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'NhatKyThiCong'); XLSX.writeFile(wb,'nhat-ky-thi-cong-du-lieu-tho.xlsx');
};
window.importNhatKy = function(input){
  if(!can('nhatKy')){ noPermAlert(); input.value=''; return; }
  const file=input.files[0]; if(!file) return;
  const dotSel = document.getElementById('nk-dot');
  const dotId = dotSel ? dotSel.value : '';
  if(!dotId){ alert('Vui lòng mở biểu mẫu "+ Thêm nhật ký" và chọn Đợt trước khi nhập Excel — toàn bộ nhật ký trong file sẽ được gắn vào đợt đó (Tên hạng mục công trình/Gói thầu/Đơn vị thi công cũng lấy tự động từ đợt này).'); input.value=''; return; }
  const dotObj = state.dots.find(d=>d.id===dotId);
  const reader = new FileReader();
  reader.onload = async e=>{
    if(!(await withXLSXReady())) return;
    const wb = XLSX.read(e.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let added=0, skipped=0;
    rows.forEach(r=>{
      const ngay = String(r['Ngày thi công']||'').trim();
      if(!ngay){ skipped++; return; }
      const trangThaiIn = String(r['Trạng thái']||'').trim();
      const rec = {
        id:genId('NK'), ngay, ca:String(r['Ca']||''),
        gioBatDau:String(r['Giờ bắt đầu']||''), gioKetThuc:String(r['Giờ kết thúc']||''),
        tenHangMucCongTrinh: dotObj.tenHangMucCongTrinh||'', tenGoiThau: dotObj.tenGoiThau||'', donViThiCong: dotObj.donViThiCong||'',
        dotId: dotObj.id, toMay: dotObj.toMay, heThong: String(r['Hệ thống']||''), hangMucId:'',
        kyThuatB:String(r['Kỹ thuật B']||''), canBoGiamSat:String(r['Cán bộ giám sát']||''),
        trangThai: trangThaiIn==='Đã duyệt' ? 'Đã duyệt' : 'Chờ duyệt',
        nguoiTao: state.session?state.session.name:'', nguoiDuyet:String(r['Người duyệt']||''), thoiGianDuyet:String(r['Thời gian duyệt']||'')
      };
      NK_SECTIONS.forEach(s=>{
        const cols = NK_SHEET_KEY_MAP[s.key];
        rec[s.key] = String(r[cols[0]]||'');
        rec[s.key+'_yk'] = String(r[cols[1]]||'');
      });
      state.nhatKy.unshift(rec);
      syncToSheet('nhat_ky', rec);
      added++;
    });
    await persist('nhat-ky', state.nhatKy, true);
    alert('Đã nhập '+added+' nhật ký vào đợt "'+dotObj.ten+'". Bỏ qua '+skipped+' dòng thiếu Ngày thi công. Ảnh đính kèm không hỗ trợ nhập qua Excel — cần thêm trực tiếp trong app.');
    input.value=''; render();
  };
  reader.readAsArrayBuffer(file);
};

function computeNkTrangSoMap(){
  const sorted = state.nhatKy.slice().sort((a,b)=> String(a.dotId||'').localeCompare(String(b.dotId||'')) || (a.ngay||'').localeCompare(b.ngay||'') || String(a.id).localeCompare(String(b.id)));
  const counters = {}, map = {};
  sorted.forEach(n=>{ counters[n.dotId] = (counters[n.dotId]||0)+1; map[n.id] = counters[n.dotId]; });
  return map;
}

function buildNkWizardSteps(){
  const steps = [];
  steps.push({key:'dotId', label:'Đợt', kind:'choice', confirm:false,
    prompt:'Đọc tên đợt.',
    getOptions:()=> state.dots.map(d=>({value:d.id, label:d.ten}))});
  steps.push({key:'ca', label:'Ca làm việc', kind:'text', confirm:false, optional:true,
    prompt:'Đọc ca làm việc, ví dụ Ca 1. Hoặc nói "bỏ qua".'});
  NK_SECTIONS.forEach(s=>{
    steps.push({key:s.key, label:s.label, kind:'text', confirm:false, optional:true,
      prompt: s.label+'. Nói "bỏ qua" nếu hôm nay không có nội dung mục này.'});
  });
  steps.push({kind:'resolve', compute: async (data)=>{
    const dotObj = state.dots.find(d=>d.id===data.dotId);
    if(!dotObj) return {ok:false, fatal:true, message:'Chưa xác định được Đợt, không thể lưu nhật ký này.'};
    const rec = {
      id:genId('NK'), ngay:todayStr(), ca:data.ca||'', gioBatDau:'', gioKetThuc:'',
      tenHangMucCongTrinh: dotObj.tenHangMucCongTrinh||'', tenGoiThau: dotObj.tenGoiThau||'', donViThiCong: dotObj.donViThiCong||'',
      dotId: dotObj.id, toMay: dotObj.toMay, heThong:'', hangMucId:'',
      kyThuatB: state.session?state.session.name:'', canBoGiamSat:'', trangThai:'Chờ duyệt',
      nguoiTao: state.session?state.session.name:'', nguoiDuyet:'', thoiGianDuyet:''
    };
    NK_SECTIONS.forEach(s=>{ rec[s.key]=data[s.key]||''; rec[s.key+'_yk']=''; });
    state.nhatKy.unshift(rec);
    await persist('nhat-ky', state.nhatKy, true);
    syncToSheet('nhat_ky', rec);
    render();
    return {ok:true, message:'Đã lưu nhật ký thi công, đang chờ giám sát duyệt. Vào mục Nhật ký để bổ sung ảnh nếu cần.'};
  }});
  return steps;
}

function computeDotStats(dotId){
  const kt = state.kiemTra.filter(k=>k.dotId===dotId);
  const uniquePipes = uniq(kt.map(k=>pipeKeyOf(k))).length;
  // moi ong chi lay lan do MOI NHAT (theo ngay) de hien thi chi tiet - khop dung so luong voi uniquePipes o tren
  const latestByPipe = {};
  kt.slice().sort((a,b)=>(a.ngay||'').localeCompare(b.ngay||'')).forEach(k=>{ latestByPipe[pipeKeyOf(k)] = k; });
  const pipeRows = Object.values(latestByPipe).sort((a,b)=> (a.heThong||'').localeCompare(b.heThong||'') || (a.viTri||'').localeCompare(b.viTri||''));
  const sc = state.suaChua.filter(s=>s.dotId===dotId);
  const catThay = sc.filter(s=>(s.phuongAn||'Cắt thay')==='Cắt thay');
  const hanPhu = sc.filter(s=>s.phuongAn==='Hàn phủ');
  const suaOp = sc.filter(s=>s.phuongAn==='Sửa ốp');
  let weldDone=0, weldTotal=0;
  const weldRows = [];
  catThay.forEach(item=>{ item.welds.forEach(w=>{ weldTotal++; if(w.daHan && w.paut==='Đạt') weldDone++; weldRows.push({item, weld:w}); }); });
  const vt = state.vatTu.filter(v=>v.dotId===dotId);
  const vtTotals = {};
  vt.forEach(r=>{ const k=r.tenVatTu+'||'+r.donVi; vtTotals[k]=(vtTotals[k]||0)+(parseFloat(r.soLuong)||0); });
  const nTotal = sc.length, nDone = sc.filter(s=>s.trangThai==='Hoàn thành').length;
  const dot = state.dots.find(d=>d.id===dotId);
  let duKien = null;
  if(dot){
    const days = (Date.now() - new Date(dot.ngayBatDau+'T00:00:00').getTime())/(1000*60*60*24);
    if(nTotal>0 && nDone>0 && days>0){
      if(nDone>=nTotal) duKien = {done:true};
      else { const speed = nDone/days; const daysLeft=(nTotal-nDone)/speed; duKien = {date:new Date(Date.now()+daysLeft*24*60*60*1000)}; }
    }
  }
  return {uniquePipes, catThay:catThay.length, hanPhu:hanPhu.length, suaOp:suaOp.length,
    catThayDone:catThay.filter(s=>s.trangThai==='Hoàn thành').length,
    hanPhuDone:hanPhu.filter(s=>s.trangThai==='Hoàn thành').length,
    suaOpDone:suaOp.filter(s=>s.trangThai==='Hoàn thành').length,
    weldDone, weldTotal, vtTotals, nTotal, nDone, duKien,
    pipeRows, catThayItems:catThay, hanPhuItems:hanPhu, suaOpItems:suaOp, weldRows};
}

    inner = items.length ? items.map(it=>`<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${esc(it.id)}</span>${esc(it.heThong)} <span style="color:var(--muted);font-weight:400;">· vị trí ${esc(it.viTri)}/${esc(it.lopOng)}</span></div><span class="status ${st(it)}">${esc(it.trangThai)}</span></div>
      <div class="record-meta"><span>${esc(it.phanTramConLai)}% còn lại</span><span>Tạo: ${fmtDate(it.ngayTao)}</span><span>${it.ngayHoanThanh?('Hoàn thành: '+fmtDate(it.ngayHoanThanh)):'Chưa hoàn thành'}</span></div></div>`).join('')
      : '<div class="empty">Chưa có hạng mục nào thuộc loại này trong đợt.</div>';
  } else if(metric==='welds'){
    inner = s.weldRows.length ? s.weldRows.map(r=>`<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${esc(r.weld.id)}</span>${r.weld.loai==='chinh_thuc'?'Chính thức':'Biện pháp'} <span style="color:var(--muted);font-weight:400;">· thuộc ${esc(r.item.id)}</span></div><span class="status ${(r.weld.daHan&&r.weld.paut==='Đạt')?'good':'warn'}">${esc(r.weld.paut)}</span></div>
      <div class="record-meta"><span>Đã cắt: ${r.weld.daCat?'✓':'—'}</span><span>Đã hàn: ${r.weld.daHan?'✓':'—'}</span><span>Thợ hàn: ${esc(r.weld.thoHan||'—')}</span></div></div>`).join('')
      : '<div class="empty">Chưa có mối hàn nào (chỉ tính hạng mục Cắt thay).</div>';
  }
  return `<div style="margin:0 0 14px;">${inner}</div>`;
}
function renderDotDashboard(dotId){
  const dot = state.dots.find(d=>d.id===dotId); if(!dot) return '';
  const s = computeDotStats(dotId);
  const vtRows = Object.keys(s.vtTotals).map(k=>{ const [ten,dv]=k.split('||'); return `<tr><td>${esc(ten)}</td><td>${s.vtTotals[k]}</td><td>${esc(dv)}</td></tr>`; }).join('');
  let duKienText = 'Chưa đủ dữ liệu để ước tính (cần ít nhất 1 hạng mục sửa chữa đã hoàn thành).';

/* ---------- Tra cứu 1 đoạn ống bất kỳ (mọi đợt, đang sửa hoặc đã sửa trong lịch sử) ---------- */
// Tach tu khoa tim kiem thanh: cac so (de nhan dien Vi tri / Vi tri-Lop ong) va cac tu chu (de so khop
// Ho thong/Thiet bi/To may) — khong doi hoi go dung thu tu hay du cau truc, khong bat buoc dinh dang phan cach
// co dinh (dau -, /, phay, khoang trang hay noi day du "vi tri X lop Y" deu ra cung 1 ket qua vi chi lay CAC SO).
function parseOvQuery(query){
  // Tach theo dau phan cach TRUOC (khoang trang, -, /, ,...) roi moi phan loai TUNG TOKEN NGUYEN VEN:
  // token toan chu so (VD "84","12") -> coi la so (Vi tri/Lop ong); token con lai (chu, hoac lan chu+so
  // nhu "7s") -> coi la tu de so khop van ban. Tranh loi cu: tach so ngay ben trong token lan nhu "7s" ->
  // "7" (rung mat chu "s"), khien "tang 7s" bi hieu nham thanh tim Vi tri=7 thay vi tim theo ten thiet bi.
  const norm = normalizeVN(query);
  const tokens = norm.split(/[^a-z0-9]+/).filter(t=>t.length>0);
  const stop = new Set(['vi','tri','lop','ong','vt','lo']);
  const nums = [], words = [];
  tokens.forEach(t=>{
    if(stop.has(t)) return;
    if(/^\d+$/.test(t)) nums.push(t);
    else if(t.length>1) words.push(t);
  });
  return {nums, words};
}
function ovSearchResults(query){
  const {nums, words} = parseOvQuery(query);
  if(!nums.length && !words.length) return [];
  const map = pipeHistoryMap();
  return Object.keys(map).filter(key=>{
    const r = map[key][map[key].length-1];
    // co 2 so tro len (bat ke go "12-1", "12/1", "12,1", "12 1" hay noi day du "vi tri 12 lop 1")
    // -> hieu la Vi tri-Lop ong, so khop CHINH XAC ca 2 so nay tren MOI he thong/thiet bi (tra ve toan bo ket qua trung)
    if(nums.length>=2){
      if(parseInt(r.viTri,10)!==parseInt(nums[0],10) || parseInt(r.lopOng,10)!==parseInt(nums[1],10)) return false;
    } else if(nums.length===1){
      // 1 so don le -> mac dinh hieu la Vi tri
      if(parseInt(r.viTri,10)!==parseInt(nums[0],10)) return false;
    }
    if(words.length){
      const fields = [r.toMay, r.heThong, r.thietBi].map(v=>normalizeVN(v||''));
      const allWordsMatch = words.every(w=> fields.some(f=>f.includes(w)));
      if(!allWordsMatch) return false;
    }
    return true;
  }).map(key=>{
    const hist = map[key];
    const latest = hist[hist.length-1];
    const activeItem = state.suaChua.find(s=>s.pipeKey===key && s.trangThai!=='Hoàn thành');
    const completedItems = state.suaChua.filter(s=>s.pipeKey===key && s.trangThai==='Hoàn thành').sort((a,b)=>(b.ngayHoanThanh||'').localeCompare(a.ngayHoanThanh||''));
    return {key, latest, activeItem, completedItems};
  }).sort((a,b)=> parseFloat(a.latest.phanTramConLai)-parseFloat(b.latest.phanTramConLai));
}

function renderOvSearch(){
  const q = state.ovSearchQuery||'';
  const hasQuery = q.trim()!=='';
  const results = hasQuery ? ovSearchResults(q) : [];
  const resultsHtml = results.map(r=>{
    const expanded = state.ovSearchExpandedKey===r.key;
    const p = parseFloat(r.latest.phanTramConLai);
    const pCls = p<=70?'danger':(p<=85?'warn':'good');
    let statusBadge, statusCls;
    if(r.activeItem){ statusBadge='Đang sửa chữa · '+r.activeItem.trangThai; statusCls='warn'; }
    else if(r.completedItems.length){ statusBadge='Đã sửa chữa ('+r.completedItems.length+' lần)'; statusCls='good'; }
    else { statusBadge='Chưa cần sửa chữa'; statusCls=pCls; }
    const label = (r.latest.toMay?r.latest.toMay+' · ':'')+r.latest.heThong+(r.latest.thietBi?(' - '+r.latest.thietBi):'')+' · vị trí '+r.latest.viTri+'/'+r.latest.lopOng;
    const safeKey = r.key.replace(/'/g,"\\'");
    let detail = '';
    if(expanded){
      if(r.activeItem){
        detail = renderSuaChuaItemCard(r.activeItem);
      } else if(r.completedItems.length){
        detail = r.completedItems.map(it=>`<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${esc(it.id)}</span>Chu kỳ ${esc(it.chuKy)}</div><span class="status good">${esc(it.trangThai)}</span></div>

      } else {
        detail = `<div class="settings-note">Chưa có hạng mục sửa chữa nào cho vị trí này (hệ thống chỉ tự tạo khi kết quả kiểm tra ≤ 70%). Lần đo gần nhất: ${esc(r.latest.chieuDayDo)}mm ngày ${fmtDate(r.latest.ngay)}, người kiểm tra: ${esc(r.latest.nguoiKiemTra||'—')}.</div>`;
      }
    }
    return `<div class="repair-item" style="margin-bottom:10px;">
      <div class="repair-head" onclick="toggleOvSearchExpand('${safeKey}')">
        <div><b>${esc(label)}</b> <span class="progress-mini">· ${esc(r.latest.phanTramConLai)}% còn lại</span></div>
        <span class="status ${statusCls}">${esc(statusBadge)}</span>
      </div>
      ${expanded ? `<div style="margin-top:10px;" onclick="event.stopPropagation()">${detail}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="form-panel" style="padding:14px 16px;margin-bottom:18px;">
    <div class="field" style="margin-bottom:0;"><label>Tra cứu 1 đoạn ống (đang sửa hoặc đã sửa trong lịch sử) — gõ từ khóa bất kỳ, không cần đủ cấu trúc: chỉ tên hệ thống, chỉ số vị trí, hoặc "vị trí-lớp ống" (VD: 12-1)</label>
      <div style="display:flex;gap:6px;align-items:center;">
        <input id="ov-search-input" placeholder="VD: hơi chính, hoặc 12, hoặc 12-1" value="${esc(q)}" onkeydown="if(event.key==='Enter') runOvSearch()" style="flex:1;">
        ${voiceMicBtnHtml('voiceSearchOvPipe(this)','Nói để tra cứu đoạn ống')}
        <button class="btn" style="flex:none;" onclick="runOvSearch()">Tìm kiếm</button>
      </div>
    </div>
    ${hasQuery ? `<div style="margin-top:14px;">${resultsHtml || '<div class="empty">Không tìm thấy đoạn ống nào khớp.</div>'}</div>` : ''}
  </div>`;
}

// So do truc quan Kiem tra — TU SINH tu Danh muc ky thuat (de biet dai Vi tri thuc te ton tai) + Kiem tra
// (de lay so lieu do moi nhat), khong can ban ve/anh ngoai — moi He thong 1 khu, moi Thiet bi 1 hang, moi
// Vi tri 1 o vuong to mau theo % con lai THAP NHAT trong cac Lop ong cua vi tri do (lay gia tri xau nhat
// lam dai dien, dung nguyen tac giong bao dong % con lai o cac noi khac trong app).
function ktDiagramVtSet(heThong, thietBi, toMay){
  const ranges = state.danhMuc.filter(r=>r.heThong===heThong && r.thietBi===thietBi && (isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)));
  const set = new Set();
  ranges.forEach(r=>{
    const from = parseInt(r.viTriTu)||1, to = parseInt(r.viTriDen)||from;
    for(let v=from; v<=to; v++) set.add(String(v));
  });
  return Array.from(set).sort((a,b)=>parseInt(a)-parseInt(b));
}
function ktDiagramCellInfo(heThong, thietBi, toMay, vt){
  const recs = state.kiemTra.filter(r=>r.heThong===heThong && r.thietBi===thietBi && String(r.viTri)===String(vt) && (isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)));
  if(!recs.length) return null;
  const byLop = {};
  recs.forEach(r=>{ if(!byLop[r.lopOng] || r.ngay > byLop[r.lopOng].ngay) byLop[r.lopOng] = r; });
  const latestRecs = Object.values(byLop);
  const worst = latestRecs.reduce((min,r)=>Math.min(min, parseFloat(r.phanTramConLai)), Infinity);
  return {pct: worst.toFixed(1), lopCount: latestRecs.length, recs: latestRecs};
}
function renderKtDiagram(){
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj ? dotObj.toMay : '';
  const heThongOpts = uniq(state.danhMuc.filter(r=>isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)).map(r=>r.heThong)).sort((a,b)=>a.localeCompare(b));
  if(!heThongOpts.length){
    return `<div class="form-panel"><div class="settings-note" style="margin-top:0;">Chưa có Danh mục kỹ thuật cho tổ máy đang chọn để vẽ sơ đồ.</div></div>`;
  }
  if(!state.ktDiagramHeThong || !heThongOpts.includes(state.ktDiagramHeThong)) state.ktDiagramHeThong = heThongOpts[0];
  const selHt = state.ktDiagramHeThong;
  const thietBiOpts = uniq(state.danhMuc.filter(r=>(isSharedToMay(r.toMay)||normTM(r.toMay)===normTM(toMay)) && r.heThong===selHt).map(r=>r.thietBi)).sort((a,b)=>a.localeCompare(b));

  const rowsHtml = thietBiOpts.map(tb=>{
    const vtList = ktDiagramVtSet(selHt, tb, toMay);
    if(!vtList.length) return '';
    const cellsHtml = vtList.map(vt=>{
      const info = ktDiagramCellInfo(selHt, tb, toMay, vt);
      const cls = info ? (parseFloat(info.pct)<=70?'danger':(parseFloat(info.pct)<=85?'warn':'good')) : 'na';
      const safeHt2 = selHt.replace(/'/g,"\\'"), safeTb2 = (tb||'').replace(/'/g,"\\'");
      const title = info ? ('Vị trí '+vt+': '+info.pct+'% còn lại'+(info.lopCount>1?(' ('+info.lopCount+' lớp ống)'):'')) : ('Vị trí '+vt+': chưa có dữ liệu đo');
      return `<div class="diagram-cell ${cls}" title="${esc(title)}" onclick="ktDiagramShowDetail('${esc(safeHt2)}','${esc(safeTb2)}','${esc(vt)}')">${esc(vt)}</div>`;
    }).join('');
    return `<div class="diagram-row"><div class="diagram-row-label">${esc(tb)||'(không có thiết bị)'}</div><div class="diagram-row-cells">${cellsHtml}</div></div>`;
  }).join('');

  const htSelectOpts = heThongOpts.map(h=>`<option value="${esc(h)}" ${h===selHt?'selected':''}>${esc(h)}</option>`).join('');
  return `<div class="form-panel">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
      <label style="font-size:12.5px;color:var(--dim);">Hệ thống:</label>
      <select onchange="ktDiagramSetHeThong(this.value)" style="background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12.5px;">${htSelectOpts}</select>
      <div style="margin-left:auto;font-size:10.5px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;">
        <span><span class="diagram-cell good" style="display:inline-flex;width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>&gt;85%</span>
        <span><span class="diagram-cell warn" style="display:inline-flex;width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>70-85%</span>
        <span><span class="diagram-cell danger" style="display:inline-flex;width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>≤70%</span>
        <span><span class="diagram-cell na" style="display:inline-flex;width:14px;height:14px;margin-right:4px;vertical-align:middle;"></span>Chưa đo</span>
      </div>
    </div>
    ${rowsHtml || '<div class="empty">Hệ thống này chưa khai báo dải Vị trí trong Danh mục kỹ thuật.</div>'}
    <div class="settings-note" style="margin-top:14px;">Sơ đồ mang tính biểu diễn (theo số thứ tự Vị trí khai báo trong Danh mục kỹ thuật), chưa đúng vị trí/hình dáng thật ngoài hiện trường. Bấm vào 1 ô để xem chi tiết số liệu.</div>
  </div>`;
}

window.ktDiagramShowDetail = function(heThong, thietBi, vt){
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj ? dotObj.toMay : '';
  const info = ktDiagramCellInfo(heThong, thietBi, toMay, vt);
  if(!info){ alert(heThong+' - '+thietBi+' - Vị trí '+vt+': chưa có dữ liệu đo.'); return; }
  const lines = info.recs.slice().sort((a,b)=>String(a.lopOng).localeCompare(String(b.lopOng),'vi',{numeric:true}))
    .map(r=>'• Lớp '+r.lopOng+': '+r.chieuDayDo+'mm / '+r.chieuDayTK+'mm thiết kế ('+r.phanTramConLai+'% còn lại) — đo '+fmtDate(r.ngay)+(r.ngoaiDang&&r.ngoaiDang!=='Bình thường'?(' — Ngoại dạng: '+r.ngoaiDang):'')).join('\n');
  alert(heThong+' - '+thietBi+' - Vị trí '+vt+':\n\n'+lines);
};

// Xoa hang loat cac ban ghi Kiem tra da tick chon (vd don sach du lieu test truoc khi nhap du lieu that) —
// dung lai endpoint delete_batch (deleteManyFromSheet) da xay cho truong hop xoa ca Dot, xoa 1 lan duy nhat
// thay vi tung dong mot. Neu that bai thi khoi phuc lai toan bo cho local, tranh mat "ao" nhu cac loi da gap.
window.deleteSelectedKiemTra = async function(){
  if(!can('kiemTra')){ noPermAlert(); return; }
  const ids = Object.keys(state.ktSelectedIds);
  if(!ids.length){ alert('Chưa chọn dòng nào — tích vào ô vuông ở đầu mỗi bản ghi (trong từng nhóm Hệ thống đã mở rộng) để chọn.'); return; }
  if(!confirm('Xóa '+ids.length+' bản ghi Kiểm tra đã chọn? Sẽ xóa cả trên Google Sheet. Chỉ nên dùng khi xóa dữ liệu tạo lỗi/trùng lặp/dữ liệu test, vì dữ liệu đo đạc dùng để tính xu hướng mòn ống.')) return;
  const idSet = new Set(ids);
  const removedRecs = state.kiemTra.filter(r=>idSet.has(r.id));
  state.kiemTra = state.kiemTra.filter(r=>!idSet.has(r.id));
  state.ktSelectedIds = {};
  await persist('kiem-tra', state.kiemTra, true);
  render();
  const ok = await deleteManyFromSheet('KiemTra', ids);
  if(!ok){
    state.kiemTra = state.kiemTra.concat(removedRecs);
    await persist('kiem-tra', state.kiemTra, true);
    alert('Không xóa được trên Google Sheet (lỗi mạng/máy chủ) — toàn bộ '+ids.length+' bản ghi đã được khôi phục lại, chưa mất. Vui lòng thử xóa lại khi mạng ổn định.');
    render();
  } else {
    await syncSuaChua();
    render();
  }
};

/* ---------- LỊCH SỬ & XU HƯỚNG ---------- */
function pipeHistoryMap(){
  const map = {};
  state.kiemTra.forEach(k=>{
    const key = pipeKeyOf(k);
    if(!map[key]) map[key]=[];
    map[key].push(k);
  });
  Object.values(map).forEach(arr=>arr.sort((a,b)=>a.ngay.localeCompare(b.ngay)));
  return map;
}
function computeTrend(history){
  if(history.length<2) return null;
  const t0 = new Date(history[0].ngay).getTime();
  const xs = history.map(h=>(new Date(h.ngay).getTime()-t0)/(1000*60*60*24*365));
  const ys = history.map(h=>parseFloat(h.chieuDayDo));
  const n=xs.length, sumX=xs.reduce((a,b)=>a+b,0), sumY=ys.reduce((a,b)=>a+b,0);
  const sumXY=xs.reduce((a,x,i)=>a+x*ys[i],0), sumXX=xs.reduce((a,x)=>a+x*x,0);
  const denom=(n*sumXX-sumX*sumX);
  if(denom===0) return null;
  const slope=(n*sumXY-sumX*sumY)/denom, intercept=(sumY-slope*sumX)/n;
  return {slope, intercept, t0, lastX:xs[xs.length-1]};
}
function projectRepairDate(trend, chieuDayTK){
  if(!trend || trend.slope>=-0.0001) return null;
  const nguong = chieuDayTK*0.7;
  const xTarget = (nguong - trend.intercept)/trend.slope;
  if(xTarget <= trend.lastX) return {overdue:true};
  const ms = trend.t0 + xTarget*365*24*60*60*1000;
  return {overdue:false, date:new Date(ms)};
}
function historySvg(history, chieuDayTK){
  const w=620,h=130,pad=30;
  const vals = history.map(h=>parseFloat(h.chieuDayDo));
  const dates = history.map(h=>new Date(h.ngay).getTime());
  const minV = Math.min(...vals, chieuDayTK*0.7)*0.93;
  const maxV = Math.max(...vals, chieuDayTK)*1.05;
  const minD = Math.min(...dates), maxD = Math.max(...dates);
  const xScale = d => dates.length>1 ? pad+(d-minD)/((maxD-minD)||1)*(w-2*pad) : w/2;
  const yScale = v => h-pad-(v-minV)/((maxV-minV)||1)*(h-2*pad);
  const pts = history.map((hh,i)=>xScale(dates[i])+','+yScale(vals[i])).join(' ');
  const thresholdY = yScale(chieuDayTK*0.7);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:620px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;">
    <line x1="${pad}" y1="${thresholdY.toFixed(1)}" x2="${w-pad}" y2="${thresholdY.toFixed(1)}" stroke="#e2564f" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${w-pad}" y="${(thresholdY-5).toFixed(1)}" text-anchor="end" font-size="9" fill="#e2564f" font-family="monospace">ngưỡng 70%</text>
    <polyline points="${pts}" fill="none" stroke="#4f8fe0" stroke-width="2"/>
    ${history.map((hh,i)=>`<circle cx="${xScale(dates[i]).toFixed(1)}" cy="${yScale(vals[i]).toFixed(1)}" r="3" fill="#4f8fe0"/>`).join('')}
  </svg>`;
}
