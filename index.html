let _historyCache = null, _historyCacheVersion = -1;
function computeHistorySummaries(){
  const map = pipeHistoryMap();
  const keys = Object.keys(map);
  const summaries = keys.map(key=>{
    const fullHist = map[key];
    const completedCycles = state.suaChua.filter(s=>s.pipeKey===key && s.trangThai==='Hoàn thành').sort((a,b)=>a.chuKy-b.chuKy);
    // chia lịch sử đo thành các chu kỳ, ranh giới là ngày hoàn thành thay ống của từng đợt sửa chữa trước đó
    let prevBoundary = null, oldSegments = [];
    completedCycles.forEach(c=>{
      const seg = fullHist.filter(h=> (prevBoundary? h.ngay>prevBoundary : true) && h.ngay<=c.ngayHoanThanh);
      oldSegments.push({records:seg, ngayHoanThanh:c.ngayHoanThanh, chuKy:c.chuKy});
      prevBoundary = c.ngayHoanThanh;
    });
    const currentHist = fullHist.filter(h=> prevBoundary? h.ngay>prevBoundary : true);
    const last = currentHist.length ? currentHist[currentHist.length-1] : fullHist[fullHist.length-1];
    const chieuDayTK = parseFloat(last.chieuDayTK);
    const trend = currentHist.length>=2 ? computeTrend(currentHist) : null;
    const projection = projectRepairDate(trend, chieuDayTK);
    const rateMmYear = trend ? -trend.slope : null;
    return {key, currentHist, oldSegments, last, trend, projection, rateMmYear, currentChuKy:(completedCycles.length+1)};
  });
  summaries.sort((a,b)=>{
    const da = a.projection && !a.projection.overdue ? a.projection.date.getTime() : (a.projection && a.projection.overdue ? -Infinity : Infinity);
    const db = b.projection && !b.projection.overdue ? b.projection.date.getTime() : (b.projection && b.projection.overdue ? -Infinity : Infinity);
    return da-db;
  });
  return summaries;
}

function renderHistory(){
  if(_historyCacheVersion !== _dataVersion){
    _historyCache = computeHistorySummaries();
    _historyCacheVersion = _dataVersion;
  }
  const summaries = _historyCache;
  const completedRepairs = state.suaChua.filter(s=>{ const d = state.dots.find(x=>x.id===s.dotId); return d && d.trangThai==='Đã hoàn thành'; }).sort((a,b)=>(b.ngayHoanThanh||'').localeCompare(a.ngayHoanThanh||''));
  const repairHistCards = completedRepairs.map(item=>`<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${esc(item.id)}</span>${esc(item.heThong)} - ${esc(item.thietBi)} - ${esc(item.viTri)}-${esc(item.lopOng)}</div><span class="status good">${esc(item.trangThai)}${item.ngayHoanThanh?(' '+fmtDate(item.ngayHoanThanh)):''}</span></div>
    <div class="record-meta"><span>${(item.phuongAn||'Cắt thay')}</span><span>${item.welds.filter(w=>w.loai==='chinh_thuc').length} mối hàn chính thức</span><span>${item.welds.filter(w=>w.loai==='bien_phap').length} mối hàn biện pháp</span></div></div>`).join('');
  const footer = `<div class="section-label">Sửa chữa đã hoàn thành (đã chuyển vào lịch sử)</div>
  ${repairHistCards || '<div class="empty">Chưa có hạng mục sửa chữa nào hoàn thành.</div>'}`;
  const head = `<div class="page-head"><div><div class="page-eyebrow">Tra cứu · So sánh · Lập kế hoạch</div><div class="page-title">Lịch sử &amp; xu hướng mòn ống</div></div></div>
  <div class="form-panel" style="padding:12px 16px;max-width:420px;margin-bottom:14px;"><div class="field"><label>Tra cứu nhanh vị trí ống (giọng nói)</label><div style="display:flex;gap:6px;align-items:center;">${voiceMicBtnHtml('voiceSearchLsPipe(this)','Nói hệ thống/vị trí ống cần tra cứu')}<span style="font-size:11.5px;color:var(--dim);">Bấm mic rồi nói VD: "Hệ thống hơi chính vị trí 12"</span></div></div></div>
  <div class="settings-note" style="margin-bottom:16px;">Chọn Năm → Đợt sửa chữa → Hệ thống → Đối tượng (ống) để xem chi tiết lịch sử/xu hướng mòn của từng vị trí. Mỗi vị trí ống được tính <b>tốc độ mòn (mm/năm)</b> chỉ dựa trên các lần đo trong <b>chu kỳ hiện tại</b> — kể từ lần thay ống gần nhất (nếu có).</div>`;

  if(state.lsYear && state.lsDot && state.lsHeThong && state.lsKey){
    const dotObj = state.dots.find(d=>d.id===state.lsDot);
    const s = summaries.find(x=>x.key===state.lsKey);
    return head + lsBreadcrumb([
      {label:'Tất cả năm', action:'setLsYear(null)'},
      {label:String(state.lsYear), action:`setLsDot(null)`},
      {label: dotObj?dotObj.ten:state.lsDot, action:`setLsHeThong(null)`},
      {label: state.lsHeThong, action:`setLsKey(null)`},
      {label: s? s.key : state.lsKey}
    ]) + (s ? renderHistoryDetailCard(s) : '<div class="empty">Không tìm thấy dữ liệu lịch sử cho đối tượng này.</div>') + footer;
  }

  if(state.lsYear && state.lsDot && state.lsHeThong){
    const dotObj = state.dots.find(d=>d.id===state.lsDot);
    const recsInDot = state.kiemTra.filter(r=>r.dotId===state.lsDot && (r.heThong||'(không có hệ thống)')===state.lsHeThong);
    const keysSeen = {};
    recsInDot.forEach(r=>{ keysSeen[pipeKeyOf(r)] = r; });
    const keys = Object.keys(keysSeen).sort();
    const cards = keys.map(key=>{
      const r = keysSeen[key];
      const s = summaries.find(x=>x.key===key);
      const p = s ? parseFloat(s.last.phanTramConLai) : NaN;
      const st = p<=70?'danger':(p<=85?'warn':'good');
      const safeKey = key.replace(/'/g,"\\'");
      return `<div class="repair-item" onclick="setLsKey('${safeKey}')" style="cursor:pointer;">
        <div class="repair-head" style="cursor:pointer;">
          <div>${esc(pipeCode(r))}</div>
          <span class="status ${st}">${s?(s.last.phanTramConLai+'% còn lại'):'—'}</span>
        </div>
      </div>`;
    }).join('');
    return head + lsBreadcrumb([
      {label:'Tất cả năm', action:'setLsYear(null)'},
      {label:String(state.lsYear), action:`setLsDot(null)`},
      {label: dotObj?dotObj.ten:state.lsDot, action:`setLsHeThong(null)`},
      {label: state.lsHeThong}
    ]) + (cards || '<div class="empty">Chưa có đối tượng nào được đo trong Đợt/Hệ thống này.</div>') + footer;
  }

  if(state.lsYear && state.lsDot){
    const dotObj = state.dots.find(d=>d.id===state.lsDot);
    const recsInDot = state.kiemTra.filter(r=>r.dotId===state.lsDot);
    const groups = {};
    recsInDot.forEach(r=>{ const k = r.heThong||'(không có hệ thống)'; if(!groups[k]) groups[k]=[]; groups[k].push(r); });
    const names = Object.keys(groups).sort((a,b)=>a.localeCompare(b));
    const cards = names.map(ht=>{
      const safeHt = ht.replace(/'/g,"\\'");
      const uniqueObjs = uniq(groups[ht].map(r=>pipeKeyOf(r))).length;
      return `<div class="repair-item" onclick="setLsHeThong('${safeHt}')" style="cursor:pointer;">
        <div class="repair-head" style="cursor:pointer;">
          <div><b style="font-size:14px;">${esc(ht)}</b> <span class="progress-mini">· ${uniqueObjs} đối tượng · ${groups[ht].length} lần đo</span></div>
          <span class="status warn">Xem chi tiết ▼</span>
        </div>
      </div>`;
    }).join('');
    return head + lsBreadcrumb([
      {label:'Tất cả năm', action:'setLsYear(null)'},
      {label:String(state.lsYear), action:`setLsDot(null)`},
      {label: dotObj?dotObj.ten:state.lsDot}
    ]) + (cards || '<div class="empty">Chưa có dữ liệu kiểm tra nào trong Đợt này.</div>') + footer;
  }

  if(state.lsYear){
    const dotsInYear = state.dots.filter(d=> (d.ngayBatDau? new Date(d.ngayBatDau).getFullYear() : 'Không xác định') == state.lsYear)
      .sort((a,b)=>(b.ngayBatDau||'').localeCompare(a.ngayBatDau||''));
    const cards = dotsInYear.map(d=>{
      const soDo = state.kiemTra.filter(r=>r.dotId===d.id).length;
      return `<div class="repair-item" onclick="setLsDot('${d.id}')" style="cursor:pointer;">
        <div class="repair-head" style="cursor:pointer;">
          <div><b style="font-size:14px;">${esc(d.ten)}</b> <span class="progress-mini">· ${esc(d.toMay)} · ${soDo} lần đo</span></div>
          <span class="status ${d.trangThai==='Đang diễn ra'?'warn':'good'}">${esc(d.trangThai)}</span>
        </div>
      </div>`;
    }).join('');
    return head + lsBreadcrumb([{label:'Tất cả năm', action:'setLsYear(null)'},{label:String(state.lsYear)}])
      + (cards || '<div class="empty">Chưa có Đợt sửa chữa nào trong năm này.</div>') + footer;
  }

  const years = uniq(state.dots.map(d=> d.ngayBatDau ? new Date(d.ngayBatDau).getFullYear() : 'Không xác định')).sort((a,b)=>String(b).localeCompare(String(a)));
  const cards = years.map(y=>{
    const soDot = state.dots.filter(d=>(d.ngayBatDau? new Date(d.ngayBatDau).getFullYear() : 'Không xác định')==y).length;
    return `<div class="repair-item" onclick="setLsYear('${y}')" style="cursor:pointer;">
      <div class="repair-head" style="cursor:pointer;">
        <div><b style="font-size:15px;">Năm ${esc(String(y))}</b> <span class="progress-mini">· ${soDot} đợt sửa chữa</span></div>
        <span class="status warn">Xem chi tiết ▼</span>
      </div>
    </div>`;
  }).join('');
  return head + (cards || '<div class="empty">Chưa có Đợt sửa chữa nào được tạo.</div>') + footer;
}
function renderAnalysis(){
  const active = CAUSES.find(c=>c.id===state.activeCause) || CAUSES[0];
  const list = CAUSES.map(c=>`<button class="cause-item ${c.id===active.id?'active':''}" onclick="setCause('${c.id}')"><b>${esc(c.name)}</b>${esc(c.where)}</button>`).join('');
  return `<div class="page-head"><div><div class="page-eyebrow">Tham khảo kỹ thuật</div><div class="page-title">Phân tích nguyên nhân &amp; khuyến nghị sửa chữa</div></div></div>
  <div class="settings-note" style="margin-bottom:18px;">Nội dung tham khảo chung dựa trên các cơ chế hư hỏng ống lò hơi phổ biến. Quyết định sửa chữa thực tế cần dựa trên kiểm tra hiện trường, kết quả kim tương/NDT cụ thể và tiêu chuẩn thiết kế áp dụng (ASME, TCVN…), có phê duyệt của kỹ sư phụ trách.</div>
  <div class="cause-grid"><div class="cause-list">${list}</div>
  <div class="cause-detail"><h3>${esc(active.name)}</h3><div class="cause-sub">${esc(active.where)}</div>
  <h4>Nguyên nhân điển hình</h4><ul>${active.causes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  <h4>Dấu hiệu nhận biết</h4><ul>${active.signs.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  <h4>Phương án sửa chữa khuyến nghị</h4><ul>${active.fix.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div>`;
}

document.body.classList.add(voiceSupported() ? 'voice-ok' : 'voice-no');
loadAll();
startAutoSync();
</script>
</body>
