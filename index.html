<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLSC ỐNG LÒ HƠI — NHIỆT ĐIỆN NGHI SƠN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0d1b26; --panel:#132635; --panel2:#1a3245; --border:#274156; --border-soft:#1e3547;
  --text:#e9eef2; --muted:#8fa3b3; --dim:#54697a;
  --accent:#e08a3c; --accent-soft:#3a2712;
  --danger:#e2564f; --danger-soft:#3a1f1d;
  --warn:#e0b23c; --warn-soft:#3a3012;
  --good:#4fb88a; --good-soft:#163429;
  --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace; --display:'Big Shoulders Display',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}
::selection{background:var(--accent);color:#1a1305;}
button{font-family:var(--sans);cursor:pointer;}
input,select,textarea{font-family:var(--sans);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand-row{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.logo-mark{width:38px;height:38px;flex-shrink:0;}
.brand-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
.brand-title{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;letter-spacing:.01em;}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;font-size:13px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--text);border-color:var(--border);}
.nav-tag{font-family:var(--mono);font-size:10px;font-weight:600;width:26px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);color:var(--dim);flex-shrink:0;}
.nav-item.active .nav-tag{color:var(--accent);border-color:var(--accent-soft);}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--border-soft);margin-top:10px;}
.user-pill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.user-pill .u-role{font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;display:block;font-family:var(--mono);}
.logout-btn{background:none;border:none;color:var(--dim);font-size:11px;text-decoration:underline;padding:4px 0 0;}
.tg-pill{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.dot.off{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.bottom-nav{display:none;}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1180px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.page-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.page-title{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.01em;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#1a1305;border:none;padding:10px 15px;border-radius:6px;font-size:12.5px;font-weight:600;}
.btn:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.btn-ghost:hover{background:var(--panel2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #4a2422;padding:6px 10px;border-radius:5px;font-size:11.5px;}
.file-btn{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:9px 13px;border-radius:6px;font-size:12.5px;}
.file-btn:hover{border-color:#3a4450;}
input[type=file]{display:none;}
.grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px;}
.stat-card .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-card .val{font-family:var(--display);font-size:28px;font-weight:800;margin-top:5px;}
.stat-card.danger .val{color:var(--danger);}
.stat-card.warn .val{color:var(--warn);}
.stat-card.good .val{color:var(--good);}
.section-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:24px 0 10px;}
.record{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:9px;}
.record:hover{border-color:#3a4450;}
.tag-chip{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--dim);background:#0d1b26;border:1px solid var(--border);border-radius:4px;padding:3px 7px;margin-right:8px;}
.record-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.record-loc{font-weight:600;font-size:13.5px;}
.record-meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.record-meta span{margin-right:12px;}
.status{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.status.good{background:var(--good-soft);color:var(--good);}
.status.warn{background:var(--warn-soft);color:var(--warn);}
.status.danger{background:var(--danger-soft);color:var(--danger);}
.record-note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--border-soft);padding-top:7px;}
.record-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);}
.mini-btn:hover{color:var(--text);border-color:#3a4450;}
.mini-btn.tg{color:#4aa3d6;}
.empty{color:var(--dim);font-size:13px;padding:26px 10px;text-align:center;border:1px dashed var(--border);border-radius:8px;}
.form-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{background:#0d1b26;border:1px solid var(--border);border-radius:6px;padding:8px 9px;color:var(--text);font-size:13px;}
.field input:disabled{color:var(--muted);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:50px;}
.form-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap;}
.readonly-box{background:#0d1b26;border:1px solid var(--border-soft);border-radius:6px;padding:8px 9px;font-family:var(--mono);font-size:13px;color:var(--accent);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.dm{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;}
table.dm th{background:var(--panel2);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
table.dm td{padding:8px 10px;border-bottom:1px solid var(--border-soft);}
table.dm tr:last-child td{border-bottom:none;}
.cause-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
.cause-list{display:flex;flex-direction:column;gap:6px;}
.cause-item{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:11px 13px;color:var(--muted);font-size:13px;}
.cause-item.active{background:var(--panel2);color:var(--text);border-color:var(--accent-soft);}
.cause-item b{display:block;color:inherit;font-size:13.5px;margin-bottom:2px;}
.cause-detail{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;position:sticky;top:20px;}
.cause-detail h3{font-family:var(--display);font-size:21px;margin:0 0 4px;}
.cause-detail .cause-sub{color:var(--muted);font-size:12px;margin-bottom:14px;}
.cause-detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:14px 0 7px;}
.cause-detail ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#c9cfd4;}
.settings-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;max-width:560px;margin-bottom:18px;}
.settings-note{background:var(--panel2);border:1px solid var(--border-soft);border-radius:7px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border-soft);margin-top:6px;}
.switch{width:38px;height:21px;border-radius:20px;background:var(--border);position:relative;border:none;flex-shrink:0;}
.switch.on{background:var(--accent);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#e7eaec;transition:left .15s;}
.switch.on::after{left:19px;background:#1a1305;}
.loading{padding:60px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.08em;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 25% 15%,#16324a 0%,var(--bg) 62%);}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px 26px;}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.login-title{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;}
.tabbtns{display:flex;gap:6px;margin-bottom:16px;background:var(--panel2);border-radius:7px;padding:3px;}
.tabbtn{flex:1;padding:8px;text-align:center;border-radius:5px;font-size:12.5px;color:var(--muted);background:none;border:none;}
.tabbtn.active{background:var(--accent);color:#1a1305;font-weight:600;}
.err-msg{color:var(--danger);font-size:12px;margin-top:6px;}
.weld-row{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--border-soft);border-radius:6px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;background:#0d1b26;}
.weld-id{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:150px;}
.weld-chk{display:flex;align-items:center;gap:4px;color:var(--muted);}
.weld-badge{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:10px;text-transform:uppercase;}
.weld-badge.bp{background:var(--warn-soft);color:var(--warn);}
.weld-badge.official{background:var(--good-soft);color:var(--good);}
.repair-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:14px 16px;}
.repair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;}
.progress-mini{font-family:var(--mono);font-size:11px;color:var(--muted);}
.section-sub{margin:28px 0 14px;padding-top:20px;border-top:1px solid var(--border-soft);}
@media(max-width:880px){
  .grid-cards{grid-template-columns:repeat(2,1fr);}
  .cause-grid{grid-template-columns:1fr;}
  .cause-detail{position:static;}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:720px){
  .sidebar{display:none;}
  .main{padding:16px 14px 90px;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;}
  .bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-size:9px;padding:4px 5px;flex-shrink:0;}
  .bn-item.active{color:var(--accent);}
  .bn-tag{font-family:var(--mono);font-size:9.5px;font-weight:700;width:22px;height:17px;display:flex;align-items:center;justify-content:center;border-radius:3px;background:#0d1b26;border:1px solid var(--border);}
  .bn-item.active .bn-tag{border-color:var(--accent-soft);color:var(--accent);}
  .page-title{font-size:22px;}
  .grid-cards{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzUbWgquKmDq54n2RGwlPHyy5_4awJsqmhnmlbfzbf0VUJkjIIgqz_AHJs1pjN1Mx1RWA/exec';
const LOGO_SVG = '<svg class="logo-mark" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">'
  +'<circle cx="22" cy="22" r="19" fill="none" stroke="#e08a3c" stroke-width="3"/>'
  +'<circle cx="22" cy="22" r="11" fill="none" stroke="#e08a3c" stroke-width="3" opacity="0.55"/>'
  +'<circle cx="22" cy="22" r="3" fill="#e08a3c"/>'
  +'</svg>';

const NAV = [
  {id:'overview', tag:'TQ', label:'Tổng quan'},
  {id:'dots',     tag:'ĐV', label:'Đợt kiểm tra/sửa chữa'},
  {id:'danhmuc',  tag:'DM', label:'Danh mục kỹ thuật'},
  {id:'kiemtra',  tag:'ĐĐ', label:'Kiểm tra (đo đạc)'},
  {id:'suachua',  tag:'SC', label:'Sửa chữa & hàn'},
  {id:'vattu',    tag:'VT', label:'Vật tư sử dụng'},
  {id:'history',  tag:'LS', label:'Lịch sử & xu hướng'},
  {id:'analysis', tag:'PT', label:'Phân tích & khuyến nghị'},
];

const CAUSES = [
  {id:'erosion', name:'Mài mòn tro bay (ăn mòn phía khói)', where:'Ống sinh hơi vùng đổi hướng dòng khói, gần miệng đốt',
    causes:['Tốc độ, nồng độ tro bay cao tại vùng đổi hướng dòng khói','Vận hành lệch tâm ngọn lửa gây xoáy dòng khói','Khoảng cách ống - tường quá hẹp làm tăng tốc độ cục bộ'],
    signs:['Bề mặt ống mỏng dần dạng rãnh khía hình yên ngựa, lệch về phía đón dòng khói','Chiều dày giảm dần đều theo thời gian tại cùng vị trí'],
    fix:['Cắt bỏ đoạn ống dưới chiều dày tối thiểu, hàn nối ống mới cùng mác vật liệu và đường kính','Kiểm tra 100% mối hàn bằng NDT trước khi vận hành','Lắp tấm chắn chống mài mòn tại vị trí lặp lại hư hỏng','Rà soát chế độ đốt, cân bằng vòi đốt','Bổ sung điểm đo định kỳ tại vị trí đã sửa chữa']},
  {id:'waterside', name:'Ăn mòn phía nước / hơi', where:'Ống sinh hơi, ống góp, khu vực lưu lượng thấp',
    causes:['Chất lượng nước cấp không đạt (pH, oxy hòa tan)','Đóng cặn tạo lớp cách nhiệt trong ống','Ăn mòn rỗ do oxy hòa tan khi dừng lò không xử lý đúng'],
    signs:['Rỗ ăn mòn cục bộ hoặc lớp cặn dày khi cắt mẫu kiểm tra','Chiều dày giảm không đều, phát hiện qua UT hoặc nội soi'],
    fix:['Cắt và thay ống mới; có thể vá đắp nếu ăn mòn rỗ cục bộ theo quy trình hàn được duyệt','Súc rửa hóa chất nếu cặn vượt ngưỡng cho phép','Hiệu chỉnh chế độ xử lý nước cấp, xử lý oxy, bảo quản lò khi dừng máy']},
  {id:'long-overheat', name:'Quá nhiệt dài hạn (creep)', where:'Ống sinh hơi, quá nhiệt/tái nhiệt vận hành lâu ở nhiệt độ vượt thiết kế',
    causes:['Đóng cặn làm giảm trao đổi nhiệt, kim loại nóng cục bộ','Lưu lượng tuần hoàn không đủ tại một số nhánh','Vận hành kéo dài ở nhiệt độ khói cao hơn thiết kế'],
    signs:['Ống phình cục bộ, vảy oxit dày, đổi màu kim loại','Vết nứt "cửa sổ" khi vỡ ống, mép mỏng biến dạng nhiều'],
    fix:['Cắt bỏ toàn bộ đoạn phình/biến dạng, thay ống đúng mác vật liệu chịu nhiệt','Kiểm tra kim tương, đo độ cứng đoạn lân cận','Xử lý nhiệt sau hàn (PWHT) nếu vật liệu yêu cầu','Làm sạch cặn trong ống trước khi vận hành lại']},
  {id:'short-overheat', name:'Quá nhiệt ngắn hạn (mất lưu lượng đột ngột)', where:'Ống tắc nghẽn cục bộ hoặc mất tuần hoàn đột ngột',
    causes:['Tắc nghẽn dị vật hoặc cặn bong tróc','Sự cố bơm cấp nước, mất tuần hoàn tức thời','Khởi động lò sai quy trình'],
    signs:['Vỡ ống dạng miệng cá, mép mỏng, biến dạng dẻo rõ, xảy ra đột ngột'],
    fix:['Cắt và thay đoạn ống hỏng ngay, kiểm tra kỹ ống lân cận cùng nhánh','Nội soi/súc rửa loại bỏ dị vật gây tắc trước khi vận hành lại','Rà soát quy trình khởi động và liên động bảo vệ mất nước cấp']},
  {id:'fatigue', name:'Nứt do mỏi nhiệt / mỏi cơ', where:'Vị trí hàn, gối đỡ ống, chỗ uốn, điểm ràng buộc giãn nở nhiệt',
    causes:['Chu kỳ khởi động - dừng lò thường xuyên','Gối đỡ kẹt hoặc hư hỏng cản trở giãn nở nhiệt','Rung động cơ khí kéo dài'],
    signs:['Vết nứt dạng mạng nhện tại mối hàn/điểm uốn, lan dần theo thời gian'],
    fix:['Mài loại bỏ vết nứt, nếu vượt giới hạn thì cắt và hàn nối đoạn mới','Sửa chữa hệ thống gối đỡ, giá treo','Kiểm tra PT/MT các vị trí tương tự trong cùng cụm ống']},
  {id:'low-temp-corrosion', name:'Ăn mòn nhiệt độ thấp (điểm sương axit)', where:'Bộ hâm nước, bộ sấy không khí, khu vực khói nhiệt độ thấp',
    causes:['Nhiệt độ vách ống xuống dưới điểm sương axit sulfuric','Hàm lượng lưu huỳnh nhiên liệu cao kết hợp nhiệt độ khói thấp'],
    signs:['Ăn mòn dạng vảy, mất kim loại đều trên diện rộng'],

function pad(n){ return String(n).padStart(4,'0'); }
function esc(s){ return (s===undefined||s===null?'':s).toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function simpleHash(str){ let h=0; str=String(str); for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return 'h'+Math.abs(h).toString(36); }
function uniq(arr){ return [...new Set(arr)]; }
function pipeCode(r){ return (r.toMay?r.toMay+' · ':'')+r.heThong+' - '+r.thietBi+' - '+r.viTri+' - '+r.lopOng; }

  }catch(e){ console.error('Không lấy được dữ liệu từ Google Sheet:', type, e); return null; }
}

async function loadAll(){
  const g = async (k,shared,def)=>{ try{ const r=await window.storage.get(k,shared); return r? JSON.parse(r.value): def; }catch(e){ return def; } };

  // Tài khoản: Google Sheet là nguồn gốc, bộ nhớ cục bộ chỉ là bản sao dự phòng khi mất kết nối
  const sheetUsers = await fetchSheet('users');
  if(sheetUsers){ state.users = mapSheetUsers(sheetUsers); await persist('users', state.users, true); state.offlineUsers=false; }
  else { state.users = await g('users', true, []); state.offlineUsers = true; }

  state.dots = await g('dots', true, []);

  // Danh mục kỹ thuật: Google Sheet là nguồn gốc
  const sheetDanhMuc = await fetchSheet('danh_muc');
  if(sheetDanhMuc){ state.danhMuc = mapSheetDanhMuc(sheetDanhMuc); await persist('danh-muc', state.danhMuc, true); state.offlineDanhMuc=false; }
  else {
    state.danhMuc = await g('danh-muc', true, []);
    if(state.danhMuc.length===0) state.danhMuc = seedDanhMuc();
    state.offlineDanhMuc = true;
  }

  state.taiLieu = await g('tai-lieu', true, []);
  state.kiemTra = await g('kiem-tra', true, []);
  state.suaChua = await g('sua-chua', true, []);

  // Cấu hình Telegram/tần suất: chỉ đọc từ Google Sheet (sheet CauHinh), không có màn hình cài đặt trong app
  const sheetCauHinh = await fetchSheet('cau_hinh');
  state.telegram = sheetCauHinh ? mapSheetCauHinh(sheetCauHinh) : {botToken:'',chatId:'',tanSuatGio:''};

  const sess = await g('session', false, null);
  if(sess && state.users.find(u=>u.email===sess)) state.session = state.users.find(u=>u.email===sess);
  state.loading=false;
  render();

/* ---------- Kiểm tra chồng lấn dải Vị trí/Lớp ống trong Danh mục kỹ thuật ---------- */
function rangesOverlap1D(aFrom,aTo,bFrom,bTo){
  const af=(aFrom===''||isNaN(parseFloat(aFrom)))?-Infinity:parseFloat(aFrom);
  const at=(aTo===''||isNaN(parseFloat(aTo)))?Infinity:parseFloat(aTo);
  const bf=(bFrom===''||isNaN(parseFloat(bFrom)))?-Infinity:parseFloat(bFrom);
  const bt=(bTo===''||isNaN(parseFloat(bTo)))?Infinity:parseFloat(bTo);
  return af<=bt && bf<=at;
}
function danhMucOverlaps(row, excludeId){
  return state.danhMuc.filter(r=>
    r.id!==excludeId && r.heThong===row.heThong && r.thietBi===row.thietBi
    && (!r.toMay || !row.toMay || r.toMay===row.toMay)
    && rangesOverlap1D(row.viTriTu,row.viTriDen,r.viTriTu,r.viTriDen)
    && rangesOverlap1D(row.lopOngTu,row.lopOngDen,r.lopOngTu,r.lopOngDen)
  );
}

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  if(!name||!email||!pass){ state.authErr='Vui lòng nhập đầy đủ họ tên, email và mật khẩu.'; render(); return; }
  if(state.users.find(u=>u.email===email)){ state.authErr='Email này đã được đăng ký.'; render(); return; }
  const role = state.users.length===0 ? 'admin' : 'ky_thuat';
  const user = {name, email, passHash: simpleHash(pass), role};
  state.users.push(user);
  await persist('users', state.users, true);
  syncToSheet('user', user);
  state.session = user; state.authErr='';
  await persist('session', email, false);
  render();
}
async function doLogin(){
  const email=document.getElementById('log-email').value.trim().toLowerCase();
  const pass=document.getElementById('log-pass').value;
  const user = state.users.find(u=>u.email===email);
  if(!user || user.passHash !== simpleHash(pass)){ state.authErr='Email hoặc mật khẩu không đúng.'; render(); return; }
  state.session=user; state.authErr='';
  await persist('session', email, false);
  render();
}
async function doLogout(){ state.session=null; await persist('session', null, false); render(); }

window.importDanhMuc = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async e=>{
    const wb = XLSX.read(e.target.result, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let added=0, lastHeThong='', lastThietBi='', lastToMay='';
    const newlyAdded = [];
    rows.forEach(r=>{
      let heThong=String(r['Hệ thống']||r['He thong']||'').trim();
      let thietBi=String(r['Thiết bị']||r['Thiet bi']||'').trim();
      let toMay=String(r['Tổ máy (để trống = dùng chung)']||r['Tổ máy']||r['To may']||'').trim();
      const vung=String(r['Quy ước vùng vật liệu trên bản vẽ']||r['Vùng']||r['Vung']||'').trim();
      const duongKinh=r['Đường kính']||r['Duong kinh'], chieuDay=r['Chiều dày']||r['Chieu day'];
      if(!duongKinh||!chieuDay) return;
      // các dòng gộp ô trong Excel thường để trống Hệ thống/Thiết bị/Tổ máy ở các hàng con — kế thừa từ dòng trước đó
      if(heThong) lastHeThong=heThong; else heThong=lastHeThong;
      if(thietBi) lastThietBi=thietBi; else thietBi=lastThietBi;
      if(toMay) lastToMay=toMay;
      const newRec = {id:'DM-'+pad(state.danhMuc.length+1), toMay, heThong, thietBi,
        viTriTu:String(r['Vị trí từ']||r['Vi tri tu']||''), viTriDen:String(r['Vị trí đến']||r['Vi tri den']||''),
        lopOngTu:String(r['Lớp ống từ']||r['Lop ong tu']||''), lopOngDen:String(r['Lớp ống đến']||r['Lop ong den']||''),
        vung: vung||('#'+pad(state.danhMuc.length+1)),
        duongKinh:String(duongKinh), chieuDay:String(chieuDay),
        vatLieu:String(r['Vật liệu']||r['Vat lieu']||''), ghiChu:String(r['Ghi chú']||r['Ghi chu']||'')};
      state.danhMuc.push(newRec);
      newlyAdded.push(newRec);
      added++;
    });
    await persist('danh-muc', state.danhMuc, true);
    // sau khi nhập xong mới rà soát chồng lấn (không chặn nhập, chỉ cảnh báo để sửa sau)
    const conflictMsgs = [];
    newlyAdded.forEach(rec=>{
      const ov = danhMucOverlaps(rec, rec.id);
      if(ov.length) conflictMsgs.push('Vùng "'+rec.vung+'" ('+rec.heThong+(rec.thietBi?(' - '+rec.thietBi):'')+') chồng lấn với vùng "'+ov[0].vung+'"');
    });
    let msg = 'Đã nhập '+added+' dòng từ file Excel.';
    if(conflictMsgs.length){
      msg += '\n\nCẢNH BÁO: phát hiện '+conflictMsgs.length+' dòng có dải Vị trí/Lớp ống chồng lấn với vùng khác — cần sửa lại để Kiểm tra tự nhận diện đúng vùng:\n- '+conflictMsgs.slice(0,10).join('\n- ')+(conflictMsgs.length>10?'\n... và '+(conflictMsgs.length-10)+' dòng khác':'');
    }
    alert(msg);
    input.value=''; render();
  };
  reader.readAsArrayBuffer(file);
};

  if(level==='thietBi'){ state.ktSel.thietBi=value; state.ktSel.vung=''; }
  render();
  window.updateKtDerived();
};
function inRange(val, from, to){
  const v=parseFloat(val);
  if(isNaN(v)) return false;
  const f = (from===undefined||from===null||from===''||isNaN(parseFloat(from))) ? -Infinity : parseFloat(from);
  const t = (to===undefined||to===null||to===''||isNaN(parseFloat(to))) ? Infinity : parseFloat(to);
  return v>=f && v<=t;
}
function ktCandidates(toMay, heThong, thietBi, viTri, lopOng){
  if(!heThong || !viTri || !lopOng) return [];
  return state.danhMuc.filter(r=> r.heThong===heThong && (!thietBi || r.thietBi===thietBi)
    && (!r.toMay || r.toMay===toMay)
    && inRange(viTri, r.viTriTu, r.viTriDen) && inRange(lopOng, r.lopOngTu, r.lopOngDen));
}
window.updateKtDerived = function(){
  const vt = document.getElementById('kt-vitri'), lo = document.getElementById('kt-lopong');
  if(!vt || !lo) return;
  state.ktSel.viTri = vt.value.trim(); state.ktSel.lopOng = lo.value.trim();
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj ? dotObj.toMay : '';
  const candidates = ktCandidates(toMay, state.ktSel.heThong, state.ktSel.thietBi, state.ktSel.viTri, state.ktSel.lopOng);
  const dm = candidates.length===1 ? candidates[0] : null;
  state.ktCandidates = candidates; state.ktResolved = dm;
  const box = id=>document.getElementById(id);
  if(box('kt-vung-box')) box('kt-vung-box').textContent = dm? dm.vung : '—';

  const ambig = box('kt-ambig-wrap');
  if(ambig){
    if(candidates.length>1){
      ambig.style.display='block';
      ambig.innerHTML = '<b>Danh mục kỹ thuật đang bị xung đột:</b> có '+candidates.length+' vùng vật liệu ('
        + candidates.map(c=>esc(c.vung)).join(', ')
        + ') cùng bao trùm vị trí/lớp ống này. Không thể tự nhận diện đúng vùng. Vui lòng vào tab "Danh mục kỹ thuật" sửa lại dải Vị trí/Lớp ống của các vùng này cho KHÔNG chồng lấn nhau, rồi quay lại kiểm tra.';
    } else if(state.ktSel.viTri && state.ktSel.lopOng && candidates.length===0 && state.ktSel.heThong){
      ambig.style.display='block';
      ambig.innerHTML = 'Không tìm thấy vùng vật liệu nào trong Danh mục kỹ thuật khớp với Vị trí/Lớp ống này. Vui lòng kiểm tra lại Danh mục kỹ thuật hoặc nhập đúng số Vị trí/Lớp ống.';
    } else { ambig.style.display='none'; ambig.innerHTML=''; }
  }
};

window.importKiemTra = function(input){
  const file=input.files[0]; if(!file) return;
  if(!state.ktSel.dotId){ alert('Vui lòng mở biểu mẫu Kiểm tra và chọn Đợt kiểm tra/sửa chữa trước khi nhập Excel — toàn bộ dữ liệu trong file sẽ được gắn vào đợt/tổ máy đó.'); input.value=''; return; }
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const reader=new FileReader();
  reader.onload=async e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    let added=0, skipped=0, ambiguous=0;
    rows.forEach(r=>{
      const heThong=r['Hệ thống']||r['He thong'], thietBi=r['Thiết bị']||r['Thiet bi']||'';
      const vungCol=String(r['Quy ước vùng vật liệu trên bản vẽ']||r['Vùng']||r['Vung']||'');
      const viTri=String(r['Vị trí']||r['Vi tri']||''), lopOng=String(r['Lớp ống']||r['Lop ong']||'');
      const chieuDayDo = r['Chiều dày đo (mm)']||r['Chieu day do'];
      if(!heThong || !viTri || !lopOng || !chieuDayDo){ skipped++; return; }
      let candidates = ktCandidates(dotObj.toMay, String(heThong), String(thietBi), viTri, lopOng);
      let dm = candidates.length===1 ? candidates[0] : (vungCol ? candidates.find(c=>c.vung===vungCol) : null);
      if(!dm){ if(candidates.length>1) ambiguous++; else skipped++; return; }
      const phanTramConLai=(parseFloat(chieuDayDo)/parseFloat(dm.chieuDay)*100);
      state.kiemTra.unshift({id:'KT-'+pad(state.kiemTra.length+1), danhMucId:dm.id, dotId:dotObj.id, toMay:dotObj.toMay, heThong:dm.heThong, thietBi:dm.thietBi, vung:dm.vung, viTri, lopOng, duongKinh:dm.duongKinh, chieuDayTK:dm.chieuDay, chieuDayDo:String(chieuDayDo), phanTramConLai:phanTramConLai.toFixed(1), ngoaiDang:String(r['Ngoại dạng']||r['Ngoai dang']||''), ngay:String(r['Ngày kiểm tra']||r['Ngay kiem tra']||todayStr()), nguoiKiemTra:String(r['Người kiểm tra']||r['Nguoi kiem tra']||(state.session?state.session.name:''))});
      added++;
    });
    await persist('kiem-tra', state.kiemTra, true);
    await syncSuaChua();
    alert('Đã nhập '+added+' dòng vào đợt "'+dotObj.ten+'". Bỏ qua '+skipped+' dòng không khớp Danh mục kỹ thuật hoặc thiếu dữ liệu.'+(ambiguous?(' '+ambiguous+' dòng có nhiều vùng khớp — cần bổ sung cột "Quy ước vùng vật liệu trên bản vẽ" trong file để phân biệt.'):''));
    input.value=''; render();
  };
  reader.readAsArrayBuffer(file);
};

/* ---------- SỬA CHỮA & HÀN ---------- */
function pipeKeyOf(k){ return (k.toMay||'')+'|'+k.heThong+'|'+k.thietBi+'|'+k.viTri+'|'+k.lopOng; }
async function syncSuaChua(){
  const byPipe = {};
  state.kiemTra.forEach(k=>{
    const key = pipeKeyOf(k);
    if(!byPipe[key]) byPipe[key]=[];
    byPipe[key].push(k);
  });
  Object.keys(byPipe).forEach(key=>{
    const history = byPipe[key].slice().sort((a,b)=>a.ngay.localeCompare(b.ngay));
    const existingItems = state.suaChua.filter(s=>s.pipeKey===key).sort((a,b)=>a.chuKy-b.chuKy);
    const lastItem = existingItems.length ? existingItems[existingItems.length-1] : null;
    // nếu chu kỳ trước đã hoàn thành (đã thay ống), chỉ xét các lần đo SAU ngày hoàn thành đó — không nối tiếp xu hướng ống cũ
    const cycleStart = (lastItem && lastItem.trangThai==='Hoàn thành' && lastItem.ngayHoanThanh) ? lastItem.ngayHoanThanh : null;
    const relevant = cycleStart ? history.filter(h=>h.ngay > cycleStart) : history;
    if(relevant.length===0) return;
    const latest = relevant[relevant.length-1];
    if(parseFloat(latest.phanTramConLai) > 70) return;
    let activeItem = (lastItem && lastItem.trangThai!=='Hoàn thành') ? lastItem : null;
    if(!activeItem){
      const chuKy = (lastItem ? lastItem.chuKy : 0) + 1;
      const idBase = (latest.toMay?latest.toMay+' · ':'')+latest.heThong+' - '+latest.thietBi+' - '+latest.viTri+' - '+latest.lopOng;
      const displayId = idBase + (chuKy>1 ? (' (Chu kỳ '+chuKy+')') : '');
      activeItem = {id:displayId, pipeKey:key, chuKy, dotId:latest.dotId, toMay:latest.toMay,
        heThong:latest.heThong, thietBi:latest.thietBi, viTri:latest.viTri, lopOng:latest.lopOng,
        chieuDayTK:latest.chieuDayTK, chieuDayDoGanNhat:latest.chieuDayDo, phanTramConLai:latest.phanTramConLai,
        ngayTao:todayStr(), trangThai:'Chờ xử lý', ngayHoanThanh:'', phuongAn:'Cắt thay',
        welds:[{id:displayId+'-w1', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:''},
               {id:displayId+'-w2', loai:'chinh_thuc', daCat:false, daHan:false, paut:'Chưa kiểm tra', ngayHan:'', thoHan:'', ghiChu:''}]};
      state.suaChua.push(activeItem);
      syncToSheet('sua_chua_item', activeItem);
    } else {
      activeItem.chieuDayDoGanNhat = latest.chieuDayDo; activeItem.phanTramConLai = latest.phanTramConLai;
    }
    if(activeItem.phuongAn==='Cắt thay') recomputeStatus(activeItem);
  });
  await persist('sua-chua', state.suaChua, true);
}
function recomputeStatus(item){
  const official = item.welds.filter(w=>w.loai==='chinh_thuc');
  if(official.length===0){ item.trangThai='Chờ xử lý'; return; }
  const allDone = official.every(w=>w.daCat && w.daHan && w.paut==='Đạt');
  if(allDone){
    item.trangThai='Hoàn thành';
    if(!item.ngayHoanThanh) item.ngayHoanThanh = todayStr();
  } else {
    item.trangThai='Đang tiến hành';
    item.ngayHoanThanh='';
  }
}

        heThong:String(r['Hệ thống']||r['He thong']||''), thietBi:String(r['Thiết bị']||r['Thiet bi']||''),
        mucDich:String(r['Mục đích sử dụng']||r['Muc dich su dung']||''), maVatTu:String(r['Mã vật tư']||r['Ma vat tu']||''),
        tenVatTu, donVi:String(r['Đơn vị']||r['Don vi']||''), soLuong:String(soLuong),
        lyDoThayThe:String(r['Lý do thay thế']||r['Ly do thay the']||''), ghiChu:String(r['Ghi chú']||r['Ghi chu']||''),
        ngay:String(r['Ngày']||r['Ngay']||todayStr())});
      added++;
    });
    await persist('vat-tu', state.vatTu, true);
    alert('Đã nhập '+added+' dòng vật tư vào đợt "'+dotObj.ten+'".');
    input.value=''; render();
  };
  reader.readAsArrayBuffer(file);
};

function computeDotStats(dotId){
  const kt = state.kiemTra.filter(k=>k.dotId===dotId);
  const uniquePipes = uniq(kt.map(k=>pipeKeyOf(k))).length;
  const sc = state.suaChua.filter(s=>s.dotId===dotId);
  const catThay = sc.filter(s=>(s.phuongAn||'Cắt thay')==='Cắt thay');
  const hanPhu = sc.filter(s=>s.phuongAn==='Hàn phủ');
  const suaOp = sc.filter(s=>s.phuongAn==='Sửa ốp');
  let weldDone=0, weldTotal=0;
  catThay.forEach(item=>{ item.welds.forEach(w=>{ weldTotal++; if(w.daHan && w.paut==='Đạt') weldDone++; }); });
  const vt = state.vatTu.filter(v=>v.dotId===dotId);
  const vtTotals = {};
  vt.forEach(r=>{ const k=r.tenVatTu+'||'+r.donVi; vtTotals[k]=(vtTotals[k]||0)+(parseFloat(r.soLuong)||0); });
  const nTotal = sc.length, nDone = sc.filter(s=>s.trangThai==='Hoàn thành').length;
  const dot = state.dots.find(d=>d.id===dotId);
  let duKien = null;
  if(dot){
    const days = (Date.now() - new Date(dot.ngayBatDau+'T00:00:00').getTime())/(1000*60*60*24);
    if(nTotal>0 && nDone>0 && days>0){
      if(nDone>=nTotal) duKien = {done:true};
      else { const speed = nDone/days; const daysLeft=(nTotal-nDone)/speed; duKien = {date:new Date(Date.now()+daysLeft*24*60*60*1000)}; }
    }
  }
  return {uniquePipes, catThay:catThay.length, hanPhu:hanPhu.length, suaOp:suaOp.length,
    catThayDone:catThay.filter(s=>s.trangThai==='Hoàn thành').length,
    hanPhuDone:hanPhu.filter(s=>s.trangThai==='Hoàn thành').length,
    suaOpDone:suaOp.filter(s=>s.trangThai==='Hoàn thành').length,
    weldDone, weldTotal, vtTotals, nTotal, nDone, duKien};
}
function renderDotDashboard(dotId){

  if(s.duKien){
    duKienText = s.duKien.done ? 'Đã hoàn thành toàn bộ hạng mục đã phát hiện tính đến hiện tại.'
      : ('Khoảng <b>'+s.duKien.date.toLocaleDateString('vi-VN')+'</b> — ước tính theo tốc độ hoàn thành thực tế, tự cập nhật liên tục, có thể thay đổi nếu phát hiện thêm hư hỏng mới trong quá trình kiểm tra.');
  }
  return `<div class="repair-item" style="margin-bottom:18px;">
    <div class="repair-head" style="cursor:default;">
      <div><span class="tag-chip">${esc(dot.id)}</span><b style="font-size:15px;">${esc(dot.ten)}</b> <span style="color:var(--muted);">· ${esc(dot.toMay)}</span></div>

      <div class="stat-card ${s.hanPhu>0?'warn':''}"><div class="lbl">Hàn phủ (xong/tổng)</div><div class="val">${s.hanPhuDone}/${s.hanPhu}</div></div>
      <div class="stat-card ${s.suaOp>0?'warn':''}"><div class="lbl">Sửa ốp (xong/tổng)</div><div class="val">${s.suaOpDone}/${s.suaOp}</div></div>
    </div>
    <div class="grid-cards">
      <div class="stat-card"><div class="lbl">Mối hàn đã hàn/tổng (Cắt thay)</div><div class="val">${s.weldDone}/${s.weldTotal}</div></div>
      <div class="stat-card" style="grid-column:span 3;"><div class="lbl">Thời gian dự kiến hoàn thành</div><div style="font-size:13.5px;margin-top:7px;line-height:1.5;">${duKienText}</div></div>
    </div>
    <div class="section-label" style="margin-top:16px;">Vật tư đã sử dụng</div>
    <div class="table-wrap"><table class="dm"><thead><tr><th>Tên vật tư</th><th>Tổng số lượng</th><th>Đơn vị</th></tr></thead><tbody>${vtRows||'<tr><td colspan="3" style="text-align:center;color:var(--dim);padding:14px;">Chưa có dữ liệu</td></tr>'}</tbody></table></div>
  </div>`;
}

      <button class="btn-ghost" onclick="setOvYear(null)">← Quay lại danh sách năm</button></div>
      ${rows || '<div class="empty">Không có đợt nào trong năm này.</div>'}`;
  }
  const years = uniq(state.dots.map(d=>d.ngayBatDau?d.ngayBatDau.slice(0,4):null).filter(Boolean)).sort((a,b)=>b-a);
  const rows = years.map(y=>{
    const count = state.dots.filter(d=>d.ngayBatDau && d.ngayBatDau.slice(0,4)===y).length;
    return `<div class="record" style="cursor:pointer;" onclick="setOvYear('${y}')"><div class="record-top"><div class="record-loc" style="font-family:var(--display);font-size:20px;">${esc(y)}</div><span class="status good">${count} đợt</span></div></div>`;
  }).join('');
  return `<div class="page-head"><div><div class="page-eyebrow">Lịch sử theo năm</div><div class="page-title">Chọn năm</div></div>
    <button class="btn-ghost" onclick="setOvMode('current')">← Về Tổng quan hiện tại</button></div>
    ${rows || '<div class="empty">Chưa có đợt nào trong lịch sử.</div>'}`;
}

  const tlRows = state.taiLieu.map(t=>`<div class="record"><div class="record-top"><div class="record-loc">${esc(t.tenTaiLieu)}</div></div><div class="record-meta"><span>${esc(t.soHieu||'—')}</span><span>${esc(t.heThong||'—')}</span>${t.link?`<span><a href="${esc(t.link)}" target="_blank" style="color:#4aa3d6;">Mở tài liệu ↗</a></span>`:''}</div>${t.ghiChu?`<div class="record-note">${esc(t.ghiChu)}</div>`:''}<div class="record-actions"><button class="mini-btn" onclick="deleteTaiLieu('${t.id}')">Xóa</button></div></div>`).join('');

    </div></div>
  ${danhMucForm()}
  <div class="settings-note" style="margin-bottom:14px;">Bảng thông số này là dữ liệu gốc cho toàn hệ thống, theo đúng cấu trúc file kỹ thuật của nhà máy: mỗi Hệ thống/Thiết bị có nhiều <b>vùng vật liệu</b> (quy ước theo bản vẽ, VD: GA, GB, GC…), mỗi vùng ứng với một dải Vị trí/Lớp ống và có Đường kính, Chiều dày, Vật liệu riêng. Khi kiểm tra, người dùng chọn Hệ thống → Thiết bị → Vùng vật liệu (tra theo bản vẽ), sau đó nhập số Vị trí/Lớp ống cụ thể của ống đang đo. File Excel nhập vào nên dùng đúng tiêu đề cột: Hệ thống, Thiết bị, Vị trí từ, Vị trí đến, Lớp ống từ, Lớp ống đến, Quy ước vùng vật liệu trên bản vẽ, Đường kính, Chiều dày, Vật liệu, Ghi chú — có thể tải file mẫu bằng nút "Xuất Excel" rồi điền tiếp vào đó.</div>

function renderKiemTra(){
  const activeDots = state.dots.filter(d=>d.trangThai==='Đang diễn ra');
  if(!state.ktSel.dotId && activeDots.length===1) state.ktSel.dotId = activeDots[0].id;
  const dotObj = state.dots.find(d=>d.id===state.ktSel.dotId);
  const toMay = dotObj ? dotObj.toMay : '';
  const heThongOpts = uniq(state.danhMuc.filter(r=>!r.toMay||r.toMay===toMay).map(r=>r.heThong));
  const thietBiOpts = uniq(state.danhMuc.filter(r=>(!r.toMay||r.toMay===toMay) && r.heThong===state.ktSel.heThong).map(r=>r.thietBi));
  const opt = (arr, cur) => `<option value="">— Chọn —</option>` + arr.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)||'(không có)'}</option>`).join('');
  const candidates = ktCandidates(toMay, state.ktSel.heThong, state.ktSel.thietBi, state.ktSel.viTri, state.ktSel.lopOng);
  const dm = candidates.length===1 ? candidates[0] : null;
  state.ktCandidates = candidates; state.ktResolved = dm;

  const noActiveDot = activeDots.length===0;
  const form = !state.showForm.kiemtra ? '' : (noActiveDot ? `<div class="form-panel"><div class="settings-note" style="margin-top:0;">Chưa có đợt nào đang diễn ra. Vào tab "Đợt kiểm tra/sửa chữa" để tạo đợt mới (gắn với 1 tổ máy) trước khi nhập kết quả kiểm tra.</div></div>` : `<div class="form-panel">
    <div class="form-grid">
      <div class="field full"><label>Đợt kiểm tra/sửa chữa (tổ máy) *</label><select onchange="ktSelect('dotId', this.value)">${activeDots.map(d=>`<option value="${esc(d.id)}" ${d.id===state.ktSel.dotId?'selected':''}>${esc(d.ten)} — ${esc(d.toMay)}</option>`).join('')}</select></div>
      <div class="field"><label>Hệ thống *</label><select onchange="ktSelect('heThong', this.value)">${opt(heThongOpts, state.ktSel.heThong)}</select></div>
      <div class="field"><label>Thiết bị</label><select onchange="ktSelect('thietBi', this.value)" ${!state.ktSel.heThong?'disabled':''}>${opt(thietBiOpts, state.ktSel.thietBi)}</select></div>
      <div class="field"><label>Vị trí ống (số cụ thể) *</label><input id="kt-vitri" value="${esc(state.ktSel.viTri)}" placeholder="VD: 145" oninput="updateKtDerived()"></div>
      <div class="field"><label>Lớp ống (số cụ thể) *</label><input id="kt-lopong" value="${esc(state.ktSel.lopOng)}" placeholder="VD: 3" oninput="updateKtDerived()"></div>
      <div class="field full" id="kt-ambig-wrap" style="display:${candidates.length!==1 && state.ktSel.viTri && state.ktSel.lopOng?'block':'none'};background:var(--danger-soft);color:var(--danger);border:1px solid #4a2422;border-radius:7px;padding:11px 13px;font-size:12.5px;line-height:1.5;">
        ${candidates.length>1?('<b>Danh mục kỹ thuật đang bị xung đột:</b> có '+candidates.length+' vùng vật liệu ('+candidates.map(c=>esc(c.vung)).join(', ')+') cùng bao trùm vị trí/lớp ống này. Vui lòng vào tab "Danh mục kỹ thuật" sửa lại dải Vị trí/Lớp ống cho KHÔNG chồng lấn, rồi quay lại kiểm tra.') : (candidates.length===0?'Không tìm thấy vùng vật liệu nào trong Danh mục kỹ thuật khớp với Vị trí/Lớp ống này.':'')}
      </div>
      <div class="field"><label>Vùng vật liệu (tự động, theo bản vẽ)</label><div class="readonly-box" id="kt-vung-box">${dm? esc(dm.vung) : '—'}</div></div>
      <div class="field"><label>Đường kính (mm)</label><div class="readonly-box" id="kt-dk-box">${dm?esc(dm.duongKinh):'—'}</div></div>
      <div class="field"><label>Chiều dày thiết kế (mm)</label><div class="readonly-box" id="kt-day-box">${dm?esc(dm.chieuDay):'—'}</div></div>
      <div class="field"><label>Vật liệu</label><div class="readonly-box" id="kt-vl-box">${dm?esc(dm.vatLieu||'—'):'—'}</div></div>
      <div class="field"><label>Chiều dày đo được (mm) *</label><input id="kt-do" placeholder="VD: 3.9"></div>
      <div class="field"><label>Ngoại dạng quan sát</label><select id="kt-ngoaidang"><option>Bình thường</option><option>Rỗ ăn mòn</option><option>Biến dạng / phình</option><option>Nứt</option><option>Mài mòn cục bộ</option><option>Khác</option></select></div>
      <div class="field"><label>Ngày kiểm tra</label><input id="kt-ngay" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Người kiểm tra</label><input id="kt-nguoi" value="${esc(state.session.name)}" disabled></div>
    </div>
    <div class="form-actions"><button class="btn-ghost" onclick="toggleForm('kiemtra')">Hủy</button><button class="btn" onclick="addKiemTra()">Lưu kết quả</button></div>
  </div>`);

  const rows = state.kiemTra.map(r=>{
    const p=parseFloat(r.phanTramConLai); const s=p<=70?'danger':(p<=85?'warn':'good');
    const d = state.dots.find(x=>x.id===r.dotId);
    return `<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${r.id}</span>${esc(pipeCode(r))} <span style="color:var(--muted);font-weight:400;">· vùng ${esc(r.vung)}${d?(' · '+esc(d.ten)):''}</span></div><span class="status ${s}">${r.phanTramConLai}% còn lại</span></div>
    <div class="record-meta"><span>Đo được: ${esc(r.chieuDayDo)}mm</span><span>Thiết kế: ${esc(r.chieuDayTK)}mm</span><span>Ø${esc(r.duongKinh)}mm</span><span>Ngoại dạng: ${esc(r.ngoaiDang||'—')}</span><span>${fmtDate(r.ngay)}</span><span>${esc(r.nguoiKiemTra)}</span></div></div>`;
  }).join('');

  return `<div class="page-head"><div><div class="page-eyebrow">Nhật ký</div><div class="page-title">Kiểm tra (đo đạc)</div></div>
    <div class="head-actions">
      <label class="file-btn">Nhập Excel<input type="file" accept=".xlsx,.xls,.csv" onchange="importKiemTra(this)"></label>
      <button class="btn-ghost" onclick="exportKiemTra()">Xuất Excel</button>
      <button class="btn" onclick="toggleForm('kiemtra')">${state.showForm.kiemtra?'Đóng biểu mẫu':'+ Thêm bản ghi'}</button>
    </div></div>
  ${form}
  ${rows || '<div class="empty">Chưa có bản ghi kiểm tra. Cần có dữ liệu ở "Danh mục kỹ thuật" trước.</div>'}`;
}

window.setScFilter = function(field, value){ state.scFilter[field]=value; if(field==='toMay'){state.scFilter.heThong='';state.scFilter.thietBi='';} if(field==='heThong'){state.scFilter.thietBi='';} render(); };
function renderSuaChua(){
  const allActive = state.suaChua.filter(item=>{ const d = state.dots.find(x=>x.id===item.dotId); return !d || d.trangThai==='Đang diễn ra'; });
  const toMayOpts = uniq(allActive.map(i=>i.toMay).filter(Boolean));
  const heThongOpts = uniq(allActive.filter(i=>!state.scFilter.toMay||i.toMay===state.scFilter.toMay).map(i=>i.heThong));
  const thietBiOpts = uniq(allActive.filter(i=>(!state.scFilter.toMay||i.toMay===state.scFilter.toMay)&&(!state.scFilter.heThong||i.heThong===state.scFilter.heThong)).map(i=>i.thietBi));
  const filtered = allActive.filter(i=>
    (!state.scFilter.toMay||i.toMay===state.scFilter.toMay) &&
    (!state.scFilter.heThong||i.heThong===state.scFilter.heThong) &&
    (!state.scFilter.thietBi||i.thietBi===state.scFilter.thietBi)
  );
  const filterBar = `<div class="form-panel" style="padding:12px 16px;"><div class="form-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="field"><label>Lọc theo Tổ máy</label><select onchange="setScFilter('toMay', this.value)"><option value="">— Tất cả —</option>${toMayOpts.map(v=>`<option value="${esc(v)}" ${v===state.scFilter.toMay?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="field"><label>Lọc theo Hệ thống</label><select onchange="setScFilter('heThong', this.value)"><option value="">— Tất cả —</option>${heThongOpts.map(v=>`<option value="${esc(v)}" ${v===state.scFilter.heThong?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="field"><label>Lọc theo Thiết bị</label><select onchange="setScFilter('thietBi', this.value)"><option value="">— Tất cả —</option>${thietBiOpts.map(v=>`<option value="${esc(v)}" ${v===state.scFilter.thietBi?'selected':''}>${esc(v)||'(không có)'}</option>`).join('')}</select></div>
  </div></div>`;

  const items = filtered.map(item=>{
    const phuongAn = item.phuongAn || 'Cắt thay';
    const expanded = state.expandedRepair===item.id;
    const s = item.trangThai==='Hoàn thành'?'good':(item.trangThai==='Đang tiến hành'?'warn':'danger');
    const official = item.welds.filter(w=>w.loai==='chinh_thuc').length;
    const doneW = item.welds.filter(w=>w.daCat&&w.daHan&&w.paut==='Đạt').length;
    const phuongAnSelect = `<select onchange="setPhuongAn('${item.id}', this.value)" style="background:#0d1b26;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11.5px;">
      <option ${phuongAn==='Cắt thay'?'selected':''}>Cắt thay</option>
      <option ${phuongAn==='Hàn phủ'?'selected':''}>Hàn phủ</option>
      <option ${phuongAn==='Sửa ốp'?'selected':''}>Sửa ốp</option>
    </select>`;
    let bodyHtml;
    if(phuongAn==='Cắt thay'){
      const weldRows = item.welds.map(w=>`<div class="weld-row">
        <span class="weld-id">${esc(w.id)}</span>
        <span class="weld-badge ${w.loai==='bien_phap'?'bp':'official'}">${w.loai==='bien_phap'?'Biện pháp':'Chính thức'}</span>
        <label class="weld-chk"><input type="checkbox" ${w.daCat?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daCat')"> Đã cắt</label>
        <label class="weld-chk"><input type="checkbox" ${w.daHan?'checked':''} onchange="toggleWeldFlag('${item.id}','${w.id}','daHan')"> Đã hàn</label>
        <select onchange="setWeldPaut('${item.id}','${w.id}', this.value)" style="background:#0d1b26;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11.5px;">
          <option ${w.paut==='Chưa kiểm tra'?'selected':''}>Chưa kiểm tra</option>
          <option ${w.paut==='Đạt'?'selected':''}>Đạt</option>
          <option ${w.paut==='Lỗi'?'selected':''}>Lỗi</option>
        </select>
        <input placeholder="Thợ hàn" value="${esc(w.thoHan)}" style="width:110px;background:#0d1b26;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 6px;font-size:11.5px;" onchange="setWeldField('${item.id}','${w.id}','thoHan', this.value)">
        ${w.loai==='bien_phap'?`<button class="mini-btn" onclick="removeWeld('${item.id}','${w.id}')">Xóa</button>`:''}
      </div>`).join('');
      bodyHtml = `${weldRows}<button class="mini-btn" style="margin-top:6px;" onclick="addBienPhapWeld('${item.id}')">+ Thêm mối hàn biện pháp</button>`;
    } else {
      bodyHtml = `<div class="field" style="max-width:260px;"><label>Trạng thái (${esc(phuongAn)})</label><select onchange="setManualStatus('${item.id}', this.value)">
        <option ${item.trangThai==='Chờ xử lý'?'selected':''}>Chờ xử lý</option>
        <option ${item.trangThai==='Đang tiến hành'?'selected':''}>Đang tiến hành</option>
        <option ${item.trangThai==='Hoàn thành'?'selected':''}>Hoàn thành</option>
      </select></div>`;
    }
    return `<div class="repair-item">
      <div class="repair-head" onclick="toggleRepairExpand('${item.id}')">
        <div><span class="tag-chip">${esc(item.id)}</span>${phuongAnSelect} <span class="progress-mini">${phuongAn==='Cắt thay'?(doneW+'/'+official+' mối hàn chính thức đạt · '):''}${item.phanTramConLai}% còn lại</span></div>
        <span class="status ${s}">${esc(item.trangThai)}</span>
      </div>
      ${expanded ? `<div style="margin-top:12px;" onclick="event.stopPropagation()">${bodyHtml}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="page-head"><div><div class="page-eyebrow">Danh sách cần xử lý · Quản lý mối hàn</div><div class="page-title">Sửa chữa &amp; hàn</div></div>
    <button class="btn-ghost" onclick="exportSuaChua()">Xuất Excel</button></div>
  ${filterBar}
  <div class="settings-note" style="margin:14px 0 16px;">Danh sách tự động tạo từ kết quả kiểm tra ≤ 70% (trong chu kỳ hiện tại). Phương án mặc định "Cắt thay" (2 mối hàn chính thức w1/w2 + có thể thêm mối hàn biện pháp); có thể đổi sang "Hàn phủ"/"Sửa ốp" — khi đó theo dõi bằng 1 trạng thái đơn giản, không có mối hàn. Khi đợt <b>còn đang diễn ra</b>, mọi hạng mục vẫn hiển thị đầy đủ ở đây kể cả đã "Hoàn thành"/PAUT đạt. Chỉ khi <b>đóng đợt</b> (ở tab Đợt kiểm tra/sửa chữa), các hạng mục mới chuyển hẳn sang tab Lịch sử &amp; xu hướng.</div>
  ${items || '<div class="empty">Không có hạng mục nào khớp bộ lọc hiện tại.</div>'}`;
}

/* ---------- LỊCH SỬ & XU HƯỚNG ---------- */
function pipeHistoryMap(){
  const map = {};
  state.kiemTra.forEach(k=>{
    const key = pipeKeyOf(k);
    if(!map[key]) map[key]=[];
    map[key].push(k);
  });
  Object.values(map).forEach(arr=>arr.sort((a,b)=>a.ngay.localeCompare(b.ngay)));
  return map;
}
function computeTrend(history){
  if(history.length<2) return null;
  const t0 = new Date(history[0].ngay).getTime();
  const xs = history.map(h=>(new Date(h.ngay).getTime()-t0)/(1000*60*60*24*365));
  const ys = history.map(h=>parseFloat(h.chieuDayDo));
  const n=xs.length, sumX=xs.reduce((a,b)=>a+b,0), sumY=ys.reduce((a,b)=>a+b,0);
  const sumXY=xs.reduce((a,x,i)=>a+x*ys[i],0), sumXX=xs.reduce((a,x)=>a+x*x,0);
  const denom=(n*sumXX-sumX*sumX);
  if(denom===0) return null;
  const slope=(n*sumXY-sumX*sumY)/denom, intercept=(sumY-slope*sumX)/n;
  return {slope, intercept, t0, lastX:xs[xs.length-1]};
}
function projectRepairDate(trend, chieuDayTK){
  if(!trend || trend.slope>=-0.0001) return null;
  const nguong = chieuDayTK*0.7;
  const xTarget = (nguong - trend.intercept)/trend.slope;
  if(xTarget <= trend.lastX) return {overdue:true};
  const ms = trend.t0 + xTarget*365*24*60*60*1000;
  return {overdue:false, date:new Date(ms)};
}
function historySvg(history, chieuDayTK){
  const w=620,h=130,pad=30;
  const vals = history.map(h=>parseFloat(h.chieuDayDo));
  const dates = history.map(h=>new Date(h.ngay).getTime());
  const minV = Math.min(...vals, chieuDayTK*0.7)*0.93;
  const maxV = Math.max(...vals, chieuDayTK)*1.05;
  const minD = Math.min(...dates), maxD = Math.max(...dates);
  const xScale = d => dates.length>1 ? pad+(d-minD)/((maxD-minD)||1)*(w-2*pad) : w/2;
  const yScale = v => h-pad-(v-minV)/((maxV-minV)||1)*(h-2*pad);
  const pts = history.map((hh,i)=>xScale(dates[i])+','+yScale(vals[i])).join(' ');
  const thresholdY = yScale(chieuDayTK*0.7);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:620px;background:#0d1b26;border:1px solid var(--border);border-radius:8px;">
    <line x1="${pad}" y1="${thresholdY.toFixed(1)}" x2="${w-pad}" y2="${thresholdY.toFixed(1)}" stroke="#e2564f" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${w-pad}" y="${(thresholdY-5).toFixed(1)}" text-anchor="end" font-size="9" fill="#e2564f" font-family="monospace">ngưỡng 70%</text>
    <polyline points="${pts}" fill="none" stroke="#e08a3c" stroke-width="2"/>
    ${history.map((hh,i)=>`<circle cx="${xScale(dates[i]).toFixed(1)}" cy="${yScale(vals[i]).toFixed(1)}" r="3" fill="#e08a3c"/>`).join('')}
  </svg>`;
}
window.toggleHistoryExpand = function(key){ state.expandedHistory = state.expandedHistory===key? null : key; render(); };
window.toggleOldCycles = function(key){ state.expandedOldCycles = state.expandedOldCycles===key? null : key; render(); };
function renderHistory(){
  const map = pipeHistoryMap();
  const keys = Object.keys(map);
  const summaries = keys.map(key=>{
    const fullHist = map[key];
    const completedCycles = state.suaChua.filter(s=>s.pipeKey===key && s.trangThai==='Hoàn thành').sort((a,b)=>a.chuKy-b.chuKy);
    // chia lịch sử đo thành các chu kỳ, ranh giới là ngày hoàn thành thay ống của từng đợt sửa chữa trước đó
    let prevBoundary = null, oldSegments = [];
    completedCycles.forEach(c=>{
      const seg = fullHist.filter(h=> (prevBoundary? h.ngay>prevBoundary : true) && h.ngay<=c.ngayHoanThanh);
      oldSegments.push({records:seg, ngayHoanThanh:c.ngayHoanThanh, chuKy:c.chuKy});
      prevBoundary = c.ngayHoanThanh;
    });
    const currentHist = fullHist.filter(h=> prevBoundary? h.ngay>prevBoundary : true);
    const last = currentHist.length ? currentHist[currentHist.length-1] : fullHist[fullHist.length-1];
    const chieuDayTK = parseFloat(last.chieuDayTK);
    const trend = currentHist.length>=2 ? computeTrend(currentHist) : null;
    const projection = projectRepairDate(trend, chieuDayTK);
    const rateMmYear = trend ? -trend.slope : null;
    return {key, currentHist, oldSegments, last, trend, projection, rateMmYear, currentChuKy:(completedCycles.length+1)};
  });
  summaries.sort((a,b)=>{
    const da = a.projection && !a.projection.overdue ? a.projection.date.getTime() : (a.projection && a.projection.overdue ? -Infinity : Infinity);
    const db = b.projection && !b.projection.overdue ? b.projection.date.getTime() : (b.projection && b.projection.overdue ? -Infinity : Infinity);
    return da-db;
  });
  const cards = summaries.map(s=>{
    const expanded = state.expandedHistory===s.key;
    const oldExpanded = state.expandedOldCycles===s.key;
    const p = parseFloat(s.last.phanTramConLai);
    const st = p<=70?'danger':(p<=85?'warn':'good');
    const safeKey = s.key.replace(/'/g,"\\'");
    let projText;
    if(s.currentHist.length===0){
      projText = 'Ống tại vị trí này đã được thay trong chu kỳ trước, chưa có lần đo mới trong chu kỳ hiện tại (Chu kỳ '+s.currentChuKy+').';
    } else if(s.trend){
      if(s.projection && s.projection.overdue) projText = 'Đã đạt/vượt ngưỡng 70% theo xu hướng đo (Chu kỳ '+s.currentChuKy+') — cần ưu tiên xử lý ngay.';
      else if(s.projection) projText = 'Dự kiến đạt ngưỡng cắt thay (70%) vào khoảng <b>'+s.projection.date.toLocaleDateString('vi-VN')+'</b> (ước tính tuyến tính từ '+s.currentHist.length+' lần đo trong Chu kỳ '+s.currentChuKy+', chỉ mang tính tham khảo).';
      else projText = 'Số liệu chu kỳ hiện tại chưa cho thấy xu hướng mòn giảm rõ rệt — chưa thể dự báo đáng tin cậy.';
    } else {
      projText = 'Chưa đủ dữ liệu (cần ≥ 2 lần đo trong chu kỳ hiện tại) để dự báo xu hướng.';
    }
    const oldSegHtml = s.oldSegments.length ? `<div style="margin-top:12px;">
      <button class="mini-btn" onclick="toggleOldCycles('${safeKey}')">${oldExpanded?'Ẩn':'Xem'} ${s.oldSegments.length} chu kỳ trước (đã thay ống)</button>
      ${oldExpanded ? s.oldSegments.map(seg=>`<div class="settings-note" style="margin-top:8px;">Chu kỳ ${seg.chuKy} — kết thúc (thay ống) ngày ${fmtDate(seg.ngayHoanThanh)}, ${seg.records.length} lần đo trong chu kỳ.</div>
        <div class="table-wrap" style="margin-top:6px;margin-bottom:10px;"><table class="dm"><thead><tr><th>Ngày</th><th>Chiều dày đo (mm)</th><th>% còn lại</th></tr></thead><tbody>
        ${seg.records.slice().reverse().map(h=>`<tr><td>${fmtDate(h.ngay)}</td><td>${esc(h.chieuDayDo)}</td><td>${esc(h.phanTramConLai)}%</td></tr>`).join('')}
        </tbody></table></div>`).join('') : ''}
    </div>` : '';
    return `<div class="repair-item">
      <div class="repair-head" onclick="toggleHistoryExpand('${safeKey}')">
        <div><span class="tag-chip">Chu kỳ ${s.currentChuKy} · ${s.currentHist.length} lần đo</span>${esc(s.key)} ${s.rateMmYear!=null?`<span class="progress-mini">· mòn ~${s.rateMmYear.toFixed(3)}mm/năm</span>`:''}</div>
        <span class="status ${st}">${s.last.phanTramConLai}% còn lại</span>
      </div>
      ${expanded ? `<div style="margin-top:12px;">
        ${s.currentHist.length ? historySvg(s.currentHist, parseFloat(s.last.chieuDayTK)) : ''}
        <div class="settings-note">${projText}</div>
        ${s.currentHist.length ? `<div class="table-wrap" style="margin-top:10px;"><table class="dm"><thead><tr><th>Ngày</th><th>Chiều dày đo (mm)</th><th>% còn lại</th><th>Ngoại dạng</th><th>Người kiểm tra</th></tr></thead><tbody>
        ${s.currentHist.slice().reverse().map(h=>`<tr><td>${fmtDate(h.ngay)}</td><td>${esc(h.chieuDayDo)}</td><td>${esc(h.phanTramConLai)}%</td><td>${esc(h.ngoaiDang||'—')}</td><td>${esc(h.nguoiKiemTra)}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
        ${oldSegHtml}
      </div>` : ''}
    </div>`;
  }).join('');
  const completedRepairs = state.suaChua.filter(s=>{ const d = state.dots.find(x=>x.id===s.dotId); return d && d.trangThai==='Đã hoàn thành'; }).sort((a,b)=>(b.ngayHoanThanh||'').localeCompare(a.ngayHoanThanh||''));
  const repairHistCards = completedRepairs.map(item=>`<div class="record"><div class="record-top"><div class="record-loc"><span class="tag-chip">${esc(item.id)}</span>${esc(item.heThong)} - ${esc(item.thietBi)} - ${esc(item.viTri)}-${esc(item.lopOng)}</div><span class="status good">${esc(item.trangThai)}${item.ngayHoanThanh?(' '+fmtDate(item.ngayHoanThanh)):''}</span></div>
    <div class="record-meta"><span>${(item.phuongAn||'Cắt thay')}</span><span>${item.welds.filter(w=>w.loai==='chinh_thuc').length} mối hàn chính thức</span><span>${item.welds.filter(w=>w.loai==='bien_phap').length} mối hàn biện pháp</span></div></div>`).join('');
  return `<div class="page-head"><div><div class="page-eyebrow">Tra cứu · So sánh · Lập kế hoạch</div><div class="page-title">Lịch sử &amp; xu hướng mòn ống</div></div></div>
  <div class="settings-note" style="margin-bottom:16px;">Mỗi vị trí ống (theo tổ máy) được tính <b>tốc độ mòn (mm/năm)</b> chỉ dựa trên các lần đo trong <b>chu kỳ hiện tại</b> — tức là kể từ lần thay ống gần nhất (nếu có). Dữ liệu các chu kỳ trước vẫn được lưu đầy đủ để tra cứu/so sánh nhưng không được cộng dồn vào xu hướng hiện tại, tránh nhầm ống mới với ống cũ. Danh sách ưu tiên vị trí cần xử lý sớm nhất lên đầu.</div>
  ${cards || '<div class="empty">Chưa có đủ dữ liệu kiểm tra để phân tích lịch sử/xu hướng.</div>'}
  <div class="section-label">Sửa chữa đã hoàn thành (đã chuyển vào lịch sử)</div>
  ${repairHistCards || '<div class="empty">Chưa có hạng mục sửa chữa nào hoàn thành.</div>'}`;
}

function renderAnalysis(){
  const active = CAUSES.find(c=>c.id===state.activeCause) || CAUSES[0];
  const list = CAUSES.map(c=>`<button class="cause-item ${c.id===active.id?'active':''}" onclick="setCause('${c.id}')"><b>${esc(c.name)}</b>${esc(c.where)}</button>`).join('');
  return `<div class="page-head"><div><div class="page-eyebrow">Tham khảo kỹ thuật</div><div class="page-title">Phân tích nguyên nhân &amp; khuyến nghị sửa chữa</div></div></div>
  <div class="settings-note" style="margin-bottom:18px;">Nội dung tham khảo chung dựa trên các cơ chế hư hỏng ống lò hơi phổ biến. Quyết định sửa chữa thực tế cần dựa trên kiểm tra hiện trường, kết quả kim tương/NDT cụ thể và tiêu chuẩn thiết kế áp dụng (ASME, TCVN…), có phê duyệt của kỹ sư phụ trách.</div>
  <div class="cause-grid"><div class="cause-list">${list}</div>
  <div class="cause-detail"><h3>${esc(active.name)}</h3><div class="cause-sub">${esc(active.where)}</div>
  <h4>Nguyên nhân điển hình</h4><ul>${active.causes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  <h4>Dấu hiệu nhận biết</h4><ul>${active.signs.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  <h4>Phương án sửa chữa khuyến nghị</h4><ul>${active.fix.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div>`;
}

loadAll();
</script>
